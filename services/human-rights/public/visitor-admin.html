<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일반 체험 결과·후기 관리</title><link rel="stylesheet" href="/student.css"><script src="/results-model.js?v=12.9.6"></script><style>.visitorText{white-space:pre-wrap;overflow-wrap:anywhere}textarea,input{max-width:100%}</style></head><body><main class="wrap"><section class="card"><a href="/manage">← 교사 관리실</a><h1>일반 체험 결과·후기</h1><p>학생·참관 교사 기록과 분리된 일반 체험자 전용 보관함입니다.</p><a href="/experience" target="_blank">일반 체험 로그인 페이지 열기</a><label for="pin">교사 PIN</label><input id="pin" type="password" autocomplete="current-password"><p><button class="btn" id="load">기록 불러오기</button> <button class="btn secondary" id="download" disabled>결과·후기 Excel 다운로드</button></p><p id="msg" role="status"></p><p id="summary"></p></section><div id="records"></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{$('pin').value=sessionStorage.getItem('HR102_TPIN')||''}catch{}
async function request(action){const response=await fetch('/api/teacher/visitors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value,action})});if(!response.ok){const data=await response.json();throw Error(data.error||'불러오지 못했습니다.')}return response}
function date(v){return v?new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'—'}
$('load').onclick=async()=>{ $('load').disabled=true;$('download').disabled=true;$('records').replaceChildren();$('summary').textContent='';$('msg').textContent='불러오는 중…';try{const {rows}=await(await request('get')).json();$('summary').textContent=`전체 ${rows.length}명 · 정책 제출 ${rows.filter(r=>r.progress?.submitted).length}명 · 후기 ${rows.filter(r=>r.feedback).length}명`;$('records').innerHTML=rows.map(r=>`<article class="card"><h2>${esc(r.name)}</h2><p class="small muted">참여 번호 ${esc(r.id)} · 입장 ${esc(date(r.created_at))}</p><p>${r.progress?.submitted?'정책 제출 완료':'체험 중'} · 만족도 ${r.feedback?.rating?esc(r.feedback.rating)+' / 5':'미선택'}</p><h3>체험 후기</h3><div class="visitorText">${esc(r.feedback?.text||'아직 후기가 없습니다.')}</div><p class="small muted">후기 저장 ${esc(date(r.feedback?.saved_at))}</p><details><summary>체험 답안 전체 보기</summary>${ResultsModel.answers({payload:r.progress?.payload}).filter(x=>!x[0].startsWith('자기평가서')).map(([title,text])=>`<h4>${title}</h4><p class="visitorText">${esc(text||'미작성')}</p>`).join('')}</details></article>`).join('');$('msg').textContent=rows.length?'':'아직 일반 체험 기록이 없습니다.';$('download').disabled=!rows.length}catch(e){$('msg').textContent=e.message}finally{$('load').disabled=false}};
$('download').onclick=async()=>{$('download').disabled=true;try{const blob=await(await request('export')).blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='인권도시_일반체험_결과와후기.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('msg').textContent='다운로드를 시작했습니다.'}catch(e){$('msg').textContent=e.message}finally{$('download').disabled=false}};
if($('pin').value)$('load').click();
</script></body></html>
