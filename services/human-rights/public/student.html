<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>인권도시 정책결정 수행평가 v12.0</title>
<link rel="stylesheet" href="student.css" />
</head>
<body><div id="root"><div style="max-width:820px;margin:48px auto;padding:18px;font-family:system-ui,sans-serif;color:#334155"><div style="background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:20px"><b style="color:#17345f">🏛️ 인권도시 정책결정</b><h2 style="margin:10px 0 6px">학생 화면을 준비하고 있습니다.</h2><p style="margin:0;color:#667085">잠시만 기다려 주세요.</p></div></div></div>

<div class="imgZoom" id="imgZoom" aria-hidden="true">
  <div class="imgZoomBar">
    <span class="zoomGuide">이미지를 크게 보고 필요한 부분을 이동해 살펴보세요.</span>
    <button class="zoomBtn" type="button" onclick="zoomOut()">－</button>
    <button class="zoomBtn" type="button" onclick="zoomReset()">화면 맞춤</button>
    <button class="zoomBtn" type="button" onclick="zoomIn()">＋</button>
    <button class="zoomBtn closeBtn" type="button" onclick="closeZoom()">닫기</button>
  </div>
  <div class="imgZoomStage" id="imgZoomStage">
    <div class="imgZoomInner" id="imgZoomInner">
      <img id="imgZoomTarget" src="" alt="확대해서 보는 정책 자료">
    </div>
  </div>
</div>

<script src="student_1.js"></script>
<script src="student_2.js"></script>
<script>
(function(){
  const schedule=[
    ['1-1','2026-09-16','9/16(수) 3교시','2026-09-17','9/17(목) 6교시'],
    ['1-2','2026-09-15','9/15(화) 2교시','2026-09-18','9/18(금) 3교시'],
    ['1-3','2026-09-17','9/17(목) 5교시','2026-09-18','9/18(금) 5교시'],
    ['1-4','2026-09-16','9/16(수) 1교시','2026-09-17','9/17(목) 1교시'],
    ['1-5','2026-09-22','9/22(화) 3교시','2026-09-29','9/29(화) 3교시'],
    ['1-6','2026-09-23','9/23(수) 5교시','2026-09-30','9/30(수) 5교시'],
    ['1-7','2026-09-22','9/22(화) 5교시','2026-09-29','9/29(화) 5교시']
  ];
  function todaySeoul(){
    const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const o={};p.forEach(x=>o[x.type]=x.value);return o.year+'-'+o.month+'-'+o.day;
  }
  function html(){
    const today=todaySeoul();
    const rows=schedule.map(r=>{
      const t1=r[1]===today,t2=r[3]===today,active=t1||t2;
      return '<div class="hrs-row '+(active?'hrs-active':'')+'"><b class="hrs-class">'+r[0]+'</b>'+
        '<div class="hrs-cell '+(t1?'hrs-today':'')+'"><span>1차시</span><strong>'+r[2]+'</strong>'+(t1?'<em>● 오늘 수행평가</em>':'')+'</div>'+
        '<div class="hrs-cell '+(t2?'hrs-today':'')+'"><span>2차시</span><strong>'+r[4]+'</strong>'+(t2?'<em>● 오늘 수행평가</em>':'')+'</div></div>';
    }).join('');
    return '<section class="card hrs-card"><div class="hrs-head"><div><div class="kicker">📅 수행평가 일정 안내</div><h2>1학년 통합사회 · 인권 도시 수행평가</h2></div><small>자신의 반 일정을 확인하세요.</small></div><div class="hrs-table"><div class="hrs-header"><span>반</span><span>1차시</span><span>2차시</span></div>'+rows+'</div><p class="hrs-foot">※ 수행평가는 선생님의 안내에 따라 시작하세요. 당일 일정은 자동으로 강조됩니다.</p></section>';
  }
  const style=document.createElement('style');
  style.textContent='.hrs-card{border:1px solid #cbdaf0;background:linear-gradient(180deg,#fff,#f8fbff)}.hrs-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px}.hrs-head h2{margin:4px 0 0;color:#17345f}.hrs-head small{color:#64748b}.hrs-table{border:1px solid #d9e3f0;border-radius:14px;overflow:hidden;background:#fff}.hrs-header,.hrs-row{display:grid;grid-template-columns:72px 1fr 1fr}.hrs-header{background:#eef4fb;font-size:12px;font-weight:800;color:#475569}.hrs-header span{padding:9px;text-align:center}.hrs-row{border-top:1px solid #e6edf5}.hrs-class{display:flex;align-items:center;justify-content:center;color:#17345f;background:#fbfdff}.hrs-cell{display:flex;align-items:center;gap:8px;min-height:50px;padding:9px 12px;border-left:1px solid #edf2f7}.hrs-cell>span{font-size:11px;font-weight:800;color:#5b6f8c;background:#f1f5f9;border-radius:999px;padding:4px 7px;white-space:nowrap}.hrs-cell strong{font-size:15px}.hrs-cell em{margin-left:auto;font-style:normal;font-size:11px;font-weight:900;color:#b45309;background:#fff;border:1px solid #f59e0b;border-radius:999px;padding:4px 7px;white-space:nowrap}.hrs-active{outline:2px solid #f59e0b;outline-offset:-2px;background:#fff9eb}.hrs-active .hrs-class{background:#fff5d8;color:#9a4c00}.hrs-today{background:#fff3cd;color:#9a4c00}.hrs-today strong{color:#b45309;font-weight:900}.hrs-today>span{background:#f59e0b;color:#fff}.hrs-foot{margin:10px 0 0;font-size:12px;color:#64748b}@media(max-width:620px){.hrs-head{display:block}.hrs-head small{display:block;margin-top:6px}.hrs-header{display:none}.hrs-table{border:0;background:transparent}.hrs-row{grid-template-columns:58px 1fr;grid-template-areas:"c a" "c b";margin-top:8px;border:1px solid #dfe7f1;border-radius:12px;overflow:hidden}.hrs-class{grid-area:c}.hrs-cell:nth-child(2){grid-area:a}.hrs-cell:nth-child(3){grid-area:b;border-top:1px solid #edf2f7}.hrs-cell{min-height:48px}.hrs-cell em{font-size:10px;padding:3px 6px}}';
  document.head.appendChild(style);
  if(typeof loginView!=='function')return;
  const base=loginView;
  loginView=function(){base();const card=document.getElementById('sid')?.closest('.card');if(card&&!document.querySelector('.hrs-card'))card.insertAdjacentHTML('beforebegin',html());};
})();
</script>
<script src="student_3.js"></script>
</body>
</html>
