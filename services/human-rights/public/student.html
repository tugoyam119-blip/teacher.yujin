<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>인권도시 정책결정 수행평가 v10.9</title>
<link rel="stylesheet" href="student.css" />
</head>
<body><div id="root"><div style="max-width:820px;margin:48px auto;padding:18px;font-family:system-ui,sans-serif;color:#334155"><div style="background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:20px"><b style="color:#17345f">🏛️ 인권도시 정책결정</b><h2 style="margin:10px 0 6px">학생 화면을 준비하고 있습니다.</h2><p style="margin:0;color:#667085">잠시만 기다려 주세요.</p></div></div></div>

<div class="imgZoom" id="imgZoom" aria-hidden="true">
  <div class="imgZoomBar">
    <span class="zoomGuide">이미지를 크게 보고 필요한 부분을 이동해 살펴보세요.</span>
    <button class="zoomBtn" type="button" onclick="zoomOut()">－</button>
    <button class="zoomBtn" type="button" onclick="zoomReset()">화면 맞춤</button>
    <button class="zoomBtn" type="button" onclick="zoomIn()">＋</button>
    <button class="zoomBtn closeBtn" type="button" onclick="closeZoom()">닫기</button>
  </div>
  <div class="imgZoomStage" id="imgZoomStage">
    <div class="imgZoomInner" id="imgZoomInner">
      <img id="imgZoomTarget" src="" alt="확대해서 보는 정책 자료">
    </div>
  </div>
</div>

<script src="student_1.js"></script>
<script src="student_2.js"></script>
<script src="student_3.js"></script>
</body>
</html>
