 ['ev_hospital_mob','대학병원역 교통약자 추정 이용객 2,140명','usage'],['ev_central_all','새봄중앙역 하루 이용객 18,400명','usage'],['ev_welfare_ratio','복지센터역은 교통약자 이용 비율이 가장 높음','usage'],['ev_welfare_center','복지센터역에서 장애인종합복지관까지 180m','map'],['ev_hospital_access','대학병원역은 진료·치료 목적 이동과 직접 연결','map'],['ev_market_elder','전통시장역은 시장·노인복지관 생활 이동과 연결','map'],['ev_school_route','새봄고역은 특수학급 통학로와 연결','map'],['ev_school_cost','새봄고역은 기존 시설 활용으로 8억 원','structure'],['ev_path','엘리베이터 수보다 지상~승강장의 끊김 없는 연결이 중요','structure'],['ev_wheel_voice','복지센터역 계단 때문에 우회·택시를 이용하는 시민 사례','voices'],['ev_hospital_voice','진료 뒤 계단 이동이 위험하다는 보호자 사례','voices'],['ev_budget50','이번 사업에서 사용할 수 있는 예산은 최대 50억 원','budget']

function normalizeState(x){return {schemaVersion:10,step:0,seen:[],quizDone:{},evidence:[],policyStations:[],criteria:[],rights:[],answer1:'',beneficiaries:[],delayed:[],limitation:'',remedy:'',answer2:'',newImpacts:[],impactStrength:'',finalDecision:'',finalStations:[],answer3:'',submitted:false,receiptTime:'',_client_updated_at:0,...x,quizDone:x.quizDone||{},seen:x.seen||[],evidence:x.evidence||[],policyStations:x.policyStations||[],criteria:x.criteria||[],rights:x.rights||[],beneficiaries:x.beneficiaries||[],delayed:x.delayed||[],newImpacts:x.newImpacts||[],finalStations:x.finalStations||[]}}
function localKey(){return student?'HR10_PROGRESS_'+student.student_id:'HR10_PROGRESS_DEMO'}
function loadLocal(){try{let k=student?'HR10_PROGRESS_'+student.student_id:'HR10_PROGRESS_DEMO';return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function n(v){return Number(v||0).toLocaleString('ko-KR')}
function sName(id){return STATIONS.find(s=>s.id===id)?.name||id}

function remedyName(id){return REMEDIES.find(x=>x[0]===id)?.[1]||id}

function cost(ids,final=false){return ids.reduce((a,id)=>a+(final?(FINAL_COST[id]||0):(STATIONS.find(s=>s.id===id)?.cost||0)),0)}
function progress(){let steps=8;return `<div class="progress">${Array.from({length:steps},(_,i)=>`<i class="${i<=state.step?'on':''}"></i>`).join('')}</div>`}
function timeLabel(){if(!student||!API_MODE)return '';let r=Number(session.remaining_seconds??5400),e=Number(session.extra_seconds||0);if(r>0){let m=Math.ceil(r/60);return ` · 남은 ${m}분`}return e>0?` · 추가 ${Math.ceil(e/60)}분`:''}
function top(studentView=true){return `<div class="top"><b>🏛️ 인권도시 정책결정</b><span class="version">${studentView?'STUDENT':'TEACHER'} · ${VERSION}${studentView?timeLabel():''}</span></div>`}
function shell(body,{studentView=true,bottom=''}={}){return `${top(studentView)}<div class="${studentView?'wrap':'teacherWrap'}">${studentView?progress():''}${body}</div>${studentView&&!state.submitted?`<button class="drawerBtn" onclick="toggleDrawer()">🧭 내 정책 보드</button><div class="saveState ${saveKind}">${esc(saveText)}</div>`:''}${bottom}`}
function bottomBar(nextLabel,nextFn,enabled=true,backFn=null){return `<div class="bottom"><div class="bottomInner">${backFn?`<button class="btn secondary" onclick="${backFn}">이전</button>`:''}<button class="btn" ${enabled?'':'disabled'} onclick="${nextFn}">${nextLabel}</button></div></div>`}
function toggleDrawer(){drawerOpen=!drawerOpen;renderDrawer()}
function renderDrawer(){document.querySelectorAll('#drawerOverlay,#drawer').forEach(x=>x.remove());if(!drawerOpen)return;let body=`<div id="drawerOverlay" class="overlay" onclick="toggleDrawer()"></div><aside id="drawer" class="drawer"><div class="between"><h2>🧭 내 정책 보드</h2><button class="btn secondary sm" onclick="toggleDrawer()">닫기</button></div><div class="stat"><span>1차 정책</span><b style="font-size:16px">${state.policyStations.length?state.policyStations.map(sName).join(' · '):'아직 선택 전'}</b></div><div class="stat"><span>예산</span><b style="font-size:16px">${state.policyStations.length?cost(state.policyStations)+'억 / 50억':'-'}</b></div><h3>핵심 근거</h3>${state.evidence.length?state.evidence.map(x=>`<div class="evidence">⭐ ${esc(evidenceName(x))}</div>`).join(''):'<p class="muted">아직 고른 근거가 없습니다.</p>'}<h3>정책 기준</h3><div>${state.criteria.map(x=>`<span class="chip">${esc(cName(x))}</span>`).join('')||'<span class="muted">아직 선택 전</span>'}</div><h3>관련 권리</h3><div>${state.rights.map(x=>`<span class="chip">${esc(rName(x))}</span>`).join('')||'<span class="muted">아직 선택 전</span>'}</div>${state.beneficiaries.length?`<h3>정책 영향</h3><p><b>먼저 도움:</b> ${state.beneficiaries.map(citizenName).join(', ')}</p><p><b>상대적으로 기다림:</b> ${state.delayed.map(citizenName).join(', ')}</p>`:''}<details><summary>내가 쓴 답안 보기</summary>${state.answer1?`<p><b>정책 선택 이유</b><br>${esc(state.answer1)}</p>`:''}${state.answer2?`<p><b>정책 영향과 보완</b><br>${esc(state.answer2)}</p>`:''}${state.answer3?`<p><b>최종 판단</b><br>${esc(state.answer3)}</p>`:''}${!state.answer1&&!state.answer2&&!state.answer3?'<p class="muted">아직 작성한 답안이 없습니다.</p>':''}</details></aside>`;document.body.insertAdjacentHTML('beforeend',body)}
function setSave(kind,text){saveKind=kind;saveText=text;let e=document.querySelector('.saveState');if(e){e.className='saveState '+kind;e.textContent=text}}
function saveLocal(){if(!student)return;state._client_updated_at=Date.now();localStorage.setItem(localKey(),JSON.stringify(state));setSave('','기기에 저장됨')}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청을 처리하지 못했습니다.');return j}
function queueSave(){saveLocal();clearTimeout(saveTimer);if(API_MODE&&!state.submitted&&session.is_open){setSave('','저장 중…');saveTimer=setTimeout(saveRemote,700)}}
async function saveRemote(){if(!student||!API_MODE||state.submitted||!session.is_open)return;try{await api('/api/save',{method:'POST',body:JSON.stringify({student_id:student.student_id,name:student.name,payload:state})});setSave('ok','저장 완료')}catch(e){setSave('warn','기기에 저장됨 · 연결 확인 필요')}}
async function loadProgress(){if(!student)return;let local=loadLocal(),remote=null;if(API_MODE){try{let x=await api('/api/progress?student_id='+encodeURIComponent(student.student_id));let epoch=Number(x.reset_epoch||0);if(epoch>serverResetEpoch){localStorage.removeItem(localKey());local=null;serverResetEpoch=epoch;localStorage.setItem('HR10_RESET_EPOCH',String(epoch));}remote=(x.payload&&Number(x.payload.schemaVersion)===10)?x.payload:null;session=x.time||session;if(x.submitted&&remote){state=normalizeState(remote);state.submitted=true;state.receiptTime=x.submitted_at||'';saveLocal();return}}catch(e){}}if(local&&remote)state=normalizeState((+local._client_updated_at>=+remote._client_updated_at)?local:remote);else state=normalizeState(local||remote||{});saveLocal()}
async function refreshSession(){if(!API_MODE)return;try{let q=student?'?student_id='+encodeURIComponent(student.student_id):'';let b=await api('/api/bootstrap'+q);let epoch=Number(b.reset_epoch||0);if(student&&epoch>serverResetEpoch){localStorage.removeItem(localKey());state=normalizeState({});serverResetEpoch=epoch;localStorage.setItem('HR10_RESET_EPOCH',String(epoch));}session=b.session||session;if(!session.is_open&&!teacherMode){render()}}catch(e){}}
function heartbeatBody(){return {student_id:student.student_id,step:state.step,submitted:state.submitted,active:document.visibilityState==='visible',answer1_length:state.answer1.length,answer2_length:state.answer2.length,answer3_length:state.answer3.length}}
async function heartbeatNow(){if(!API_MODE||!student)return;try{let x=await api('/api/heartbeat',{method:'POST',body:JSON.stringify(heartbeatBody())});session=x.session||session;if(!session.is_open&&!state.submitted)render();else{let e=document.querySelector('.version');if(e)e.textContent=`STUDENT · ${VERSION}${timeLabel()}`}}catch(e){}}
function startHeartbeat(){clearInterval(heartbeatTimer);if(!API_MODE||!student)return;heartbeatTimer=setInterval(()=>{if(document.visibilityState==='visible')heartbeatNow()},15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')heartbeatNow()})}
function qualityError(text,min){let t=(text||'').trim();if(t.length<min)return `최소 ${min}자 이상 작성하세요.`;if(/(.)\1{6,}/.test(t))return '같은 문자나 기호가 지나치게 반복되고 있습니다. 자신의 판단을 문장으로 작성하세요.';let letters=(t.match(/[가-힣A-Za-z0-9]/g)||[]).length;if(letters<Math.max(25,min*.45))return '자신의 판단이 드러나도록 문장으로 작성하세요.';return ''}
function charBox(id,value,min,maxHint){return `<textarea id="${id}" maxlength="300" oninput="liveCount('${id}','${id}Count')">${esc(value)}</textarea><div class="count"><span id="${id}Count">${value.length}</span>자 · 권장 ${maxHint}</div><p class="help">길게 쓰기보다 선택한 근거가 서로 어떻게 연결되는지 분명하게 설명하세요.</p>`}
function liveCount(id,cid){document.getElementById(cid).textContent=document.getElementById(id).value.length}
function goStep(v){state.step=v;queueSave();render();scrollTo(0,0)}
function studentHeader(title,desc){return `<section class="card hero"><div class="kicker">새봄시 시장 정책과제</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</section>`}
function loginView(){let body=`${studentHeader('당신은 새봄시의 시장입니다.','시민의 이동권을 넓히기 위해 지하철 엘리베이터 우선 설치 지역을 결정하세요.')}<section class="card"><div class="grid grid3"><div class="stat"><span>생각할 것 1</span><b>👥 시민</b><p class="small">누구에게 가장 필요한가?</p></div><div class="stat"><span>생각할 것 2</span><b>⚖️ 권리</b><p class="small">어떤 권리를 우선할까?</p></div><div class="stat"><span>생각할 것 3</span><b>💰 예산</b><p class="small">50억 원을 어떻게 쓸까?</p></div></div></section><section class="card"><label>학번</label><input id="sid" inputmode="numeric" placeholder="예: 10101"><label>이름</label><input id="sname" placeholder="예: 김민서"><div style="height:10px"></div><button class="btn" onclick="loginStudent()">새봄시 시장으로 입장하기</button><div id="loginMsg"></div></section>`;root.innerHTML=shell(body,{bottom:''});document.querySelector('.drawerBtn')?.remove();document.querySelector('.saveState')?.remove()}
async function loginStudent(){let id=document.getElementById('sid').value.trim(),name=document.getElementById('sname').value.trim(),msg=document.getElementById('loginMsg'),x=null;if(!id||!name){msg.innerHTML='<div class="notice warn">학번과 이름을 모두 입력하세요.</div>';return}if(API_MODE){try{msg.innerHTML='<div class="notice">입장 정보를 확인하고 있습니다.</div>';x=await api('/api/login',{method:'POST',body:JSON.stringify({student_id:id,name})});session=x.session||session}catch(e){msg.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>';return}}student={student_id:id,name:x?.name||name};localStorage.setItem('HR10_STUDENT',JSON.stringify(student));await loadProgress();startHeartbeat();render()}
function waitView(){let body=`${studentHeader('활동 준비 중입니다.','선생님이 활동을 시작하면 이 화면에서 이어서 진행할 수 있습니다.')}<section class="card"><p>지금까지 작성한 내용은 그대로 보관되어 있습니다.</p><button class="btn" onclick="location.reload()">활동 시작 확인</button></section>`;root.innerHTML=shell(body,{bottom:''})}
function step0(){let body=`${studentHeader('시장님께 첫 정책과제가 도착했습니다.','새봄시는 모든 시민이 지하철을 더 안전하고 편리하게 이용할 수 있도록 엘리베이터를 추가하려 합니다.')}<section class="card"><h2>🎯 이번 과제</h2><p style="font-size:19px;font-weight:800">최대 <b>50억 원</b> 안에서 엘리베이터를 먼저 설치할 역을 결정하세요.</p><div class="notice"><b>정답은 하나가 아닙니다.</b><br>누구의 필요를 중요하게 보았는지, 어떤 자료를 근거로 판단했는지가 중요합니다.</div></section><section class="card"><h3>활동 흐름</h3><div class="grid grid3"><div class="stat"><span>1차시</span><b style="font-size:16px">자료 → 정책 만들기</b></div><div class="stat"><span>2차시</span><b style="font-size:16px">정책 영향 → 새 정보</b></div><div class="stat"><span>마지막</span><b style="font-size:16px">최종 정책 결정</b></div></div></section>`;root.innerHTML=shell(body,{bottom:bottomBar('정책 자료실로 이동','goStep(1)',true)})}
function step1(){let allDone=RESOURCES.every(r=>state.quizDone[r.id]);let body=`${studentHeader('STEP 1. 정책 자료실','5개의 자료를 살펴보고, 내 정책을 만들 때 중요하다고 생각한 근거를 자료함에 담으세요.')}<section class="card"><div class="between"><div><b>자료 확인</b><p class="small muted" style="margin:3px 0">${Object.keys(state.quizDone).length}/5 완료</p></div><div><b>내 자료함</b><p class="small muted" style="margin:3px 0">${state.evidence.length}/4개 선택</p></div></div><div class="notice">자료를 모두 확인한 뒤, <b>정책 근거로 활용하고 싶은 정보 3~4개</b>를 골라두세요.</div></section>${RESOURCES.map(resourceCard).join('')}<section class="card"><h2>⭐ 내 자료함</h2>${state.evidence.length?state.evidence.map(x=>`<div class="evidence on">${esc(evidenceName(x))}</div>`).join(''):'<p class="muted">자료에서 중요한 정보를 선택하면 이곳에 모입니다.</p>'}</section>`;let enabled=allDone&&state.evidence.length>=3&&state.evidence.length<=4;root.innerHTML=shell(body,{bottom:bottomBar('50억 정책 만들기','goStep(2)',enabled,'goStep(0)')})}
function resourceCard(r){let done=!!state.quizDone[r.id];let evs=EVIDENCE.filter(x=>x[2]===r.id);return `<section class="resource ${done?'done':''}"><div class="between"><h3>${r.icon} ${r.title}</h3><span class="tag">${done?'확인 완료':'확인 필요'}</span></div><p>${r.summary}</p>${r.facts.map(f=>`<div class="metric"><span>${esc(f)}</span></div>`).join('')}<h4>정책 근거로 저장하기</h4>${evs.map(e=>`<div class="evidence ${state.evidence.includes(e[0])?'on':''}" onclick="toggleEvidence('${e[0]}')">${state.evidence.includes(e[0])?'⭐':'☆'} ${esc(e[1])}</div>`).join('')}<div style="height:8px"></div>${done?'<div class="notice good">자료 확인을 마쳤습니다.</div>':`<button class="btn secondary" onclick="openQuiz('${r.id}')">자료 확인문제 풀기</button>`}</section>`}
function toggleEvidence(id){if(!ALLOWED_EVIDENCE.has(id))return;if(state.evidence.includes(id))state.evidence=state.evidence.filter(x=>x!==id);else if(state.evidence.length<4)state.evidence.push(id);else return alert('핵심 근거는 최대 4개까지 고를 수 있습니다.');queueSave();render()}
function openQuiz(id){let r=RESOURCES.find(x=>x.id===id),q=r.quiz;let box=`<div class="overlay" id="qov"></div><div class="drawer" id="qbox"><h2>${r.icon} 자료 확인</h2><p><b>${q.q}</b></p>${q.c.map((x,i)=>`<button class="quizOpt" onclick="answerQuiz('${id}',${i})">${i+1}. ${esc(x)}</button>`).join('')}<p class="help">자료를 다시 살펴보고 답해도 괜찮습니다.</p></div>`;document.body.insertAdjacentHTML('beforeend',box)}
function answerQuiz(id,i){let r=RESOURCES.find(x=>x.id===id);if(i!==r.quiz.a){alert('자료를 다시 확인해 보세요.');return}state.quizDone[id]=true;if(!state.seen.includes(id))state.seen.push(id);queueSave();document.getElementById('qov')?.remove();document.getElementById('qbox')?.remove();render()}
function step2(){let c=cost(state.policyStations),over=c>50;let body=`${studentHeader('STEP 2. 50억 정책 설계실','후보역을 비교해 2곳 이상을 선택하세요. 총사업비는 50억 원을 넘을 수 없습니다.')}<section class="card"><div class="between"><div><b>현재 사업비</b><div class="timer">${c}억 / 50억</div></div><div><b>남은 예산</b><div class="timer">${Math.max(0,50-c)}억</div></div></div><div class="budgetbar ${over?'over':''}"><i style="width:${Math.min(100,c/50*100)}%"></i></div>${over?'<div class="notice bad">예산을 초과했습니다. 설치역을 다시 조정하세요.</div>':''}</section><div class="grid grid2">${STATIONS.map(stationCard).join('')}</div><section class="card"><h2>시장님이 가장 중요하게 본 기준 2개</h2><p class="muted">정책을 결정할 때 무엇을 우선했는지 선택하세요.</p><div class="grid grid2">${CRITERIA.map(x=>choiceCard('criteria',x[0],`${x[1]} ${x[2]}`,x[3],state.criteria.includes(x[0]))).join('')}</div></section>`;let enabled=state.policyStations.length>=2&&!over&&state.criteria.length===2;root.innerHTML=shell(body,{bottom:bottomBar('정책 근거 보드로 이동','goStep(3)',enabled,'goStep(1)')})}
function stationCard(s){let on=state.policyStations.includes(s.id);return `<div class="choice ${on?'on':''}" onclick="toggleStation('${s.id}',false)"><div class="between"><h3>🚉 ${s.name}</h3><b>${s.cost}억</b></div><p>${s.facility}</p><p style="margin-top:7px;color:var(--ink)">${s.need}</p><div>${s.stars.map(x=>`<span class="chip gray">${x}</span>`).join('')}</div></div>`}
function choiceCard(type,id,title,desc,on){return `<div class="choice ${on?'on':''}" onclick="toggleChoice('${type}','${id}')"><h3>${title}</h3><p>${desc}</p></div>`}
function toggleStation(id,finalMode){let arr=finalMode?state.finalStations:state.policyStations;if(arr.includes(id))arr.splice(arr.indexOf(id),1);else arr.push(id);if(finalMode)state.finalStations=arr;else state.policyStations=arr;queueSave();render()}
function toggleChoice(type,id){let arr=state[type]||[];let max=2;if(arr.includes(id))arr=arr.filter(x=>x!==id);else if(arr.length<max)arr.push(id);else return alert('2개까지 선택할 수 있습니다.');state[type]=arr;queueSave();render()}
function step3(){let body=`${studentHeader('STEP 3. 정책 근거 보드','지금까지 고른 자료와 정책 기준을 인권과 연결해 보세요.')}<section class="board"><div class="muted">내 1차 정책</div><h2>${state.policyStations.map(sName).join(' + ')}</h2><p>총 ${cost(state.policyStations)}억 원</p><hr style="border:0;border-top:1px solid rgba(255,255,255,.18)"><div class="muted">내가 고른 핵심 근거</div>${state.evidence.map(x=>`<div style="margin:7px 0">⭐ ${esc(evidenceName(x))}</div>`).join('')}<div class="muted" style="margin-top:12px">내가 중요하게 본 기준</div><div>${state.criteria.map(x=>`<span class="chip">${esc(cName(x))}</span>`).join('')}</div></section><section class="card"><h2>⚖️ 이 정책과 연결되는 권리</h2><p>가장 중요한 권리 1개를 고르고, 필요하면 관련 권리 1개를 더 고르세요.</p><div class="grid grid2">${RIGHTS.map(x=>choiceCard('rights',x[0],`${x[1]} ${x[2]}`,x[3],state.rights.includes(x[0]))).join('')}</div></section>${state.rights.length?`<section class="card"><h2>🧩 내 정책 판단 연결도</h2><div class="grid grid3"><div class="stat"><span>근거</span><b style="font-size:15px">${esc(evidenceName(state.evidence[0]))}</b></div><div class="stat"><span>중요 기준</span><b style="font-size:15px">${esc(cName(state.criteria[0]))}</b></div><div class="stat"><span>관련 권리</span><b style="font-size:15px">${esc(rName(state.rights[0]))}</b></div></div><div class="arrow">↓</div><div class="notice good"><b>나의 정책:</b> ${state.policyStations.map(sName).join(' + ')}</div><p class="help">위 연결도는 시장님이 직접 고른 정보를 정리한 것입니다. 이 정보를 이용해 자신의 판단을 문장으로 설명하세요.</p></section>`:''}<section class="card"><h2>핵심 판단 ① 왜 이 정책을 선택했나요?</h2><p>선택한 <b>자료·정책 기준·인권</b>을 서로 연결하여 설명하세요.</p>${charBox('answer1',state.answer1,100,'120~180자')}<div id="a1msg"></div></section>`;let enabled=state.rights.length>=1&&state.rights.length<=2&&qualityError(state.answer1,100)==='';root.innerHTML=shell(body,{bottom:bottomBar('정책 영향 살펴보기','saveAnswer1()',enabled,'goStep(2)')});document.getElementById('answer1').addEventListener('input',e=>{state.answer1=e.target.value;queueSave();let ok=state.rights.length>=1&&qualityError(state.answer1,100)==='';document.querySelector('.bottom .btn:last-child').disabled=!ok})}
function saveAnswer1(){let e=qualityError(state.answer1,100);if(e){document.getElementById('a1msg').innerHTML='<div class="notice warn">'+esc(e)+'</div>';return}goStep(4)}
function citizenCard(id,mode){let x=CITIZENS.find(c=>c[0]===id),arr=state[mode];return `<div class="choice citizen ${arr.includes(id)?'on':''}" onclick="toggleCitizen('${mode}','${id}')"><b>${x[1]} ${x[2]}</b></div>`}
function toggleCitizen(mode,id){let arr=state[mode]||[];if(arr.includes(id))arr=arr.filter(x=>x!==id);else if(arr.length<2)arr.push(id);else return alert('최대 2개까지 선택할 수 있습니다.');state[mode]=arr;queueSave();render()}
function step4(){let body=`${studentHeader('STEP 4. 누가 먼저 도움받고, 누가 기다릴까?','정책은 모든 시민에게 같은 영향을 주지 않습니다. 내가 만든 정책의 혜택과 한계를 함께 살펴보세요.')}<section class="card"><div class="grid grid2"><div><h2>🟢 먼저 도움받는 시민</h2><p class="muted">1~2개 선택</p>${CITIZENS.map(x=>citizenCard(x[0],'beneficiaries')).join('')}</div><div><h2>🟠 상대적으로 기다리는 시민</h2><p class="muted">1~2개 선택</p>${CITIZENS.map(x=>citizenCard(x[0],'delayed')).join('')}</div></div></section><section class="card"><h2>내 정책의 가장 큰 걱정거리는?</h2>${LIMITS.map(x=>`<div class="choice ${state.limitation===x[0]?'on':''}" onclick="setOne('limitation','${x[0]}')"><b>${x[1]}</b></div>`).join('')}</section><section class="card"><h2>그 문제를 어떻게 줄일 수 있을까요?</h2>${REMEDIES.map(x=>`<div class="choice ${state.remedy===x[0]?'on':''}" onclick="setOne('remedy','${x[0]}')"><b>${x[1]}</b></div>`).join('')}</section><section class="card"><h2>핵심 판단 ② 정책의 영향과 보완</h2><p>상대적으로 기다려야 하는 시민을 짚고, 그 문제를 줄이기 위한 방법을 설명하세요.</p>${charBox('answer2',state.answer2,60,'80~120자')}<div id="a2msg"></div></section>`;let enabled=state.beneficiaries.length>=1&&state.delayed.length>=1&&state.limitation&&state.remedy&&!hasOverlap()&&qualityError(state.answer2,60)==='';root.innerHTML=shell(body,{bottom:bottomBar('새로운 정책 정보 확인','saveAnswer2()',enabled,'goStep(3)')});document.getElementById('answer2').addEventListener('input',e=>{state.answer2=e.target.value;queueSave();let ok=state.beneficiaries.length>=1&&state.delayed.length>=1&&state.limitation&&state.remedy&&!hasOverlap()&&qualityError(state.answer2,60)==='';document.querySelector('.bottom .btn:last-child').disabled=!ok})}
function hasOverlap(){return state.beneficiaries.some(x=>state.delayed.includes(x))}
function setOne(k,v){state[k]=v;queueSave();render()}
function saveAnswer2(){if(hasOverlap()){document.getElementById('a2msg').innerHTML='<div class="notice warn">같은 시민 집단을 두 칸에 동시에 넣지 않도록 다시 선택하세요.</div>';return}let e=qualityError(state.answer2,60);if(e){document.getElementById('a2msg').innerHTML='<div class="notice warn">'+esc(e)+'</div>';return}goStep(5)}
function step5(){let body=`${studentHeader('STEP 5. 새로운 정책 정보','정책을 결정한 뒤에도 상황은 달라질 수 있습니다. 새 정보를 보고 기존 판단에 어떤 영향이 있는지 살펴보세요.')}<section class="card"><div class="kicker">긴급 정책 보고</div><h2>${NEW_INFO.title}</h2>${NEW_INFO.items.map(x=>`<div class="notice"><h3 style="margin:0 0 5px">${x.icon} ${x.title}</h3><p style="margin:0">${x.text}</p></div>`).join('')}</section><section class="card"><h2>이 정보는 내 정책의 무엇을 바꾸나요?</h2><p class="muted">1개 이상 선택하세요.</p><div class="grid grid2">${NEW_INFO.impacts.map(x=>`<div class="choice ${state.newImpacts.includes(x[0])?'on':''}" onclick="toggleImpact('${x[0]}')"><b>${x[1]}</b></div>`).join('')}</div></section><section class="card"><h2>내 기존 정책에 미치는 영향은?</h2><div class="grid grid3">${[['small','🟢 거의 없음'],['medium','🟡 어느 정도 있음'],['large','🔴 매우 큼']].map(x=>`<div class="choice ${state.impactStrength===x[0]?'on':''}" onclick="setOne('impactStrength','${x[0]}')"><b>${x[1]}</b></div>`).join('')}</div></section>`;let enabled=state.newImpacts.length>=1&&state.impactStrength;root.innerHTML=shell(body,{bottom:bottomBar('최종 정책 결정하기','prepareFinal()',enabled,'goStep(4)')})}
function toggleImpact(id){if(id==='none'){state.newImpacts=state.newImpacts.includes('none')?[]:['none']}else{state.newImpacts=state.newImpacts.filter(x=>x!=='none');if(state.newImpacts.includes(id))state.newImpacts=state.newImpacts.filter(x=>x!==id);else if(state.newImpacts.length<3)state.newImpacts.push(id)}queueSave();render()}
function prepareFinal(){if(!state.finalStations.length)state.finalStations=[...state.policyStations];goStep(6)}
function finalStationCard(s){let on=state.finalStations.includes(s.id),fc=FINAL_COST[s.id];return `<div class="choice ${on?'on':''}" onclick="toggleStation('${s.id}',true)"><div class="between"><h3>🚉 ${s.name}</h3><b>${fc}억</b></div><p>${s.facility}</p>${s.id==='hospital'?'<span class="chip green">새 정보 반영: 35억</span>':''}</div>`}
function step6(){let finalC=cost(state.finalStations,true),diff=JSON.stringify([...state.finalStations].sort())!==JSON.stringify([...state.policyStations].sort());let body=`${studentHeader('STEP 6. 최종 정책 결정실','새로운 정보를 반영해 정책을 유지하거나 바꿀 수 있습니다.')}<section class="card"><div class="notice good"><b>정책을 바꾸는 것이 좋은 답은 아닙니다.</b><br>새 정보를 검토한 뒤 기존 정책이 여전히 적절하다고 판단했다면 유지해도 됩니다.</div><div class="grid grid2"><div class="stat"><span>처음 만든 정책</span><b style="font-size:16px">${state.policyStations.map(sName).join(' · ')}</b><p>${cost(state.policyStations)}억</p></div><div class="stat"><span>새 정보</span><b style="font-size:16px">복지센터 이용수요 증가<br>대학병원역 비용 35억</b></div></div></section><section class="card"><h2>시장님의 최종 판단은?</h2><div class="grid grid3">${[['keep','① 기존 정책 유지'],['partial','② 일부 변경'],['major','③ 크게 변경']].map(x=>`<div class="choice ${state.finalDecision===x[0]?'on':''}" onclick="chooseDecision('${x[0]}')"><b>${x[1]}</b></div>`).join('')}</div></section><section class="card"><div class="between"><h2>최종 설치역</h2><b class="timer">${finalC}억 / 50억</b></div><p class="muted">2곳 이상 선택하세요.</p><div class="grid grid2">${STATIONS.map(finalStationCard).join('')}</div>${finalC>50?'<div class="notice bad">최종 사업비가 50억 원을 넘었습니다. 다시 조정하세요.</div>':''}</section><section class="card"><h2>처음과 무엇이 달라졌나요?</h2>${diff?`<p><b>처음:</b> ${state.policyStations.map(sName).join(' + ')} (${cost(state.policyStations)}억)</p><p><b>최종:</b> ${state.finalStations.map(sName).join(' + ')} (${finalC}억)</p>`:'<p>설치역은 그대로 유지했습니다. 유지한 이유를 최종 판단에서 설명하세요.</p>'}</section><section class="card"><h2>핵심 판단 ③ 최종 결정</h2><p>새로운 정보를 검토한 뒤 정책을 유지하거나 변경한 이유를 설명하세요.</p>${charBox('answer3',state.answer3,100,'120~180자')}<div id="a3msg"></div></section>`;let decisionOk=!!state.finalDecision&&(state.finalDecision!=='keep'||!diff)&&(state.finalDecision==='keep'||diff);let enabled=decisionOk&&state.finalStations.length>=2&&finalC<=50&&qualityError(state.answer3,100)==='';root.innerHTML=shell(body,{bottom:bottomBar('최종 정책보고서 확인','saveAnswer3()',enabled,'goStep(5)')});document.getElementById('answer3').addEventListener('input',e=>{state.answer3=e.target.value;queueSave();let ok=!!state.finalDecision&&(state.finalDecision!=='keep'||!diff)&&(state.finalDecision==='keep'||diff)&&state.finalStations.length>=2&&cost(state.finalStations,true)<=50&&qualityError(state.answer3,100)==='';document.querySelector('.bottom .btn:last-child').disabled=!ok})}
function chooseDecision(v){state.finalDecision=v;if(v==='keep')state.finalStations=[...state.policyStations];queueSave();render()}
function saveAnswer3(){let e=qualityError(state.answer3,100);if(e){document.getElementById('a3msg').innerHTML='<div class="notice warn">'+esc(e)+'</div>';return}goStep(7)}
function reportHtml(){return `<section class="card hero"><div class="kicker">새봄시 정책보고서</div><h1>엘리베이터 우선 설치 최종안</h1><p>${esc(student?.name||'학생')} 시장님의 정책 판단을 확인하세요.</p></section><section class="card report"><dl><dt>최종 설치역</dt><dd>${state.finalStations.map(sName).join(' · ')}</dd><dt>총 사업비</dt><dd>${cost(state.finalStations,true)}억 원</dd><dt>핵심 정책 기준</dt><dd>${state.criteria.map(cName).join(' · ')}</dd><dt>관련 인권</dt><dd>${state.rights.map(rName).join(' · ')}</dd><dt>사용한 주요 근거</dt><dd>${state.evidence.map(evidenceName).map(x=>'• '+x).join('<br>')}</dd><dt>먼저 도움받는 시민</dt><dd>${state.beneficiaries.map(citizenName).join(' · ')}</dd><dt>상대적으로 기다리는 시민</dt><dd>${state.delayed.map(citizenName).join(' · ')}</dd><dt>정책의 한계</dt><dd>${limitationName(state.limitation)}</dd><dt>보완 방법</dt><dd>${remedyName(state.remedy)}</dd><dt>1차 정책</dt><dd>${state.policyStations.map(sName).join(' · ')} (${cost(state.policyStations)}억)</dd><dt>최종 정책</dt><dd>${state.finalStations.map(sName).join(' · ')} (${cost(state.finalStations,true)}억)</dd></dl></section><section class="card"><h2>내 핵심 판단</h2><p><b>① 정책 선택 이유</b><br>${esc(state.answer1)}</p><hr style="border:0;border-top:1px solid var(--line)"><p><b>② 정책 영향과 보완</b><br>${esc(state.answer2)}</p><hr style="border:0;border-top:1px solid var(--line)"><p><b>③ 최종 판단</b><br>${esc(state.answer3)}</p></section><section class="card"><h2>제출 전 확인</h2>${[['자료 5개 확인',RESOURCES.every(r=>state.quizDone[r.id])],['핵심 근거 3~4개',state.evidence.length>=3&&state.evidence.length<=4],['1차 정책 예산 50억 이내',state.policyStations.length>=2&&cost(state.policyStations)<=50],['정책 기준·권리 연결',state.criteria.length===2&&state.rights.length>=1],['정책 영향과 보완',state.beneficiaries.length&&state.delayed.length&&state.limitation&&state.remedy],['새 정보 해석',state.newImpacts.length&&state.impactStrength],['최종 정책 예산 50억 이내',state.finalStations.length>=2&&cost(state.finalStations,true)<=50],['핵심 판단 3개 작성',!qualityError(state.answer1,100)&&!qualityError(state.answer2,60)&&!qualityError(state.answer3,100)]].map(x=>`<p>${x[1]?'✅':'⬜'} ${x[0]}</p>`).join('')}<div class="notice">최종 제출 뒤에는 답안을 수정할 수 없습니다. 내용을 한 번 더 확인하세요.</div></section>`}
function step7(){let body=reportHtml();root.innerHTML=shell(body,{bottom:bottomBar('최종 제출','submitFinal()',true,'goStep(6)')})}
async function submitFinal(){if(!confirm('최종 제출하면 수정할 수 없습니다. 제출할까요?'))return;if(!API_MODE){state.submitted=true;state.receiptTime=new Date().toLocaleString('ko-KR');saveLocal();render();return}try{setSave('','제출 중…');let x=await api('/api/submit',{method:'POST',body:JSON.stringify({student_id:student.student_id,name:student.name,payload:state})});state.submitted=true;state.receiptTime=x.submitted_at||'';saveLocal();render()}catch(e){alert('제출하지 못했습니다. 저장된 답안을 확인한 뒤 다시 시도하세요.\n'+e.message);setSave('warn','기기에 저장됨 · 제출 재시도 필요')}}
function submittedView(){let body=`<section class="card hero"><div class="kicker">정책 제출 완료</div><h1>${esc(student?.name||'학생')} 시장님의 최종 정책이 제출되었습니다.</h1><p>자료를 확인하고, 정책의 영향을 살펴본 뒤, 새로운 정보까지 반영하여 최종 결정을 마쳤습니다.</p></section><section class="card"><h2>제출한 최종안</h2><p><b>${state.finalStations.map(sName).join(' · ')}</b></p><p>총 ${cost(state.finalStations,true)}억 원</p><p class="muted">제출 시각: ${esc(state.receiptTime||'완료')}</p></section>`;root.innerHTML=shell(body,{bottom:'',studentView:true});document.querySelector('.drawerBtn')?.remove();document.querySelector('.saveState')?.remove()}
function render(){drawerOpen=false;if(teacherMode)return renderTeacher();if(!student)return loginView();if(API_MODE&&!session.is_open&&!state.submitted)return waitView();if(state.submitted)return submittedView();({0:step0,1:step1,2:step2,3:step3,4:step4,5:step5,6:step6,7:step7}[state.step]||step0)()}

function teacherLogin(){let body=`<section class="card hero teacherOnly"><div class="kicker">교사용 관리</div><h1>인권도시 정책결정 수행평가</h1><p>반별 차시 운영, 학생 진행, 활동 시간, 제출 결과와 채점을 관리합니다.</p></section><section class="card"><label>교사 PIN</label><input id="tpin" type="password" placeholder="클래스룸에 설정된 교사 PIN"><div style="height:10px"></div><button class="btn" onclick="teacherAuth()">관리 화면 열기</button><div id="tmsg"></div></section><section class="card"><p class="small muted">교사용 테스트 계정은 학번 <b>000000</b>입니다. 활동을 개방한 뒤 학생 화면에서 접속하여 전체 흐름을 시험할 수 있습니다.</p><a class="btn secondary" href="/" style="display:inline-block;text-decoration:none">학생 화면 보기</a></section>`;root.innerHTML=shell(body,{studentView:false})}
async function teacherAuth(){let p=document.getElementById('tpin').value.trim();try{let d=await api('/api/teacher/dashboard?pin='+encodeURIComponent(p));teacherPin=p;sessionStorage.setItem('HR10_TPIN',p);teacherData=d;renderTeacherDashboard()}catch(e){document.getElementById('tmsg').innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}}
async function loadTeacherData(){if(!teacherPin)return false;try{teacherData=await api('/api/teacher/dashboard?pin='+encodeURIComponent(teacherPin));return true}catch(e){teacherPin='';sessionStorage.removeItem('HR10_TPIN');return false}}
function fmtSec(sec){sec=Number(sec||0);let m=Math.floor(sec/60),s=sec%60;return `${m}분 ${String(s).padStart(2,'0')}초`}
function stageName(p){let names=['시장 브리핑','자료 탐색','정책 설계','정책 근거','정책 영향','새 정보','최종 정책','보고서'];return names[p?.step||0]||'-'}
function periodName(v){return v==='1'?'1차시':v==='2'?'2차시':v==='makeup'?'보충·추가시간':'닫힘'}
function renderTeacher(){if(!API_MODE){root.innerHTML=shell(`<section class="card hero teacherOnly"><h1>교사용 화면</h1><p>교사용 운영 기능은 실제 수업 서버에서 사용할 수 있습니다.</p></section>`,{studentView:false});return}if(!teacherPin)return teacherLogin();loadTeacherData().then(ok=>ok?renderTeacherDashboard():teacherLogin())}
function renderTeacherDashboard(){let d=teacherData||{},rows=d.students||[],submitted=rows.filter(x=>x.submitted).length,active=rows.filter(x=>!x.submitted&&x.payload).length,sess=d.session||{};let body=`<section class="card hero teacherOnly"><div class="between"><div><div class="kicker">교사용 관리 · ${VERSION}</div><h1>수행평가 운영·채점</h1><p>현재 ${sess.is_open?`${sess.class_no?`${sess.class_no}반`:'전체반'} · ${periodName(sess.period_type)} 진행 중`:'활동이 닫혀 있습니다.'}</p></div><button class="btn secondary sm" onclick="teacherLogout()">로그아웃</button></div></section><div class="grid grid4"><div class="stat"><span>등록 학생</span><b>${rows.length}</b></div><div class="stat"><span>진행 중</span><b>${active}</b></div><div class="stat"><span>제출 완료</span><b>${submitted}</b></div><div class="stat"><span>활동 상태</span><b style="font-size:17px">${sess.is_open?'진행 중':'닫힘'}</b></div></div><section class="card"><h2>⏱ 반별 차시 운영</h2><div class="grid grid3"><label>대상 반<select id="classNo">${[['0','전체반'],['1','1반'],['2','2반'],['3','3반'],['4','4반'],['5','5반'],['6','6반'],['7','7반']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></label><label>활동 구분<select id="periodType"><option value="1">1차시 45분</option><option value="2">2차시 45분</option><option value="makeup">보충·추가시간</option></select></label><div style="align-self:end"><button class="btn green" onclick="teacherOpen()">활동 개방</button></div></div><div class="row" style="margin-top:10px"><button class="btn red" onclick="teacherClose()">현재 활동 종료</button><button class="btn secondary" onclick="refreshTeacher()">새로고침</button><button class="btn secondary" onclick="toggleAutoRefresh()">${teacherAutoTimer?'자동 새로고침 끄기':'5초 자동 새로고침'}</button></div><p class="help">1·2차시는 각 45분 한도만 기록됩니다. 결석한 차시는 사용시간이 차감되지 않으며, 보충·추가시간에서 남은 시간을 이어서 사용할 수 있습니다.</p></section><section class="card"><div class="between"><div><h2>👥 학생 진행 현황</h2><p class="muted">학생을 누르면 정책 선택 과정, 서술 답안과 시간 기록을 확인할 수 있습니다.</p></div><button class="btn secondary sm" onclick="exportCsv()">CSV 내보내기</button></div><div class="tablewrap"><table class="table"><thead><tr><th>학번</th><th>이름</th><th>단계</th><th>1차 정책</th><th>최종 정책</th><th>사용시간</th><th>시간감점</th><th>제출</th><th>AI</th><th>최종점수</th></tr></thead><tbody>${rows.map(r=>{let p=r.payload||{};return `<tr onclick="openStudentDetail('${esc(r.student_id)}')" style="cursor:pointer"><td>${esc(r.student_id)}</td><td>${esc(r.name)}</td><td>${stageName(p)}</td><td>${(p.policyStations||[]).map(sName).join(' / ')}</td><td>${(p.finalStations||[]).map(sName).join(' / ')}</td><td>${fmtSec(r.active_seconds)}</td><td>${r.time_penalty?'-'+r.time_penalty:'0'}</td><td>${r.submitted?'완료':'진행'}</td><td>${r.ai_grade?'완료':'-'}</td><td>${r.teacher_grade?.total??''}</td></tr>`}).join('')}</tbody></table></div></section><div class="grid grid2"><section class="card"><h2>📋 명단 관리</h2><p class="small muted">한 줄에 <b>학번,이름</b> 형식으로 붙여 넣으세요.</p><textarea id="rosterText" placeholder="10101,김민서\n10102,박서윤"></textarea><div class="row"><button class="btn secondary" onclick="saveRoster()">명단 저장</button><button class="btn ${d.roster_enabled?'orange':'green'}" onclick="toggleRoster(${d.roster_enabled?'false':'true'})">명단 확인 ${d.roster_enabled?'끄기':'켜기'}</button></div><p>현재 ${d.roster_count||0}명 · ${d.roster_enabled?'명단에 있는 학생만 입장 가능':'명단 확인 꺼짐'}</p></section><section class="card"><h2>🤖 AI 가채점</h2><p>${d.ai_available?`사용 가능 · ${esc(d.ai_model||'')}`:'API 키가 설정되지 않았습니다.'}</p><p class="small muted">학생 활동이 끝난 뒤에만 실행합니다. 이름과 학번은 AI 요청에 포함하지 않습니다.</p><div class="row"><button class="btn" ${(!d.ai_available||sess.is_open)?'disabled':''} onclick="gradeAllAI()">미채점 답안 가채점</button><button class="btn secondary" ${sess.is_open?'disabled':''} onclick="toggleAiSetup()">API 설정</button></div><div id="aiSetup" class="hidden"><label>OpenAI API 키</label><input id="aiKey" type="password" placeholder="sk-..."><label>채점 모델</label><input id="aiModel" value="${esc(d.ai_model||'gpt-5.6-luna')}"><div class="row" style="margin-top:8px"><button class="btn secondary" onclick="saveAiSetup()">연결 확인·저장</button><button class="btn secondary" onclick="clearAiSetup()">저장 키 지우기</button></div></div><div id="aiMsg"></div></section></div><section class="card dangerZone"><h2>🧹 활동 기록 관리</h2><p class="small">실제 평가 전 시범 기록을 모두 지울 때만 사용하세요. 명단과 API 설정은 유지됩니다.</p><button class="btn red" onclick="resetAll()">전체 활동기록 초기화</button></section>`;root.innerHTML=shell(body,{studentView:false})}
function teacherLogout(){clearInterval(teacherAutoTimer);teacherAutoTimer=null;teacherPin='';sessionStorage.removeItem('HR10_TPIN');teacherData=null;teacherLogin()}
async function refreshTeacher(){if(await loadTeacherData())renderTeacherDashboard()}
function toggleAutoRefresh(){if(teacherAutoTimer){clearInterval(teacherAutoTimer);teacherAutoTimer=null;renderTeacherDashboard()}else{teacherAutoTimer=setInterval(async()=>{await loadTeacherData();renderTeacherDashboard()},5000);renderTeacherDashboard()}}
async function teacherOpen(){let class_no=Number(document.getElementById('classNo').value),period_type=document.getElementById('periodType').value;try{await api('/api/teacher/open',{method:'POST',body:JSON.stringify({pin:teacherPin,class_no,period_type})});await refreshTeacher()}catch(e){alert(e.message)}}
async function teacherClose(){try{await api('/api/teacher/close',{method:'POST',body:JSON.stringify({pin:teacherPin})});await refreshTeacher()}catch(e){alert(e.message)}}
async function saveRoster(){let lines=document.getElementById('rosterText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),rows=lines.map(line=>{let [student_id,...rest]=line.split(',');return {student_id:(student_id||'').trim(),name:rest.join(',').trim()}}).filter(x=>x.student_id&&x.name);if(!rows.length)return alert('학번,이름 형식의 명단을 입력하세요.');try{await api('/api/teacher/roster/import',{method:'POST',body:JSON.stringify({pin:teacherPin,rows})});await refreshTeacher()}catch(e){alert(e.message)}}
async function toggleRoster(enabled){try{await api('/api/teacher/roster/toggle',{method:'POST',body:JSON.stringify({pin:teacherPin,enabled})});await refreshTeacher()}catch(e){alert(e.message)}}
async function resetAll(){let s=prompt('전체 학생 활동기록을 지우려면 초기화 라고 입력하세요.');if(s!=='초기화')return;try{await api('/api/teacher/reset-activity',{method:'POST',body:JSON.stringify({pin:teacherPin})});await refreshTeacher()}catch(e){alert(e.message)}}
function toggleAiSetup(){document.getElementById('aiSetup')?.classList.toggle('hidden')}
async function saveAiSetup(){let msg=document.getElementById('aiMsg'),api_key=document.getElementById('aiKey').value.trim(),model=document.getElementById('aiModel').value.trim();try{msg.innerHTML='<div class="notice">API 연결을 확인하고 있습니다.</div>';await api('/api/teacher/ai-config',{method:'POST',body:JSON.stringify({pin:teacherPin,api_key,model})});await refreshTeacher()}catch(e){msg.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}}
async function clearAiSetup(){try{await api('/api/teacher/ai-clear',{method:'POST',body:JSON.stringify({pin:teacherPin})});await refreshTeacher()}catch(e){alert(e.message)}}
function detailSection(title,value){return `<div class="scorebox"><b>${title}</b><p>${value||'<span class="muted">없음</span>'}</p></div>`}
function openStudentDetail(id){let r=(teacherData.students||[]).find(x=>x.student_id===id);if(!r)return;let p=r.payload||{},a=r.ai_grade||{},g=r.teacher_grade||{},t=r.time||{};let html=`<div id="detailOv" class="overlay" onclick="closeDetail()"></div><aside id="detail" class="drawer" style="width:min(680px,96vw)"><div class="between"><div><h2>${esc(r.student_id)} ${esc(r.name)}</h2><p class="muted">${stageName(p)} · ${fmtSec(r.active_seconds)} · 시간감점 ${r.time_penalty?'-'+r.time_penalty:'0'}</p></div><button class="btn secondary sm" onclick="closeDetail()">닫기</button></div>${detailSection('핵심 근거',(p.evidence||[]).map(evidenceName).join('<br>'))}${detailSection('1차 정책',(p.policyStations||[]).map(sName).join(' · ')+' / '+cost(p.policyStations||[])+'억')}${detailSection('정책 기준·권리',(p.criteria||[]).map(cName).join(' · ')+' / '+(p.rights||[]).map(rName).join(' · '))}${detailSection('핵심 판단 ①',esc(p.answer1||''))}${detailSection('정책 영향','먼저 도움: '+(p.beneficiaries||[]).map(citizenName).join(', ')+'<br>기다림: '+(p.delayed||[]).map(citizenName).join(', ')+'<br>한계: '+limitationName(p.limitation)+'<br>보완: '+remedyName(p.remedy))}${detailSection('핵심 판단 ②',esc(p.answer2||''))}${detailSection('새 정보 해석',(p.newImpacts||[]).join(', ')+' / '+(p.impactStrength||''))}${detailSection('최종 정책',(p.finalStations||[]).map(sName).join(' · ')+' / '+cost(p.finalStations||[],true)+'억')}${detailSection('핵심 판단 ③',esc(p.answer3||''))}<section class="card"><h3>활동시간 관리</h3><p>1차시 ${fmtSec(t.period1_used||0)} · 2차시 ${fmtSec(t.period2_used||0)} · 추가 ${fmtSec(t.extra_seconds||0)}</p><div class="row"><button class="btn secondary sm" onclick="resetStudentTime('${esc(id)}','1')">1차시 시간 초기화</button><button class="btn secondary sm" onclick="resetStudentTime('${esc(id)}','2')">2차시 시간 초기화</button><button class="btn secondary sm" onclick="setPenaltyExempt('${esc(id)}',${t.penalty_exempt?'false':'true'})">시간감점 ${t.penalty_exempt?'적용':'면제'}</button></div></section><section class="card teacherOnly"><h3>AI 가채점</h3>${r.ai_grade?`<p><b>총점 ${a.total??'-'}</b></p><p>${esc(a.summary||'')}</p><p class="small">자료·정책 ${a.evidence_policy??'-'} / 권리·기준 ${a.rights_criteria??'-'} / 정책 영향 ${a.tradeoff??'-'} / 한계·보완 ${a.limit_remedy??'-'} / 재판단 ${a.revision??'-'}</p>`:'<p class="muted">아직 가채점하지 않았습니다.</p>'}<button class="btn secondary" ${teacherData.session?.is_open||!teacherData.ai_available?'disabled':''} onclick="gradeOneAI('${esc(id)}')">이 학생 AI 가채점</button></section><section class="card"><h3>교사 최종 채점</h3><div class="grid grid2"><label>자료·정책 /25<input id="g1" type="number" min="0" max="25" value="${g.evidence_policy??''}"></label><label>권리·기준 /20<input id="g2" type="number" min="0" max="20" value="${g.rights_criteria??''}"></label><label>이해관계 /20<input id="g3" type="number" min="0" max="20" value="${g.tradeoff??''}"></label><label>한계·보완 /15<input id="g4" type="number" min="0" max="15" value="${g.limit_remedy??''}"></label><label>재판단 /20<input id="g5" type="number" min="0" max="20" value="${g.revision??''}"></label></div><label>교사 피드백</label><textarea id="gcomment">${esc(r.teacher_comment||'')}</textarea><button class="btn" onclick="saveTeacherGrade('${esc(id)}')">최종 채점 저장</button></section></aside>`;document.body.insertAdjacentHTML('beforeend',html)}
function closeDetail(){document.getElementById('detailOv')?.remove();document.getElementById('detail')?.remove()}
async function resetStudentTime(id,period){try{await api('/api/teacher/time-reset',{method:'POST',body:JSON.stringify({pin:teacherPin,student_id:id,period})});closeDetail();await refreshTeacher();openStudentDetail(id)}catch(e){alert(e.message)}}
async function setPenaltyExempt(id,exempt){try{await api('/api/teacher/time-exempt',{method:'POST',body:JSON.stringify({pin:teacherPin,student_id:id,exempt})});closeDetail();await refreshTeacher();openStudentDetail(id)}catch(e){alert(e.message)}}
async function gradeOneAI(id){try{await api('/api/teacher/ai-grade',{method:'POST',body:JSON.stringify({pin:teacherPin,student_id:id})});closeDetail();await refreshTeacher();openStudentDetail(id)}catch(e){alert(e.message)}}
async function gradeAllAI(){let msg=document.getElementById('aiMsg');msg.innerHTML='<div class="notice">제출된 미채점 답안을 차례로 가채점하고 있습니다.</div>';try{let x=await api('/api/teacher/ai-grade-all',{method:'POST',body:JSON.stringify({pin:teacherPin})});msg.innerHTML='<div class="notice good">'+x.graded+'명 가채점을 마쳤습니다.'+(x.failed?' · 실패 '+x.failed+'명':'')+'</div>';await loadTeacherData();setTimeout(renderTeacherDashboard,700)}catch(e){msg.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}}
async function saveTeacherGrade(id){let vals=[25,20,20,15,20].map((max,i)=>Math.max(0,Math.min(max,Number(document.getElementById('g'+(i+1)).value||0)))),grade={evidence_policy:vals[0],rights_criteria:vals[1],tradeoff:vals[2],limit_remedy:vals[3],revision:vals[4],total:vals.reduce((a,b)=>a+b,0)};try{await api('/api/teacher/grade',{method:'POST',body:JSON.stringify({pin:teacherPin,student_id:id,grade,comment:document.getElementById('gcomment').value})});closeDetail();await refreshTeacher();openStudentDetail(id)}catch(e){alert(e.message)}}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCsv(){let h=['학번','이름','단계','활동초','시간감점','자료근거','1차정책','1차비용','정책기준','권리','답안1','수혜집단','대기집단','한계','보완','답안2','새정보영향','영향크기','최종판단유형','최종정책','최종비용','답안3','제출','제출시각','AI총점','교사총점','교사피드백'],lines=[h];for(let r of teacherData.students||[]){let p=r.payload||{};lines.push([r.student_id,r.name,stageName(p),r.active_seconds,r.time_penalty,(p.evidence||[]).map(evidenceName).join(' / '),(p.policyStations||[]).map(sName).join(' / '),cost(p.policyStations||[]),(p.criteria||[]).map(cName).join(' / '),(p.rights||[]).map(rName).join(' / '),p.answer1,(p.beneficiaries||[]).map(citizenName).join(' / '),(p.delayed||[]).map(citizenName).join(' / '),limitationName(p.limitation),remedyName(p.remedy),p.answer2,(p.newImpacts||[]).join(' / '),p.impactStrength,p.finalDecision,(p.finalStations||[]).map(sName).join(' / '),cost(p.finalStations||[],true),p.answer3,r.submitted?'완료':'진행',r.submitted_at||'',r.ai_grade?.total??'',r.teacher_grade?.total??'',r.teacher_comment||''])}let blob=new Blob(['\ufeff'+lines.map(row=>row.map(csvCell).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='인권도시_정책판단보드_v10.0_채점현황.csv';a.click();URL.revokeObjectURL(u)}

async function init(){if(API_MODE){await refreshSession()}if(student){await loadProgress();startHeartbeat()}render()}
const root=document.getElementById('root');init();
</script>
