<body><main>
<header><div><a href="/manage">← 교사 관리화면</a><h1>학생 답안·자기평가서·채점 결과</h1><p class="muted">학생 답안과 자기평가서, AI 판단 근거를 모아 확인하고 Excel로 보관하세요.</p></div><button id="logout" hidden>로그아웃</button></header>
<section id="login" class="panel login" hidden><h2>교사용 결과 조회</h2><form id="loginForm"><label>교사 PIN<input id="pin" type="password" required autocomplete="current-password"></label><button class="primary" style="margin-top:14px">결과 조회 열기</button></form></section>
<div id="message" class="message" role="status" aria-live="polite">기록을 불러오는 중입니다…</div>
<section id="workspace" hidden>
<nav class="tabs" aria-label="결과 보기 방식"><button id="answersTab" aria-pressed="true">학생 답안 한번에 보기</button><button id="reflectionsTab" aria-pressed="false">자기평가서 한번에 보기</button><button id="gradesTab" aria-pressed="false">AI 가채점 결과 한번에 보기</button></nav>
<section class="panel"><div class="filters"><label>수업 반<select id="classFilter"><option value="0">전체 반</option><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option><option value="6">6반</option><option value="7">7반</option></select></label><label>조회 상태<select id="statusFilter"><option value="all">전체 학생</option><option value="reflection_complete">자기평가서 완료</option><option value="reflection_draft">자기평가서 임시저장</option><option value="reflection_empty">자기평가서 미작성</option><option value="submitted">제출 완료</option><option value="unsubmitted">미제출</option><option value="graded">AI 가채점 완료</option><option value="ungraded">AI 미가채점</option><option value="review">교사 확인 권장</option><option value="final">교사 채점 완료</option></select></label><label>학생 검색<input id="search" type="search" placeholder="학번 또는 이름"></label><button id="refresh">새로고침</button></div>
<div class="summary" id="summary" aria-live="polite"></div><div class="toolbar"><div><button class="primary" id="download">조회 결과 Excel 다운로드</button><p class="muted" id="downloadHint">현재 반·상태·검색 조건에 맞는 학생의 답안, AI 가채점, 교사 채점을 함께 내려받습니다.</p></div><span class="muted" id="updated"></span></div></section>
<p class="muted" id="gradeHint">AI 점수는 잠정점수입니다. 교사 최종점수와 시간감점을 각각 표시하며 자동으로 확정하거나 합산하지 않습니다.</p>
<div id="results"></div>
</section></main></body></html>
