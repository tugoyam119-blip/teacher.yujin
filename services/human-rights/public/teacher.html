<title>인권도시 정책결정 수행평가 교사용 v12.3</title>
<style>
*{box-sizing:border-box}:root{--nav:#10233f;--nav2:#1d477e;--blue:#2368d8;--bg:#f4f7fb;--card:#fff;--line:#dce4ee;--muted:#667386;--red:#b42318;--redbg:#fff0ee;--green:#147a49;--greenbg:#eaf8f0;--gold:#946200;--goldbg:#fff6dc;--purple:#6750a4;--purplebg:#f3efff;--shadow:0 10px 30px rgba(31,55,90,.08)}
html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;background:var(--bg);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit;font-size:15px}button{cursor:pointer}.shell{width:min(1280px,calc(100% - 28px));margin:auto;padding:18px 0 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:13px;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:950}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--nav);color:#fff;font-weight:850;min-height:40px}.btn.secondary{background:#fff;color:var(--nav);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.orange{background:#a35e0b}.btn.small{padding:7px 10px;min-height:32px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.hero{border-radius:22px;background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px}.hero .eyebrow{font-size:11px;letter-spacing:.1em;font-weight:900;color:#cfe1ff}.hero h2{font-size:28px;margin:5px 0 7px}.hero p{margin:0;color:#dbe7f9;line-height:1.6}.hero .session{min-width:240px;background:#ffffff14;border:1px solid #ffffff25;border-radius:16px;padding:13px}.hero .session span{font-size:11px;color:#cfe1ff;display:block}.hero .session strong{font-size:18px;display:block;margin-top:3px}.grid{display:grid;gap:10px}.grid5{grid-template-columns:repeat(5,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);text-align:left}.stat.click{cursor:pointer;transition:.15s}.stat.click:hover{transform:translateY(-1px);border-color:#b7c8dd}.stat.click.on{outline:3px solid #cfe0fa;border-color:var(--blue)}.stat span{font-size:11px;color:var(--muted);display:block}.stat strong{font-size:25px;color:var(--nav);display:block;margin:3px 0}.stat small{font-size:11px;color:var(--muted)}.stat.online strong{color:var(--green)}.stat.never strong{color:var(--gold)}.stat.submitted strong{color:var(--purple)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:12px;box-shadow:var(--shadow)}.card h3{margin:0 0 5px;font-size:18px}.card h4{margin:0 0 7px}.muted{color:var(--muted)}.small{font-size:12px}.sectionHead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}.sectionHead p{margin:4px 0 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controlGrid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}label{font-weight:800;font-size:12px;display:block}select,input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:10px 11px;background:#fff;color:#172033;margin-top:5px}textarea{min-height:110px;resize:vertical}.notice{border-left:4px solid var(--blue);background:#edf4ff;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.6}.notice.good{border-color:var(--green);background:var(--greenbg);color:#165f3c}.notice.warn{border-color:#b57a17;background:var(--goldbg);color:#76500e}.notice.bad{border-color:var(--red);background:var(--redbg);color:#85251e}.filterBar{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:850;color:#40516a}.pill.on{background:var(--nav);border-color:var(--nav);color:#fff}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;max-height:440px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #e6ebf1;text-align:left;white-space:nowrap}.table th{background:#f6f8fb;position:sticky;top:0;z-index:1}.table tr.data:hover{background:#f7faff}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.badge.online{background:var(--greenbg);color:var(--green)}.badge.entered{background:#eaf2ff;color:#285c9f}.badge.never{background:var(--goldbg);color:var(--gold)}.badge.submitted{background:var(--purplebg);color:var(--purple)}.classSummary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.classBox{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fbfcfe}.classBox b{font-size:15px;color:var(--nav)}.classBox p{margin:7px 0 0;font-size:11px;line-height:1.65;color:#526173}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{border-color:#efb8b8;background:#fffafa}.overlay{position:fixed;inset:0;background:#10233f66;z-index:40}.drawer{position:fixed;z-index:41;right:0;top:0;bottom:0;width:min(690px,96vw);background:#fff;overflow:auto;padding:18px;box-shadow:-20px 0 45px #0002}.detailBox{border:1px solid var(--line);border-radius:13px;background:#fafcff;padding:11px;margin:8px 0}.detailBox b{color:var(--nav)}.detailBox p{white-space:pre-wrap;margin:6px 0 0;line-height:1.65}.gradeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hidden{display:none!important}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.login{max-width:600px;margin:60px auto}.login .card{padding:24px}.login h2{margin-top:0}.loading{max-width:700px;margin:70px auto;padding:20px}.search{max-width:240px}
@media(max-width:900px){.grid5{grid-template-columns:repeat(2,1fr)}.grid4,.grid3,.grid2,.tools{grid-template-columns:1fr}.classSummary{grid-template-columns:repeat(2,1fr)}.controlGrid{grid-template-columns:1fr}.hero{display:block}.hero .session{margin-top:14px;min-width:0}.sectionHead{align-items:flex-start;flex-direction:column}.search{max-width:none;width:100%}}
</style>
</head>
<body><div id="root"><div class="loading card">교사용 관리화면을 불러오는 중입니다…</div></div>
<script>
const VERSION='v12.3';
const root=document.getElementById('root');
let pin='';try{pin=sessionStorage.getItem('HR102_TPIN')||''}catch(e){}
let data=null,autoTimer=null,viewMode='online',classFilter=0,searchText='',syntheticStatus='';
const STATION={central:'새봄중앙역',welfare:'복지센터역',hospital:'대학병원역',market:'전통시장역',park:'푸른공원역',school:'새봄고역'};
const CRIT={mobility:'교통약자 보호',essential:'필수시설 접근',many:'많은 시민에게 혜택',efficiency:'예산 효율',balance:'지역 간 형평성',urgent:'문제의 긴급성'};
const RIGHTS={mobility_right:'이동권',equality:'평등권',life:'인간다운 생활을 할 권리',dignity:'인간의 존엄과 가치'};
const CIT={wheel:'휠체어 이용 시민',elder:'고령 시민',hospital_user:'병원 이용 시민',student:'학생',worker:'통근 시민',market_user:'전통시장 상인·이용객',resident:'다른 역 인근 주민',parent:'유모차 이용 보호자'};
const LIMIT={region:'특정 지역에 혜택이 집중될 수 있다.',wait:'다른 역 이용자가 더 오래 기다려야 한다.',cost:'예산의 많은 부분을 한정된 지역에 사용한다.',coverage:'혜택을 받는 시민 범위가 좁을 수 있다.',future:'다음 연도에도 추가 사업이 필요하다.',other:'기타: 학생 직접 작성'};
const REM={next:'다음 사업에서 이번에 밀린 역을 우선 검토',support:'설치 전까지 임시 이동지원 서비스 운영',budget:'추가 예산과 외부 지원 확보',voice:'다음 설치 순위를 시민 의견과 함께 결정',plan:'단계별 설치 계획과 순서 공개',other:'기타: 학생 직접 작성'};
const EVID={ev_hospital_mob:'대학병원역 교통약자 추정 이용객 2,140명',ev_central_all:'새봄중앙역 하루 이용객 18,400명',ev_welfare_ratio:'복지센터역 교통약자 이용 비율이 가장 높음',ev_welfare_center:'복지센터역~장애인종합복지관 180m',ev_hospital_access:'대학병원역과 진료·치료 목적 이동 연결',ev_market_elder:'전통시장역과 시장·노인복지관 생활 이동 연결',ev_school_route:'새봄고역 특수학급 통학로',ev_school_cost:'새봄고역 기존 시설 활용 8억 원',ev_path:'지상~승강장 끊김 없는 연결 중요',ev_wheel_voice:'복지센터역 계단 때문에 우회·택시 이용 사례',ev_hospital_voice:'진료 뒤 계단 이동이 위험하다는 사례',ev_budget50:'이번 사업 최대 예산 50억 원'};
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const sn=x=>STATION[x]||x,cn=x=>CRIT[x]||x,rn=x=>RIGHTS[x]||x,cit=x=>CIT[x]||x,ev=x=>EVID[x]||x;
function fmtSec(sec){sec=Math.max(0,Number(sec||0));return Math.floor(sec/60)+'분 '+String(Math.floor(sec%60)).padStart(2,'0')+'초'}
function period(v){return v==='1'?'1차시 45분':v==='2'?'2차시 45분':v==='makeup'?'보충·추가시간':'닫힘'}
function stage(p){return ['시장 브리핑','자료 탐색','정책 설계','정책 근거','정책 영향','새 정보','최종 정책','보고서'][Number(p?.step||0)]||'-'}
async function api(url,opt={},timeoutMs=10000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeoutMs);try{const r=await fetch(url,{headers:{'Content-Type':'application/json'},signal:c.signal,...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청을 처리하지 못했습니다.');return j}finally{clearTimeout(t)}}
function login(msg=''){root.innerHTML=`<div class="shell login"><div class="topbar"><div class="brand"><div class="mark">YT</div><div><h1>인권도시 정책결정</h1><p>TEACHER · ${VERSION}</p></div></div></div><section class="card"><h2>교사용 관리</h2><p class="muted">서버·명단·기록·채점을 관리합니다. 실제 수업 진행은 교실 운영실에서 조작하세요.</p><label>교사 PIN<input id="pin" type="password" placeholder="교사 PIN"></label><div style="height:10px"></div><button class="btn" onclick="auth()">관리 화면 열기</button>${msg?`<div class="notice bad" style="margin-top:10px">${esc(msg)}</div>`:''}</section></div>`}
async function auth(){pin=document.getElementById('pin').value.trim();try{data=await api('/api/teacher/dashboard?pin='+encodeURIComponent(pin));try{sessionStorage.setItem('HR102_TPIN',pin);sessionStorage.setItem('HR115_OP_PIN',pin)}catch(e){};syncDefaultClass();dashboard();enhanceRosterUi()}catch(e){login(e.name==='AbortError'?'서버 응답이 지연되고 있습니다. 잠시 뒤 다시 시도해 주세요.':e.message)}}
async function load(){if(!pin)return false;try{data=await api('/api/teacher/dashboard?pin='+encodeURIComponent(pin));return true}catch(e){if(String(e.message).includes('PIN')){pin='';try{sessionStorage.removeItem('HR102_TPIN');sessionStorage.removeItem('HR115_OP_PIN')}catch(x){}}return false}}
function syncDefaultClass(){const s=data?.session||{};if(classFilter===0&&Number(s.is_open)&&Number(s.class_no)>=1&&Number(s.class_no)<=7)classFilter=Number(s.class_no)}
function rowsForClass(){return (data?.students||[]).filter(r=>!classFilter||Number(r.class_no||String(r.student_id).slice(2,3))===classFilter)}
function modeRows(){let rows=rowsForClass();if(searchText){const q=searchText.toLowerCase();rows=rows.filter(r=>String(r.student_id).includes(q)||String(r.name).toLowerCase().includes(q))}if(viewMode==='online')return rows.filter(r=>r.online);if(viewMode==='entered')return rows.filter(r=>r.ever_entered);if(viewMode==='never')return rows.filter(r=>!r.ever_entered);if(viewMode==='submitted')return rows.filter(r=>r.submitted);return rows}
function statusOf(r){if(r.online)return ['online','● 현재 접속'];if(r.submitted)return ['submitted','✓ 제출 완료'];if(r.ever_entered)return ['entered','접속 이력'];return ['never','미접속']}
function counts(rows){return {all:rows.length,online:rows.filter(r=>r.online).length,entered:rows.filter(r=>r.ever_entered).length,never:rows.filter(r=>!r.ever_entered).length,submitted:rows.filter(r=>r.submitted).length}}
function setMode(m){viewMode=m;dashboard()}
function setClass(c){classFilter=Number(c);dashboard()}
function setSearch(v){searchText=v.trim();renderMonitorOnly()}
function modeTitle(){return {online:'현재 접속 중인 학생',entered:'한 번이라도 들어온 학생',never:'아직 한 번도 들어오지 않은 학생',submitted:'제출을 완료한 학생',all:'전체 학생'}[viewMode]}
function dashboard(){const d=data||{},sess=d.session||{},all=d.students||[],base=rowsForClass(),cnt=counts(base);root.innerHTML=`<div class="shell"><div class="topbar"><div class="brand"><div class="mark">YT</div><div><h1>인권도시 정책결정</h1><p>교사용 운영·채점 · ${VERSION}</p></div></div><div class="toolbar"><a class="btn green" href="/operate" target="_blank" style="text-decoration:none">🎛️ 교실 운영실</a><a class="btn secondary" href="/classroom" target="_blank" style="text-decoration:none">📺 공개화면</a><a class="btn secondary" href="/student.html?test=1" target="_blank" style="text-decoration:none">학생 화면 테스트</a><button class="btn secondary" onclick="refresh()">새로고침</button><button class="btn secondary" onclick="logout()">로그아웃</button></div></div><section class="hero"><div><div class="eyebrow">SERVER · RECORDS</div><h2>서버·학생 기록·채점을 관리합니다.</h2><p>서버는 모든 반에 한 번만 열고, 실제 수행 시작·일시정지는 교실 운영실에서 반별로 진행합니다. 이 화면은 명단·기록·채점과 전체 서버 상태를 관리합니다.</p></div><div class="session"><span>전체 학생 서버</span><strong>${sess.server_open?'🟢 열림 · 모든 반 로그인 가능':'🔴 닫힘'}</strong><span style="margin-top:7px">${sess.is_open?`현재 ${sess.class_no}반 · ${period(sess.period_type)} · ${sess.timer_running?'수행 중':'일시정지'}`:'현재 수행 중인 반 없음'}</span><span style="margin-top:7px">현재 접속 ${cnt.online}명 · 선택 반 ${classFilter?classFilter+'반':'전체'}</span></div></section><div class="grid grid5">${statCard('online','현재 접속 중',cnt.online,'지금 화면을 열고 활동 중','online')}${statCard('entered','접속한 적 있음',cnt.entered,'한 번 이상 입장 기록 있음','entered')}${statCard('never','한 번도 안 들어옴',cnt.never,'아직 입장 기록 없음','never')}${statCard('submitted','제출 완료',cnt.submitted,'최종 제출한 학생','submitted')}${statCard('all','전체 학생',cnt.all,'선택한 반의 전체 명단','all')}</div>${controlCard(sess)}${classTimesCard(sess)}${monitorCard()}${classSummaryCard(all)}${toolsCard(d,sess)}</div>`;}
function statCard(mode,title,num,desc,cls=''){return `<button class="stat click ${cls} ${viewMode===mode?'on':''}" onclick="setMode('${mode}')"><span>${title}</span><strong>${num}</strong><small>${desc}</small></button>`}
function controlCard(sess){return `<section class="card"><div class="sectionHead"><div><h3>🌐 전체 학생 서버</h3><p class="small muted">반별로 서버를 열지 않습니다. <b>한 번 열면 1~7반 학생 모두 로그인·사전 미리보기가 가능</b>하고, 실제 수행시간은 교실 운영실에서 선택한 반만 시작됩니다.</p></div><div class="row"><a class="btn green small" href="/operate" target="_blank" style="text-decoration:none">🎛️ 반별 수행 운영</a><button class="btn ${autoTimer?'orange':'secondary'} small" onclick="toggleAuto()">${autoTimer?'5초 자동 새로고침 끄기':'5초 자동 새로고침'}</button></div></div><div class="notice ${sess.server_open?'good':'warn'}"><b>${sess.server_open?'🟢 전체 학생 서버가 열려 있습니다.':'🔴 전체 학생 서버가 닫혀 있습니다.'}</b><br>${sess.server_open?'반이 바뀌어도 다시 열 필요가 없습니다. 실제 수업은 교실 운영실에서 반·차시를 고르고 수행 시작만 누르세요.':'오늘 수업 전에 한 번만 열어두면 됩니다. 서버를 열어도 어느 반의 수행시간도 시작되지 않습니다.'}</div><div class="row" style="margin-top:10px">${sess.server_open?`<button class="btn red" ${sess.is_open?'disabled':''} onclick="closeServer()">전체 서버 닫기</button>`:`<button class="btn green" onclick="openServer()">🌐 전체 반 서버 열기</button>`}${sess.is_open?'<span class="small muted">현재 반 수행 중에는 서버를 닫을 수 없습니다.</span>':''}</div></section>`}
function classTimesCard(sess){let arr=sess.class_times||[];return `<section class="card"><div class="sectionHead"><div><h3>⏱️ 반별 수행시간 현황</h3><p class="small muted">공개화면과 같은 반별 독립 시간기록입니다. 1·2차시의 실제 수행시간만 누적됩니다.</p></div><a class="btn secondary small" href="/classroom" target="_blank" style="text-decoration:none">📺 공개화면</a></div><div class="tablewrap" style="max-height:none"><table class="table"><thead><tr><th>반</th><th>1차시</th><th>2차시</th><th>정규 누적</th><th>마지막 차시</th><th>상태</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${x.class_no}반</b></td><td>${fmtSec(x.period1_seconds)}</td><td>${fmtSec(x.period2_seconds)}</td><td><b>${fmtSec(x.total_regular_seconds)}</b></td><td>${x.last_period==='1'?'1차시':x.last_period==='2'?'2차시':x.last_period==='makeup'?'보충':'-'}</td><td>${x.last_status==='running'?'수행 중':x.last_status==='auto_paused'?'45분 자동정지':x.last_status==='paused'?'일시정지':x.last_status==='closed'?'종료':x.last_status==='reset'?'시간 초기화':'-'}</td></tr>`).join('')}</tbody></table></div></section>`}
function monitorCard(){const visible=modeRows();return `<section class="card" id="monitorCard"><div class="sectionHead"><div><h3>👥 학생 상태 모니터</h3><p class="small muted"><b>${modeTitle()}</b>을 표시하고 있습니다. 학생을 누르면 답안·시간·채점을 확인합니다.</p></div><div class="row"><input class="search" id="studentSearch" placeholder="학번·이름 검색" value="${esc(searchText)}" oninput="setSearch(this.value)"><button class="btn secondary small" onclick="exportCsv()">CSV 내보내기</button></div></div><div class="filterBar"><button class="pill ${classFilter===0?'on':''}" onclick="setClass(0)">전체반</button>${[1,2,3,4,5,6,7].map(n=>`<button class="pill ${classFilter===n?'on':''}" onclick="setClass(${n})">${n}반</button>`).join('')}</div>${tableHtml(visible)}</section>`}
function renderMonitorOnly(){const old=document.getElementById('monitorCard');if(old){const div=document.createElement('div');div.innerHTML=monitorCard();old.replaceWith(div.firstElementChild)}}
function tableHtml(rows){if(!rows.length)return `<div class="empty">${viewMode==='online'?'현재 접속 중인 학생이 없습니다.':'조건에 맞는 학생이 없습니다.'}</div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>상태</th><th>학번</th><th>이름</th><th>단계</th><th>1차 정책</th><th>최종 정책</th><th>사용시간</th><th>제출</th><th>자기평가</th><th>최종점수</th></tr></thead><tbody>${rows.map(r=>{const st=statusOf(r),p=r.payload||{};return `<tr class="data" onclick="openDetail('${esc(r.student_id)}')" style="cursor:pointer"><td><span class="badge ${st[0]}">${st[1]}</span></td><td>${esc(r.student_id)}</td><td><b>${esc(r.name)}</b></td><td>${r.ever_entered?stage(p):'-'}</td><td>${(p.policyStations||[]).map(sn).join(' / ')||'-'}</td><td>${(p.finalStations||[]).map(sn).join(' / ')||'-'}</td><td>${r.ever_entered?fmtSec(r.active_seconds):'-'}</td><td>${r.submitted?'완료':'-'}</td><td>${r.self_evaluation?'완료':'-'}</td><td>${r.teacher_grade?.total??''}</td></tr>`}).join('')}</tbody></table></div>`}
function classSummaryCard(all){return `<section class="card"><div class="sectionHead"><div><h3>📊 반별 참여 현황</h3><p class="small muted">각 반의 현재 접속, 접속 이력, 미접속, 제출 상황을 함께 비교합니다.</p></div></div><div class="classSummary">${[1,2,3,4,5,6,7].map(n=>{const rs=all.filter(r=>Number(r.class_no||String(r.student_id).slice(2,3))===n),c=counts(rs);return `<div class="classBox"><b>${n}반 · ${c.all}명</b><p>🟢 지금 접속 <strong>${c.online}</strong>명<br>🔵 접속 이력 <strong>${c.entered}</strong>명<br>🟡 미접속 <strong>${c.never}</strong>명<br>🟣 제출 완료 <strong>${c.submitted}</strong>명</p></div>`}).join('')}</div></section>`}
function toolsCard(d,sess){return `<section class="card"><div class="sectionHead"><div><p class="small" style="color:var(--green)">명단·결과·시험 기록 관리</p><h3>명단·결과·시험 기록 관리</h3><p class="muted">자주 쓰지 않는 관리 기능은 이곳에 모아 두었습니다.</p></div></div><div class="tools"><section class="detailBox"><div class="sectionHead"><div><b>① 학생 명단과 Excel</b><p class="small muted">현재 ${d.roster_count||0}명 등록 · 명단은 그대로 유지됩니다.</p></div></div><details><summary><b>학생 명단 CSV 업로드</b></summary><p class="small muted">반, 학번, 이름 CSV를 선택하거나 붙여 넣으세요.</p><textarea id="rosterText" placeholder="1반,10101,김민서\n1반,10102,박서윤"></textarea><div class="row"><button class="btn secondary small" onclick="saveRoster()">명단 미리보기·저장</button><button class="btn ${d.roster_enabled?'orange':'green'} small" onclick="toggleRoster(${d.roster_enabled?'false':'true'})">명단 확인 ${d.roster_enabled?'끄기':'켜기'}</button></div></details><div class="row" style="margin-top:12px"><button class="btn green" onclick="downloadExcel()">선택 반 가채점 결과 Excel 내려받기</button></div><p class="small muted">위 학생 상태 모니터에서 반을 선택한 뒤 내려받으세요.</p></section><section class="detailBox"><div class="sectionHead"><div><b>② 예상 답안 생성·가채점</b><p class="small muted">AI는 정답을 정하지 않고 근거·권리·이해관계·재판단을 기준으로 영역별 잠정점수와 교사용 피드백을 제시합니다. 교사 최종점수와는 분리됩니다.</p></div><span class="badge ${d.ai_available?'online':'never'}">${d.ai_available?'사용 가능 · '+esc(d.ai_model||''):'API 설정 필요'}</span></div><button class="btn secondary" onclick="toggleAi()" ${sess.is_open?'disabled':''}>API 설정</button><div id="aiSetup" class="hidden"><label>OPENAI_API_KEY<input id="aiKey" type="password" placeholder="sk-... API 키 붙여넣기"></label><label>채점 모델<input id="aiModel" value="${esc(d.ai_model||'gpt-5.6-luna')}"></label><div class="row"><button class="btn green small" onclick="saveAi()">API 키 저장·연결 확인</button><button class="btn secondary small" onclick="clearAi()">저장 키 삭제</button></div></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row"><button class="btn secondary" onclick="createSynthetic()" ${sess.is_open?'disabled':''}>가채점 시험용 모의 제출 만들기</button><button class="btn secondary" onclick="deleteSynthetic()" ${sess.is_open?'disabled':''}>시험용 모의 제출 삭제</button></div>${syntheticStatus?`<div class="notice good" style="margin-top:8px">☑ ${esc(syntheticStatus)}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn green" ${(!d.ai_available||sess.is_open)?'disabled':''} onclick="gradeAllAI()">미가채점 제출자 일괄 가채점</button></div><div id="aiMsg"></div></section></div></section><section class="card danger"><div class="sectionHead"><div><p class="small" style="color:var(--red)">시험 운영 기록 초기화</p><h3>답안·접속 기록만 초기화</h3><p class="small">학생 명단과 API 설정은 유지하고 응시 답안·접속·가채점·교사 점수만 삭제합니다.</p></div><div class="row"><button class="btn secondary" onclick="resetRecords(false)">선택 반 기록 초기화</button><button class="btn red" onclick="resetRecords(true)">전체 기록 초기화</button></div></div></section>`}
function enhanceRosterUi(){const details=document.querySelector('#rosterText')?.closest('details');if(!details||document.getElementById('rosterFile'))return;const p=details.querySelector('p');if(p)p.innerHTML='<b>반, 학번, 이름</b> CSV를 선택하거나 아래에 붙여 넣으세요. 저장 전에 반별 인원과 오류를 확인합니다.';const input=document.createElement('input');input.id='rosterFile';input.type='file';input.accept='.csv,text/csv';details.insertBefore(input,document.getElementById('rosterText'));const link=document.createElement('p');link.innerHTML='<a href="/학생명단_템플릿.csv" download>공통 CSV 템플릿 내려받기</a>';details.insertBefore(link,document.getElementById('rosterText'));const button=[...details.querySelectorAll('button')].find(x=>x.getAttribute('onclick')==='saveRoster()');if(button)button.textContent='명단 미리보기·저장'}
async function refresh(){if(await load()){syncDefaultClass();dashboard();enhanceRosterUi()}else login('교사 인증을 다시 확인해 주세요.')}
function toggleAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;dashboard()}else{autoTimer=setInterval(async()=>{if(await load())dashboard()},5000);dashboard()}}
function logout(){clearInterval(autoTimer);autoTimer=null;pin='';try{sessionStorage.removeItem('HR102_TPIN');sessionStorage.removeItem('HR115_OP_PIN')}catch(e){};login()}
async function openServer(){try{await api('/api/teacher/server/open',{method:'POST',body:JSON.stringify({pin})});await refresh()}catch(e){alert(e.message)}}
async function closeServer(){if(!confirm('전체 학생 서버를 닫을까요? 저장된 답안과 기록은 유지됩니다.'))return;try{await api('/api/teacher/server/close',{method:'POST',body:JSON.stringify({pin})});await refresh()}catch(e){alert(e.message)}}
function detailBox(title,html){return `<div class="detailBox"><b>${title}</b><p>${html||'<span class="muted">기록 없음</span>'}</p></div>`}
function openDetail(id){const r=(data.students||[]).find(x=>x.student_id===id);if(!r)return;const p=r.payload||{},g=r.teacher_grade||{},a=r.ai_grade||{},t=r.time||{},st=statusOf(r);document.body.insertAdjacentHTML('beforeend',`<div id="ov" class="overlay" onclick="closeDetail()"></div><aside id="drawer" class="drawer"><div class="sectionHead"><div><h3>${esc(r.student_id)} ${esc(r.name)}</h3><p class="small muted"><span class="badge ${st[0]}">${st[1]}</span> · ${r.ever_entered?stage(p):'활동 기록 없음'} · ${r.ever_entered?fmtSec(r.active_seconds):'-'}</p></div><button class="btn secondary small" onclick="closeDetail()">닫기</button></div>${!r.ever_entered?'<div class="notice warn">이 학생은 아직 이 수행평가에 한 번도 들어온 기록이 없습니다.</div>':`${detailBox('핵심 근거',(p.evidence||[]).map(ev).join('<br>'))}${detailBox('1차 정책',(p.policyStations||[]).map(sn).join(' · ')||'-')}${detailBox('정책 기준 · 권리',(p.criteria||[]).map(cn).join(' · ')+' / '+(p.rights||[]).map(rn).join(' · '))}${detailBox('핵심 판단 ①',esc(p.answer1||''))}${detailBox('정책 영향','먼저 도움: '+(p.beneficiaries||[]).map(cit).join(', ')+'<br>기다림: '+(p.delayed||[]).map(cit).join(', ')+'<br>한계: '+esc(p.limitation==='other'?(p.limitationOther||'기타'):LIMIT[p.limitation]||p.limitation||'-')+'<br>보완: '+esc(p.remedy==='other'?(p.remedyOther||'기타'):REM[p.remedy]||p.remedy||'-'))}${detailBox('핵심 판단 ②',esc(p.answer2||''))}${detailBox('최종 정책',(p.finalStations||[]).map(sn).join(' · ')||'-')}${detailBox('핵심 판단 ③',esc(p.answer3||''))}${detailBox('자기평가서',r.self_evaluation?esc(r.self_evaluation.text||'')+'<br><span class="muted small">저장: '+esc(r.self_evaluation.submitted_at||'')+'</span>':'아직 작성하지 않음')}`}<section class="card"><h4>활동시간 관리</h4><p class="small">1차시 ${fmtSec(t.period1_used||0)} · 2차시 ${fmtSec(t.period2_used||0)} · 추가 ${fmtSec(t.extra_seconds||0)}</p><div class="row"><button class="btn secondary small" onclick="resetTime('${esc(id)}','1')">1차시 초기화</button><button class="btn secondary small" onclick="resetTime('${esc(id)}','2')">2차시 초기화</button><button class="btn secondary small" onclick="setExempt('${esc(id)}',${t.penalty_exempt?'false':'true'})">시간감점 ${t.penalty_exempt?'적용':'면제'}</button></div></section>${r.ever_entered?`<section class="card"><h4>AI 가채점</h4>${r.ai_grade?`<p><b>총점 ${a.total??'-'}</b> · ${esc(a.summary||'')}</p>`:'<p class="muted small">아직 가채점하지 않았습니다.</p>'}<button class="btn secondary small" ${data.session?.is_open||!data.ai_available?'disabled':''} onclick="gradeOne('${esc(id)}')">이 학생 AI 가채점</button></section><section class="card"><h4>교사 최종 채점</h4><div class="gradeGrid"><label>자료·정책 /25<input id="g1" type="number" min="0" max="25" value="${g.evidence_policy??''}"></label><label>권리·기준 /20<input id="g2" type="number" min="0" max="20" value="${g.rights_criteria??''}"></label><label>이해관계 /20<input id="g3" type="number" min="0" max="20" value="${g.tradeoff??''}"></label><label>한계·보완 /15<input id="g4" type="number" min="0" max="15" value="${g.limit_remedy??''}"></label><label>재판단 /20<input id="g5" type="number" min="0" max="20" value="${g.revision??''}"></label></div><label>교사 피드백<textarea id="gcomment">${esc(r.teacher_comment||'')}</textarea></label><button class="btn small" onclick="saveGrade('${esc(id)}')">최종 채점 저장</button></section>`:''}</aside>`)}
const openDetailBase=openDetail;openDetail=function(id){openDetailBase(id);const r=(data.students||[]).find(x=>x.student_id===id),a=r?.ai_grade;if(!a)return;const section=[...document.querySelectorAll('#drawer section.card')].find(x=>x.querySelector('h4')?.textContent.includes('AI 가채점'));if(!section)return;const labels={evidence_policy:'자료와 정책 연결',rights_criteria:'권리와 기준 연결',tradeoff:'수혜·대기 집단 비교',limit_remedy:'한계와 보완',revision:'새 정보 재판단'},areas=a.areas||{};section.innerHTML=`<h4>AI 가채점 · 잠정 ${a.total??'-'} / 100점</h4><p class="small muted">신뢰도 ${a.confidence==='high'?'높음':a.confidence==='low'?'낮음':'보통'} · 최종 점수는 교사가 직접 확정합니다.</p><div class="notice good"><b>전체 판단</b><br>${esc(a.overall||a.summary||'')}</div><div class="grid grid2" style="margin-top:9px"><div class="detailBox"><b>잘한 점</b><p>${esc(a.strength||'-')}</p></div><div class="detailBox"><b>보완할 점</b><p>${esc(a.improvement||'-')}</p></div></div>${Object.entries(labels).map(([k,label])=>{const v=areas[k]||{},score=v.score??a[k]??'-';return `<div class="detailBox"><b>${label} · ${score}점</b><p>${esc(v.reason||'')}</p>${v.evidence?.length?`<p class="small muted">근거 표시: ${v.evidence.map(x=>'“'+esc(x)+'”').join(' / ')}</p>`:''}</div>`}).join('')}${a.feedback?`<div class="notice"><b>교사용 피드백</b><br>${esc(a.feedback)}</div>`:''}${a.reviewFlags?.length?`<div class="notice warn"><b>교사 확인 권장</b><br>${a.reviewFlags.map(x=>'• '+esc(x)).join('<br>')}</div>`:''}<button class="btn secondary small" ${data.session?.is_open||!data.ai_available?'disabled':''} onclick="gradeOne('${esc(id)}')">다시 가채점</button>`}
function closeDetail(){document.getElementById('ov')?.remove();document.getElementById('drawer')?.remove()}
async function resetTime(id,period){try{await api('/api/teacher/time-reset',{method:'POST',body:JSON.stringify({pin,student_id:id,period})});closeDetail();await refresh();openDetail(id)}catch(e){alert(e.message)}}
async function setExempt(id,exempt){try{await api('/api/teacher/time-exempt',{method:'POST',body:JSON.stringify({pin,student_id:id,exempt})});closeDetail();await refresh();openDetail(id)}catch(e){alert(e.message)}}
async function saveGrade(id){const max=[25,20,20,15,20],vals=max.map((m,i)=>Math.max(0,Math.min(m,Number(document.getElementById('g'+(i+1)).value||0)))),grade={evidence_policy:vals[0],rights_criteria:vals[1],tradeoff:vals[2],limit_remedy:vals[3],revision:vals[4],total:vals.reduce((a,b)=>a+b,0)};try{await api('/api/teacher/grade',{method:'POST',body:JSON.stringify({pin,student_id:id,grade,comment:document.getElementById('gcomment').value})});closeDetail();await refresh();openDetail(id)}catch(e){alert(e.message)}}
async function gradeOne(id){try{await api('/api/teacher/ai-grade',{method:'POST',body:JSON.stringify({pin,student_id:id})},120000);closeDetail();await refresh();openDetail(id)}catch(e){alert(e.name==='AbortError'?'AI 응답이 오래 걸리고 있습니다. 잠시 후 다시 시도해 주세요.':e.message)}}
async function gradeAllAI(){const msg=document.getElementById('aiMsg');if(msg)msg.innerHTML='<div class="notice">가채점 작업을 시작하고 있습니다…</div>';try{let x=await api('/api/teacher/ai-grade-all',{method:'POST',body:JSON.stringify({pin})}),job=x.job||{};while(job.running){if(msg)msg.innerHTML=`<div class="notice">가채점 진행 중 · ${job.completed||0}/${job.total||0}명 · 성공 ${job.graded||0}명${job.failed?' · 실패 '+job.failed+'명':''}<br><span class="small">이 화면을 닫아도 서버에서 계속 처리됩니다.</span></div>`;await new Promise(r=>setTimeout(r,2000));x=await api('/api/teacher/ai-grade-all',{method:'POST',body:JSON.stringify({pin,action:'status'})});job=x.job||{}}if(msg)msg.innerHTML=`<div class="notice good">${job.graded||0}명 가채점을 마쳤습니다.${job.failed?' 실패 '+job.failed+'명':''}</div>`;await refresh()}catch(e){if(msg)msg.innerHTML='<div class="notice bad">'+esc(e.name==='AbortError'?'진행 상태 확인이 지연되고 있습니다. 새로고침하면 계속 확인할 수 있습니다.':e.message)+'</div>'}}
async function createSynthetic(){if(!confirm(`등록된 학생 중 실제 기록이 없는 학생에게 수준이 다양한 예상 답안을 모의 제출로 만들까요?\n기존 학생 기록은 건드리지 않습니다.`))return;try{const x=await api('/api/teacher/synthetic-submissions',{method:'POST',body:JSON.stringify({pin})});syntheticStatus=`예상 답안 ${x.created}명 생성 완료 · 기존 기록으로 건너뜀 ${x.skipped}명`;viewMode='submitted';await refresh()}catch(e){alert(e.message)}}
async function deleteSynthetic(){if(!confirm('시험용으로 만든 모의 제출만 삭제할까요? 실제 학생 기록은 삭제되지 않습니다.'))return;try{const x=await api('/api/teacher/synthetic-submissions',{method:'POST',body:JSON.stringify({pin,action:'delete'})});syntheticStatus=`시험용 모의 제출 ${x.removed}건 삭제 완료`;await refresh()}catch(e){alert(e.message)}}
async function downloadExcel(){if(!classFilter)return alert('먼저 학생 상태 모니터에서 내려받을 반을 선택하세요.');try{const r=await fetch(`/api/teacher/export.xlsx?pin=${encodeURIComponent(pin)}&class_no=${classFilter}`);if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.error||'Excel 내보내기에 실패했습니다.')}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`인권도시_${classFilter}반_학생결과_AI가채점_교사채점.xlsx`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}catch(e){alert(e.message)}}
async function resetRecords(all){if(!all&&!classFilter)return alert('먼저 초기화할 반을 선택하세요.');const target=all?'전체 학생':`${classFilter}반`;if(!confirm(`${target}의 응시 답안·접속·가채점·교사 점수를 초기화할까요?\n학생 명단과 API 설정은 유지됩니다. 이 작업은 되돌릴 수 없습니다.`))return;try{const x=await api('/api/teacher/reset-records',{method:'POST',body:JSON.stringify(all?{pin,all:true}:{pin,class_no:classFilter})});alert(`${target} 기록 ${x.resetCount}건을 초기화했습니다. 학생 명단은 유지됩니다.`);viewMode='online';await refresh()}catch(e){alert(e.message)}}
function toggleAi(){document.getElementById('aiSetup')?.classList.toggle('hidden')}
async function saveAi(){try{await api('/api/teacher/ai-config',{method:'POST',body:JSON.stringify({pin,api_key:document.getElementById('aiKey').value.trim(),model:document.getElementById('aiModel').value.trim()})});await refresh()}catch(e){alert(e.message)}}
async function clearAi(){try{await api('/api/teacher/ai-clear',{method:'POST',body:JSON.stringify({pin})});await refresh()}catch(e){alert(e.message)}}
async function saveRoster(){const file=document.getElementById('rosterFile')?.files?.[0],csvText=file?await file.text():document.getElementById('rosterText').value;if(!csvText.trim())return alert('학생 명단 CSV를 선택하거나 내용을 붙여 넣으세요.');try{const preview=await api('/api/teacher/roster/import',{method:'POST',body:JSON.stringify({pin,csvText,preview:true})}),r=preview.report||{},s=r.summary||{},classes=Object.entries(s.byClass||{}).map(([c,n])=>`${c}반 ${n}명`).join(' / '),issues=[...(r.errors||[]),...(r.warnings||[])].slice(0,5).map(x=>`${x.row}행: ${x.message}`).join('\n');if(!confirm(`정상 ${s.accepted||0}명 · 중복 ${s.duplicates||0}명 · 오류 ${s.errors||0}건\n${classes}${issues?'\n\n'+issues:''}\n\n정상 학생을 명단으로 저장할까요?`))return;await api('/api/teacher/roster/import',{method:'POST',body:JSON.stringify({pin,csvText})});await refresh()}catch(e){alert(e.message)}}
async function toggleRoster(enabled){try{await api('/api/teacher/roster/toggle',{method:'POST',body:JSON.stringify({pin,enabled})});await refresh()}catch(e){alert(e.message)}}
async function resetAll(){if(prompt('모든 시범·활동 기록을 지우려면 초기화 라고 입력하세요.')!=='초기화')return;try{await api('/api/teacher/reset-activity',{method:'POST',body:JSON.stringify({pin})});viewMode='online';await refresh()}catch(e){alert(e.message)}}
function cell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCsv(){const h=['학번','이름','반','상태','단계','활동초','시간감점','1차정책','최종정책','제출','자기평가서','AI총점','교사총점','피드백'],lines=[h];for(const r of data.students||[]){const p=r.payload||{},st=statusOf(r)[1];lines.push([r.student_id,r.name,r.class_no,st,stage(p),r.active_seconds,r.time_penalty,(p.policyStations||[]).map(sn).join(' / '),(p.finalStations||[]).map(sn).join(' / '),r.submitted?'완료':'',r.self_evaluation?.text||'',r.ai_grade?.total??'',r.teacher_grade?.total??'',r.teacher_comment||''])}const blob=new Blob(['\ufeff'+lines.map(r=>r.map(cell).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='인권도시_v12.3_학생상태_채점현황.csv';a.click();URL.revokeObjectURL(u)}
window.addEventListener('error',e=>{console.error(e.error||e.message)});
(async()=>{if(!pin)return login();if(await load()){syncDefaultClass();dashboard();enhanceRosterUi()}else login()})();
</script>
