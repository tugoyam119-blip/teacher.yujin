<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>인권도시 정책결정 수행평가 교사용 v10.1</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182033;--muted:#667085;--line:#e4e8f0;--navy:#17345f;--blue:#315b98;--soft:#eaf1fb;--green:#176b4a;--orange:#9a5a14;--red:#a83a3a;--shadow:0 10px 30px rgba(29,45,76,.08);--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;line-height:1.55}.app{min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.top b{color:var(--navy)}.version{font-size:12px;color:var(--muted);font-weight:700}.wrap{max-width:820px;margin:auto;padding:16px}.teacherWrap{max-width:1280px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#fff,#edf3fc);border-color:#d8e3f4}.hero h1,.hero h2{margin:.25em 0;color:var(--navy);line-height:1.25}.kicker{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--blue)}.muted{color:var(--muted)}.small{font-size:13px}.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:16px}.top{padding:10px 12px}.desktopOnly{display:none!important}}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;background:var(--navy);color:#fff;min-height:46px}.btn:hover{filter:brightness(1.04)}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.secondary{background:#eef2f7;color:var(--ink);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}.btn.sm{padding:8px 11px;min-height:34px;font-size:13px;border-radius:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}.bottomInner{max-width:820px;margin:auto;display:flex;gap:10px}.bottom .btn{flex:1}.chip{display:inline-flex;align-items:center;gap:6px;background:#eef3fa;border:1px solid #dce6f4;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700;margin:3px}.chip.green{background:#e9f7f0;border-color:#cfeadd;color:var(--green)}.chip.orange{background:#fff3e6;border-color:#f5d7b4;color:var(--orange)}.chip.gray{background:#f2f4f7;border-color:#e4e7ec;color:#475467}.choice{border:2px solid var(--line);border-radius:15px;padding:14px;background:#fff;cursor:pointer;transition:.15s}.choice:hover{border-color:#a9bddb}.choice.on{border-color:var(--blue);background:#eef4fd}.choice h3{margin:0 0 5px}.choice p{margin:0;color:var(--muted);font-size:14px}.choice.disabled{opacity:.45;cursor:not-allowed}.stat{padding:13px;border-radius:14px;background:#f7f9fc;border:1px solid var(--line)}.stat span{font-size:12px;color:var(--muted);display:block}.stat b{font-size:22px;color:var(--navy)}.budgetbar{height:14px;background:#eef1f5;border-radius:999px;overflow:hidden}.budgetbar i{display:block;height:100%;background:var(--blue);transition:.2s}.budgetbar.over i{background:var(--red)}.notice{border-left:4px solid var(--blue);background:#f0f5fd;border-radius:12px;padding:12px 14px;margin:10px 0}.notice.warn{border-color:var(--orange);background:#fff7ed}.notice.bad{border-color:var(--red);background:#fff0f0}.notice.good{border-color:var(--green);background:#edf9f3}.progress{display:flex;gap:5px;margin-bottom:12px}.progress i{height:7px;border-radius:999px;background:#dfe4ec;flex:1}.progress i.on{background:var(--blue)}label{font-weight:800;display:block;margin:8px 0 5px}input,textarea,select{width:100%;border:1px solid #ccd3df;border-radius:12px;padding:12px 13px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:120px;resize:vertical}.count{font-size:12px;color:var(--muted);text-align:right;margin-top:5px}.resource{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.resource.done{border-color:#a8d8c1;background:#f6fcf9}.resource h3{margin:0 0 8px}.metric{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:7px 0}.metric:last-child{border:0}.evidence{border:1px solid var(--line);border-radius:13px;padding:11px;margin:7px 0;background:#fafbfc}.evidence.on{border-color:var(--blue);background:#eef4fd}.board{background:#122a4c;color:#fff;border-radius:18px;padding:17px}.board .muted{color:#c6d4e9}.board .chip{color:#15243c}.arrow{font-size:21px;text-align:center;opacity:.8}.vs{font-size:22px;font-weight:900;text-align:center;color:var(--muted)}.citizen{font-size:15px}.help{font-size:13px;color:var(--muted);margin-top:5px}.drawerBtn{position:fixed;right:14px;bottom:88px;z-index:24;border:0;border-radius:999px;background:#fff;color:var(--navy);box-shadow:0 8px 26px rgba(26,44,77,.18);padding:10px 13px;font-weight:900;cursor:pointer}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(390px,94vw);background:#fff;z-index:60;box-shadow:-20px 0 45px rgba(0,0,0,.16);padding:18px;overflow:auto}.overlay{position:fixed;inset:0;background:rgba(18,32,51,.38);z-index:55}.hidden{display:none!important}.quizOpt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;margin:7px 0;cursor:pointer}.quizOpt:hover{border-color:#9fb6d7}.report dt{font-size:12px;color:var(--muted);font-weight:800}.report dd{margin:2px 0 12px;font-weight:700}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;white-space:nowrap}.table th{background:#f7f9fc;position:sticky;top:0}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;font-weight:800;cursor:pointer}.tab.on{background:var(--navy);color:#fff}.scorebox{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fafbfc}.saveState{position:fixed;left:12px;bottom:89px;z-index:24;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--muted)}.saveState.ok{color:var(--green)}.saveState.warn{color:var(--orange)}.saveState.bad{color:var(--red)}.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--navy)}details{border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#fafbfc}summary{cursor:pointer;font-weight:800}.tag{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f7;color:#475467}.teacherOnly{background:#fff8e8;border-color:#f2ddb0}.dangerZone{border-color:#efb8b8;background:#fff7f7}
</style></head>
<body><div id="root"><div class="teacherWrap"><section class="card"><h2>교사용 관리화면을 불러오는 중입니다…</h2></section></div></div>
<script>
const VERSION='v10.1';
const root=document.getElementById('root');
let pin=''; try{pin=sessionStorage.getItem('HR101_TPIN')||''}catch(e){}
let data=null,autoTimer=null;
const STATION={central:'새봄중앙역',welfare:'복지센터역',hospital:'대학병원역',market:'전통시장역',park:'푸른공원역',school:'새봄고역'};
const CRIT={mobility:'교통약자 보호',essential:'필수시설 접근',people:'많은 시민에게 혜택',efficiency:'예산 효율',balance:'지역 간 형평성',urgency:'문제의 긴급성'};
const RIGHTS={mobility:'이동권',equality:'평등권',life:'인간다운 생활을 할 권리',dignity:'인간의 존엄과 가치'};
const CIT={wheel:'휠체어 이용 시민',elder:'고령 시민',hospital:'병원 이용 시민',student:'학생',commuter:'직장인',market:'전통시장 상인·이용객',resident:'인근 주민'};
const LIMIT={area:'특정 지역에 혜택 집중',wait:'다른 역 이용자가 오래 기다림',cost:'비용 부담',reach:'혜택 시민 수 제한',future:'추가 사업 필요'};
const REM={next:'다음 사업에서 밀린 역 우선 설치',support:'임시 이동지원 서비스',budget:'추가예산 확보',opinion:'시민 의견 반영',plan:'단계별 설치계획 공개'};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sn=id=>STATION[id]||id, cn=id=>CRIT[id]||id, rn=id=>RIGHTS[id]||id, cit=id=>CIT[id]||id;
function fmtSec(sec){sec=Number(sec||0);return Math.floor(sec/60)+'분 '+String(sec%60).padStart(2,'0')+'초'}
function period(v){return v==='1'?'1차시':v==='2'?'2차시':v==='makeup'?'보충·추가시간':'닫힘'}
function stage(p){return ['시장 브리핑','자료 탐색','정책 설계','정책 근거','정책 영향','새 정보','최종 정책','보고서'][Number(p?.step||0)]||'-'}
async function api(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(url,{headers:{'Content-Type':'application/json'},signal:c.signal,...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청을 처리하지 못했습니다.');return j}finally{clearTimeout(t)}}
function shell(body){return `<div class="top"><b>🏛️ 인권도시 정책결정</b><span class="version">TEACHER · ${VERSION}</span></div><div class="teacherWrap">${body}</div>`}
function login(msg=''){root.innerHTML=shell(`<section class="card hero teacherOnly"><div class="kicker">교사용 관리</div><h1>인권도시 정책결정 수행평가</h1><p>반별 차시 운영, 학생 진행, 활동시간, 제출 결과와 채점을 관리합니다.</p></section><section class="card"><label>교사 PIN</label><input id="pin" type="password" placeholder="교사 PIN"><div style="height:10px"></div><button class="btn" onclick="auth()">관리 화면 열기</button>${msg?`<div class="notice bad">${esc(msg)}</div>`:''}</section><section class="card"><a class="btn secondary" href="/" style="display:inline-block;text-decoration:none">학생 화면 보기</a></section>`)}
async function auth(){pin=document.getElementById('pin').value.trim();try{data=await api('/api/teacher/dashboard?pin='+encodeURIComponent(pin));try{sessionStorage.setItem('HR101_TPIN',pin)}catch(e){}dashboard()}catch(e){login(e.name==='AbortError'?'서버 응답이 지연되고 있습니다. 잠시 뒤 다시 시도해 주세요.':e.message)}}
async function load(){if(!pin)return false;try{data=await api('/api/teacher/dashboard?pin='+encodeURIComponent(pin));return true}catch(e){if(e.message.includes('PIN')){pin='';try{sessionStorage.removeItem('HR101_TPIN')}catch(x){}}return false}}
function dashboard(){const d=data||{},rows=d.students||[],sess=d.session||{},submitted=rows.filter(x=>x.submitted).length,active=rows.filter(x=>!x.submitted&&x.payload).length;root.innerHTML=shell(`<section class="card hero teacherOnly"><div class="between"><div><div class="kicker">교사용 관리 · ${VERSION}</div><h1>수행평가 운영·채점</h1><p>${sess.is_open?`${sess.class_no?`${sess.class_no}반`:'전체반'} · ${period(sess.period_type)} 진행 중`:'활동이 닫혀 있습니다.'}</p></div><button class="btn secondary sm" onclick="logout()">로그아웃</button></div></section><div class="grid grid4"><div class="stat"><span>등록 학생</span><b>${rows.length}</b></div><div class="stat"><span>진행 중</span><b>${active}</b></div><div class="stat"><span>제출 완료</span><b>${submitted}</b></div><div class="stat"><span>활동 상태</span><b style="font-size:17px">${sess.is_open?'진행 중':'닫힘'}</b></div></div><section class="card"><h2>⏱ 반별 차시 운영</h2><div class="grid grid3"><label>대상 반<select id="classNo"><option value="0">전체반</option>${[1,2,3,4,5,6,7].map(x=>`<option value="${x}">${x}반</option>`).join('')}</select></label><label>활동 구분<select id="periodType"><option value="1">1차시 45분</option><option value="2">2차시 45분</option><option value="makeup">보충·추가시간</option></select></label><div style="align-self:end"><button class="btn green" onclick="openClass()">활동 개방</button></div></div><div class="row" style="margin-top:10px"><button class="btn red" onclick="closeClass()">현재 활동 종료</button><button class="btn secondary" onclick="refresh()">새로고침</button><button class="btn secondary" onclick="toggleAuto()">${autoTimer?'자동 새로고침 끄기':'5초 자동 새로고침'}</button><a class="btn secondary" href="/" target="_blank" style="text-decoration:none">학생 화면 테스트</a></div></section><section class="card"><div class="between"><div><h2>👥 학생 진행 현황</h2><p class="muted">학생을 누르면 정책 판단 과정과 답안을 확인할 수 있습니다.</p></div><button class="btn secondary sm" onclick="exportCsv()">CSV 내보내기</button></div><div class="tablewrap"><table class="table"><thead><tr><th>학번</th><th>이름</th><th>단계</th><th>1차 정책</th><th>최종 정책</th><th>사용시간</th><th>감점</th><th>제출</th><th>AI</th><th>최종점수</th></tr></thead><tbody>${rows.map(r=>{const p=r.payload||{};return `<tr onclick="detail('${esc(r.student_id)}')" style="cursor:pointer"><td>${esc(r.student_id)}</td><td>${esc(r.name)}</td><td>${stage(p)}</td><td>${(p.policyStations||[]).map(sn).join(' / ')}</td><td>${(p.finalStations||[]).map(sn).join(' / ')}</td><td>${fmtSec(r.active_seconds)}</td><td>${r.time_penalty?'-'+r.time_penalty:'0'}</td><td>${r.submitted?'완료':'진행'}</td><td>${r.ai_grade?'완료':'-'}</td><td>${r.teacher_grade?.total??''}</td></tr>`}).join('')}</tbody></table></div></section><div class="grid grid2"><section class="card"><h2>📋 명단 관리</h2><textarea id="rosterText" placeholder="10101,김민서
10102,박서윤"></textarea><div class="row"><button class="btn secondary" onclick="saveRoster()">명단 저장</button><button class="btn ${d.roster_enabled?'orange':'green'}" onclick="toggleRoster(${d.roster_enabled?'false':'true'})">명단 확인 ${d.roster_enabled?'끄기':'켜기'}</button></div><p>현재 ${d.roster_count||0}명 · ${d.roster_enabled?'명단 확인 중':'명단 확인 꺼짐'}</p></section><section class="card"><h2>🤖 AI 가채점</h2><p>${d.ai_available?`사용 가능 · ${esc(d.ai_model||'')}`:'API 키가 설정되지 않았습니다.'}</p><div class="row"><button class="btn" ${(!d.ai_available||sess.is_open)?'disabled':''} onclick="gradeAll()">미채점 답안 가채점</button><button class="btn secondary" ${sess.is_open?'disabled':''} onclick="toggleAI()">API 설정</button></div><div id="aiBox" class="hidden"><label>OpenAI API 키</label><input id="aiKey" type="password"><label>채점 모델</label><input id="aiModel" value="${esc(d.ai_model||'gpt-5.6-luna')}"><div class="row"><button class="btn secondary" onclick="saveAI()">연결 확인·저장</button><button class="btn secondary" onclick="clearAI()">저장 키 지우기</button></div></div><div id="aiMsg"></div></section></div><section class="card dangerZone"><h2>🧹 활동 기록 관리</h2><p class="small">실제 평가 전 시범 기록을 모두 지울 때만 사용하세요. 명단과 API 설정은 유지됩니다.</p><button class="btn red" onclick="resetAll()">전체 활동기록 초기화</button></section>`)}
async function refresh(){if(await load())dashboard();else login('교사 정보를 다시 확인해 주세요.')}
function logout(){clearInterval(autoTimer);autoTimer=null;pin='';try{sessionStorage.removeItem('HR101_TPIN')}catch(e){}login()}
function toggleAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;dashboard()}else{autoTimer=setInterval(refresh,5000);dashboard()}}
async function post(path,obj={}){return api(path,{method:'POST',body:JSON.stringify({pin,...obj})})}
async function openClass(){try{await post('/api/teacher/open',{class_no:Number(document.getElementById('classNo').value),period_type:document.getElementById('periodType').value});await refresh()}catch(e){alert(e.message)}}
async function closeClass(){try{await post('/api/teacher/close');await refresh()}catch(e){alert(e.message)}}
async function saveRoster(){const rows=document.getElementById('rosterText').value.split('\n').map(x=>x.replace(/\r/g,'').trim()).filter(Boolean).map(line=>{let [student_id,...rest]=line.split(',');return{student_id:(student_id||'').trim(),name:rest.join(',').trim()}}).filter(x=>x.student_id&&x.name);if(!rows.length)return alert('학번,이름 형식으로 입력하세요.');try{await post('/api/teacher/roster/import',{rows});await refresh()}catch(e){alert(e.message)}}
async function toggleRoster(enabled){try{await post('/api/teacher/roster/toggle',{enabled});await refresh()}catch(e){alert(e.message)}}
async function resetAll(){if(prompt('전체 활동기록을 지우려면 초기화 라고 입력하세요.')!=='초기화')return;try{await post('/api/teacher/reset-activity');await refresh()}catch(e){alert(e.message)}}
function toggleAI(){document.getElementById('aiBox').classList.toggle('hidden')}
async function saveAI(){const m=document.getElementById('aiMsg');try{m.innerHTML='<div class="notice">API 연결 확인 중…</div>';await post('/api/teacher/ai-config',{api_key:document.getElementById('aiKey').value.trim(),model:document.getElementById('aiModel').value.trim()});await refresh()}catch(e){m.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}}
async function clearAI(){try{await post('/api/teacher/ai-clear');await refresh()}catch(e){alert(e.message)}}
async function gradeAll(){const m=document.getElementById('aiMsg');try{m.innerHTML='<div class="notice">가채점 중…</div>';const x=await post('/api/teacher/ai-grade-all');m.innerHTML='<div class="notice good">'+x.graded+'명 가채점을 마쳤습니다.</div>';await load();setTimeout(dashboard,500)}catch(e){m.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}}
function section(t,b){return `<section class="card"><h3>${t}</h3><div>${b||'<span class="muted">기록 없음</span>'}</div></section>`}
function closeDetail(){document.getElementById('detailOv')?.remove();document.getElementById('detail')?.remove()}
function detail(id){const r=(data.students||[]).find(x=>x.student_id===id);if(!r)return;const p=r.payload||{},t=r.time||{},g=r.teacher_grade||{},a=r.ai_grade||{};document.body.insertAdjacentHTML('beforeend',`<div id="detailOv" class="overlay" onclick="closeDetail()"></div><aside id="detail" class="drawer" style="width:min(700px,96vw)"><div class="between"><div><h2>${esc(r.student_id)} ${esc(r.name)}</h2><p class="muted">${stage(p)} · ${fmtSec(r.active_seconds)} · 시간감점 ${r.time_penalty?'-'+r.time_penalty:'0'}</p></div><button class="btn secondary sm" onclick="closeDetail()">닫기</button></div>${section('핵심 근거',(p.evidence||[]).join('<br>'))}${section('1차 정책',(p.policyStations||[]).map(sn).join(' · '))}${section('정책 기준·권리',(p.criteria||[]).map(cn).join(' · ')+' / '+(p.rights||[]).map(rn).join(' · '))}${section('핵심 판단 ①',esc(p.answer1||''))}${section('정책 영향','먼저 도움: '+(p.beneficiaries||[]).map(cit).join(', ')+'<br>기다림: '+(p.delayed||[]).map(cit).join(', ')+'<br>한계: '+(LIMIT[p.limitation]||p.limitation||'-')+'<br>보완: '+(REM[p.remedy]||p.remedy||'-'))}${section('핵심 판단 ②',esc(p.answer2||''))}${section('최종 정책',(p.finalStations||[]).map(sn).join(' · '))}${section('핵심 판단 ③',esc(p.answer3||''))}<section class="card"><h3>활동시간 관리</h3><p>1차시 ${fmtSec(t.period1_used||0)} · 2차시 ${fmtSec(t.period2_used||0)} · 추가 ${fmtSec(t.extra_seconds||0)}</p><div class="row"><button class="btn secondary sm" onclick="resetTime('${esc(id)}','1')">1차시 초기화</button><button class="btn secondary sm" onclick="resetTime('${esc(id)}','2')">2차시 초기화</button><button class="btn secondary sm" onclick="exempt('${esc(id)}',${t.penalty_exempt?'false':'true'})">시간감점 ${t.penalty_exempt?'적용':'면제'}</button></div></section><section class="card teacherOnly"><h3>AI 가채점</h3>${r.ai_grade?`<p><b>총점 ${a.total??'-'}</b></p><p>${esc(a.summary||'')}</p>`:'<p class="muted">아직 가채점하지 않았습니다.</p>'}<button class="btn secondary" ${data.session?.is_open||!data.ai_available?'disabled':''} onclick="gradeOne('${esc(id)}')">이 학생 AI 가채점</button></section><section class="card"><h3>교사 최종 채점</h3><div class="grid grid2">${[['g1','자료·정책 /25',25,g.evidence_policy],['g2','권리·기준 /20',20,g.rights_criteria],['g3','이해관계 /20',20,g.tradeoff],['g4','한계·보완 /15',15,g.limit_remedy],['g5','재판단 /20',20,g.revision]].map(x=>`<label>${x[1]}<input id="${x[0]}" type="number" min="0" max="${x[2]}" value="${x[3]??''}"></label>`).join('')}</div><label>교사 피드백</label><textarea id="gcomment">${esc(r.teacher_comment||'')}</textarea><button class="btn" onclick="saveGrade('${esc(id)}')">최종 채점 저장</button></section></aside>`)}
async function resetTime(id,period){try{await post('/api/teacher/time-reset',{student_id:id,period});closeDetail();await refresh();detail(id)}catch(e){alert(e.message)}}
async function exempt(id,exempt){try{await post('/api/teacher/time-exempt',{student_id:id,exempt});closeDetail();await refresh();detail(id)}catch(e){alert(e.message)}}
async function gradeOne(id){try{await post('/api/teacher/ai-grade',{student_id:id});closeDetail();await refresh();detail(id)}catch(e){alert(e.message)}}
async function saveGrade(id){const max=[25,20,20,15,20],v=max.map((m,i)=>Math.max(0,Math.min(m,Number(document.getElementById('g'+(i+1)).value||0)))),grade={evidence_policy:v[0],rights_criteria:v[1],tradeoff:v[2],limit_remedy:v[3],revision:v[4],total:v.reduce((a,b)=>a+b,0)};try{await post('/api/teacher/grade',{student_id:id,grade,comment:document.getElementById('gcomment').value});closeDetail();await refresh();detail(id)}catch(e){alert(e.message)}}
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCsv(){const h=['학번','이름','단계','활동초','시간감점','1차정책','최종정책','제출','AI총점','교사총점'],lines=[h];for(const r of data.students||[]){const p=r.payload||{};lines.push([r.student_id,r.name,stage(p),r.active_seconds,r.time_penalty,(p.policyStations||[]).map(sn).join(' / '),(p.finalStations||[]).map(sn).join(' / '),r.submitted?'완료':'진행',r.ai_grade?.total??'',r.teacher_grade?.total??''])}const nl=String.fromCharCode(10),bom=String.fromCharCode(0xFEFF),b=new Blob([bom+lines.map(row=>row.map(csv).join(',')).join(nl)],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='인권도시_v10.1_교사용.csv';a.click();URL.revokeObjectURL(u)}
window.addEventListener('error',e=>{root.innerHTML=shell(`<section class="card"><h2>교사용 화면을 불러오지 못했습니다.</h2><p>페이지를 새로고침해 주세요.</p></section>`)});
(async()=>{if(!pin)return login();root.innerHTML=shell('<section class="card"><h2>교사용 관리화면을 불러오는 중입니다…</h2></section>');if(await load())dashboard();else login('교사 PIN을 다시 입력해 주세요.')})();
</script></body></html>
