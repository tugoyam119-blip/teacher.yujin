<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인권도시 정책결정 수행평가 · 교실 화면</title>
<style>
*{box-sizing:border-box}:root{--nav:#10233f;--blue:#2c68c5;--bg:#edf2f8;--line:#d8e1ec;--green:#187a4b;--orange:#a96816;--muted:#617086}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#172033;min-height:100vh}.page{width:min(1500px,calc(100% - 48px));margin:auto;padding:24px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:20px;font-weight:950;color:var(--nav)}.version{font-size:12px;color:var(--muted)}.classTabs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.classTab{border:1px solid var(--line);background:#fff;color:#40516a;border-radius:13px;padding:10px 7px;font-weight:900;cursor:pointer}.classTab.on{background:var(--nav);border-color:var(--nav);color:#fff}.classTab.active:not(.on){outline:3px solid #bcd5fa}.classTab small{display:block;font-size:9px;font-weight:700;margin-top:2px;opacity:.75}.hero{margin-top:12px;border-radius:28px;padding:31px 36px;background:linear-gradient(135deg,#10233f,#23558e);color:#fff;display:grid;grid-template-columns:1.5fr .65fr;gap:24px;align-items:center;box-shadow:0 16px 40px #19365c22}.kicker{font-size:14px;letter-spacing:.08em;font-weight:900;color:#cfe1ff}.hero h1{font-size:40px;line-height:1.2;margin:7px 0 10px}.hero p{font-size:18px;line-height:1.6;color:#e1ebf8;margin:0}.clock{background:#ffffff14;border:1px solid #ffffff28;border-radius:20px;padding:20px;text-align:center}.clock span{font-size:13px;color:#d9e7fa}.clock strong{display:block;font-size:46px;font-variant-numeric:tabular-nums;margin:4px 0}.timeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.timeCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 18px;box-shadow:0 9px 28px #203d6810}.timeCard span{font-size:12px;color:var(--muted)}.timeCard strong{display:block;font-size:27px;color:var(--nav);font-variant-numeric:tabular-nums;margin-top:2px}.grid{display:grid;gap:14px;margin-top:15px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:21px;box-shadow:0 9px 28px #203d6810}.card h2{font-size:22px;margin:0 0 9px;color:var(--nav)}.card p{font-size:16px;line-height:1.65}.mission b{display:block;font-size:19px;color:var(--nav);margin-bottom:7px}.mission span{color:var(--muted);line-height:1.55}.notice{border-left:5px solid var(--blue);background:#eff5ff;border-radius:15px;padding:14px 18px;font-size:17px;line-height:1.55}.notice.good{border-color:var(--green);background:#eef9f3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:28px;color:var(--nav)}.stages{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}.stage{background:#f7f9fc;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.stage b{display:block;font-size:22px}.stage small{font-size:11px;color:var(--muted)}.announcement{background:#fff3cf;border:1px solid #e8c56e;border-radius:17px;padding:16px 20px;font-size:19px;margin-top:14px}.activeHint{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}@media(max-width:900px){.page{width:min(100% - 24px,1500px);padding:14px 0}.classTabs{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:1fr;padding:24px}.hero h1{font-size:30px}.grid4,.grid3,.stats,.timeGrid{grid-template-columns:1fr}.stages{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="page"><div class="top"><div class="brand">🏛️ 인권도시 정책결정 수행평가</div><div class="version">CLASSROOM · v12.0</div></div><div id="tabs"></div><div id="content"></div><div class="footer">이 화면에는 학생 개인의 이름과 개인별 진행 단계가 표시되지 않습니다.</div></main>
<script>
const content=document.getElementById('content'),tabs=document.getElementById('tabs'),ST=['브리핑','자료 탐색','정책 설계','정책 근거','정책 영향','새 정보','최종 정책','보고서'];let data=null,selectedClass=Number(new URLSearchParams(location.search).get('class')||0),manualClass=selectedClass>0;const sec=s=>{s=Math.max(0,Number(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
async function load(){try{let q=selectedClass?('?class_no='+selectedClass):'',r=await fetch('/api/classroom/public'+q,{cache:'no-store'});data=await r.json();if(!manualClass&&data.active_class_no)selectedClass=Number(data.active_class_no);else if(!selectedClass)selectedClass=Number(data.selected_class_no||1);if(Number(data.selected_class_no)!==selectedClass){r=await fetch('/api/classroom/public?class_no='+selectedClass,{cache:'no-store'});data=await r.json()}render()}catch{content.innerHTML='<div class="card"><h2>서버 연결을 확인하고 있습니다.</h2></div>'}}
function chooseClass(n){selectedClass=Number(n);manualClass=true;history.replaceState(null,'','?class='+selectedClass);load()}
function renderTabs(){let active=Number(data?.active_class_no||0);tabs.innerHTML=`<div class="classTabs">${[1,2,3,4,5,6,7].map(n=>`<button class="classTab ${selectedClass===n?'on':''} ${active===n?'active':''}" onclick="chooseClass(${n})">${n}반${active===n?'<small>현재 운영</small>':'<small>시간 기록</small>'}</button>`).join('')}</div>${active&&active!==selectedClass?`<div class="activeHint">현재 수행평가는 <b>${active}반</b>에서 운영 중입니다. 지금은 ${selectedClass}반 기록을 보고 있습니다.</div>`:''}`}
function periodLabel(v){return v==='1'?'1차시':v==='2'?'2차시':v==='makeup'?'보충 수행':'수업 준비'}
function methodCard(main){return `<section class="card"><h2>수행 방법</h2><div class="notice"><b>${main}</b></div><p>학생 화면에서 순서대로 진행하며 작성 내용은 자동으로 저장됩니다. 막히는 부분이 있으면 <b>🙋 선생님 도움 요청</b>을 눌러주세요.</p></section>`}
function intro(period){if(period==='2')return `<section class="grid grid4"><div class="card mission"><b>① 지난 정책 다시 확인</b><span>1차시에 만든 정책과 근거를 짧게 다시 확인합니다.</span></div><div class="card mission"><b>② 정책의 영향 살펴보기</b><span>먼저 도움받는 시민과 상대적으로 기다리는 시민, 정책의 한계와 보완을 생각합니다.</span></div><div class="card mission"><b>③ 새 정보로 재판단</b><span>복지센터 수요와 대학병원 설치비 변화가 기존 판단에 어떤 영향을 주는지 검토합니다.</span></div><div class="card mission"><b>④ 최종 정책·제출</b><span>정책을 유지하거나 바꾼 이유를 설명하고 최종 제출합니다.</span></div></section>${methodCard('2차시는 지난 판단을 다시 검토하는 시간입니다. 정책을 바꾸는 것 자체가 정답은 아닙니다.')}`;if(period==='makeup')return `<section class="grid grid3"><div class="card mission"><b>① 저장된 지점에서 이어하기</b><span>이전에 작성한 내용과 선택은 그대로 남아 있습니다.</span></div><div class="card mission"><b>② 남은 단계 마무리</b><span>자료와 내 정책 보드를 다시 확인하면서 남은 판단을 완성합니다.</span></div><div class="card mission"><b>③ 저장 후 최종 제출</b><span>최종 제출 전에 임시저장 상태를 확인합니다.</span></div></section>${methodCard('보충 수행은 새로 시작하는 활동이 아니라 기존 진행상황을 이어서 마무리하는 시간입니다.')}`;return `<section class="grid grid4"><div class="card mission"><b>① 자료 5개 확인</b><span>역 구조·이용 현황·주변 시설·시민 목소리·예산 자료를 살펴봅니다.</span></div><div class="card mission"><b>② 핵심 근거 저장</b><span>내 정책 판단에 실제로 사용할 근거를 3~5개 고릅니다.</span></div><div class="card mission"><b>③ 50억 정책 설계</b><span>예산 안에서 우선 설치역과 중요하게 볼 정책 기준을 정합니다.</span></div><div class="card mission"><b>④ 권리와 이유 연결</b><span>자료·정책 기준·권리를 연결해 첫 정책 판단을 설명합니다.</span></div></section>${methodCard('정답은 하나가 아닙니다. 어떤 역을 골랐는지보다 자료와 권리를 근거로 자신의 판단을 설명하는 것이 중요합니다.')}`}
function runningPanel(m,s){let goal=s.period_type==='1'?'권장 흐름: 자료 탐색 → 1차 정책 → 정책 근거·영향 진입':s.period_type==='2'?'권장 흐름: 정책 영향 마무리 → 새 정보 → 최종 정책 → 제출':'저장된 지점부터 남은 단계를 차례로 마무리';return `<section class="grid grid3"><div class="card"><h2>오늘의 권장 진행</h2><p>${goal}</p></div><div class="card"><h2>현재 접속</h2><div class="stats"><div class="stat"><span>접속</span><strong>${m.online||0}</strong></div><div class="stat"><span>전체</span><strong>${m.roster||0}</strong></div><div class="stat"><span>제출</span><strong>${m.submitted||0}</strong></div></div></div><div class="card"><h2>막히면 이렇게</h2><p>학생 화면의 <b>🙋 도움 요청</b>을 누르면 선생님 화면에 알림이 뜹니다.</p></div></section><section class="card"><h2>반 전체 진행 분포</h2><div class="stages">${(m.stage_counts||Array(8).fill(0)).map((n,i)=>`<div class="stage"><small>STEP ${i}</small><b>${n}</b><small>${ST[i]}</small></div>`).join('')}</div></section>`}
function render(){let s=data?.session||{},m=data?.summary||{},running=!!s.timer_running,open=!!s.is_open,period=periodLabel(s.period_type),active=Number(data?.active_class_no||0)===selectedClass;renderTabs();let title=!active?'반별 수행시간 기록':running?'수행평가 진행 중':s.auto_paused?'45분 활동이 자동 일시정지되었습니다.':s.phase==='waiting'?'학생 입장 대기 중':s.phase==='paused'?'수행 일시정지':'수행평가 준비 화면';let desc=!active?`${selectedClass}반의 저장된 수행시간과 진행기록입니다.`:running?'각자 자신의 속도로 진행하세요. 자료가 필요하면 다시 확인하고, 막히면 도움 요청을 사용할 수 있습니다.':open?'작성한 내용은 그대로 저장되어 있습니다. 선생님의 안내를 기다려 주세요.':'새봄시 시장이 되어 제한된 예산으로 지하철 엘리베이터 우선 설치 정책을 결정합니다.';content.innerHTML=`<section class="hero"><div><div class="kicker">${selectedClass}반 · ${period}</div><h1>${title}</h1><p>${desc}</p></div><div class="clock"><span>${active?'이번 차시 실제 수행시간':'선택한 차시 기록'}</span><strong>${sec(s.elapsed_seconds||0)}</strong><span>${running?'수행시간 진행 중':active&&open?'시간 정지 중':'저장된 기록'}</span></div></section><section class="timeGrid"><div class="timeCard"><span>1차시 실제 수행시간</span><strong>${sec(s.period1_seconds||0)}</strong></div><div class="timeCard"><span>2차시 실제 수행시간</span><strong>${sec(s.period2_seconds||0)}</strong></div><div class="timeCard"><span>정규 수행 누적시간</span><strong>${sec(s.total_regular_seconds||0)}</strong></div></section>${s.announcement?.text?`<div class="announcement">📢 <b>선생님 안내</b> · ${escapeHtml(s.announcement.text)}</div>`:''}${running?runningPanel(m,s):intro(s.period_type)}${s.extra_window_open&&!running?`<div class="notice good" style="margin-top:14px"><b>⏱️ 학생 자율 마무리시간이 열려 있습니다.</b> 조금만 더 하면 끝나는 학생은 자신의 화면에서 ${Number(s.extra_minutes||5)}분 추가 개방시간을 직접 사용할 수 있습니다.</div>`:''}`}
function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
load();setInterval(load,2500);
</script></body></html>
