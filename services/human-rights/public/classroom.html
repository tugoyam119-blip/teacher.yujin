<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인권도시 정책결정 수행평가 · 교실 화면</title>
<style>*{box-sizing:border-box}:root{--nav:#10233f;--blue:#2c68c5;--bg:#edf2f8;--line:#d8e1ec;--green:#187a4b;--orange:#a96816;--muted:#617086}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#172033;min-height:100vh}.page{width:min(1500px,calc(100% - 48px));margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:20px;font-weight:950;color:var(--nav)}.version{font-size:12px;color:var(--muted)}.hero{margin-top:18px;border-radius:28px;padding:34px 38px;background:linear-gradient(135deg,#10233f,#23558e);color:#fff;display:grid;grid-template-columns:1.5fr .65fr;gap:24px;align-items:center;box-shadow:0 16px 40px #19365c22}.kicker{font-size:14px;letter-spacing:.08em;font-weight:900;color:#cfe1ff}.hero h1{font-size:42px;line-height:1.2;margin:7px 0 10px}.hero p{font-size:19px;line-height:1.6;color:#e1ebf8;margin:0}.clock{background:#ffffff14;border:1px solid #ffffff28;border-radius:20px;padding:20px;text-align:center}.clock span{font-size:13px;color:#d9e7fa}.clock strong{display:block;font-size:48px;font-variant-numeric:tabular-nums;margin:4px 0}.grid{display:grid;gap:14px;margin-top:15px}.grid3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 9px 28px #203d6810}.card h2{font-size:23px;margin:0 0 9px;color:var(--nav)}.card p,.card li{font-size:17px;line-height:1.65}.mission b{display:block;font-size:21px;color:var(--nav);margin-bottom:7px}.mission span{color:var(--muted);line-height:1.5}.notice{border-left:5px solid var(--blue);background:#eff5ff;border-radius:15px;padding:15px 18px;font-size:18px;line-height:1.55}.notice.pause{border-color:var(--orange);background:#fff7e8}.notice.good{border-color:var(--green);background:#eef9f3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:30px;color:var(--nav)}.stages{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}.stage{background:#f7f9fc;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.stage b{display:block;font-size:22px}.stage small{font-size:11px;color:var(--muted)}.announcement{background:#fff3cf;border:1px solid #e8c56e;border-radius:17px;padding:16px 20px;font-size:19px;margin-top:14px}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}@media(max-width:900px){.page{width:min(100% - 24px,1500px);padding:14px 0}.hero{grid-template-columns:1fr;padding:25px}.hero h1{font-size:32px}.grid3,.stats{grid-template-columns:1fr}.stages{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="page"><div class="top"><div class="brand">🏛️ 인권도시 정책결정 수행평가</div><div class="version">CLASSROOM · v11.5</div></div><div id="content"></div><div class="footer">이 화면에는 학생 개인의 이름과 진행 단계가 표시되지 않습니다.</div></main>
<script>
const c=document.getElementById('content'),ST=['브리핑','자료 탐색','정책 설계','정책 근거','정책 영향','새 정보','최종 정책','보고서'];let data=null;const sec=s=>{s=Math.max(0,Number(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
async function load(){try{let r=await fetch('/api/classroom/public',{cache:'no-store'});data=await r.json();render()}catch{c.innerHTML='<div class="card"><h2>서버 연결을 확인하고 있습니다.</h2></div>'}}
function intro(){return `<section class="grid grid3"><div class="card mission"><b>① 자료에서 근거 찾기</b><span>5개 자료를 살펴보고 정책 판단에 사용할 핵심 근거를 고릅니다.</span></div><div class="card mission"><b>② 50억 정책 결정하기</b><span>시민·권리·예산을 고려해 우선 설치역과 정책 기준을 정합니다.</span></div><div class="card mission"><b>③ 새 정보로 다시 판단하기</b><span>정책의 영향과 새로운 상황을 검토해 최종안을 결정합니다.</span></div></section><section class="card"><h2>수행 방법</h2><div class="notice"><b>정답은 하나가 아닙니다.</b> 어떤 역을 선택했는지보다, 자료와 권리를 근거로 자신의 판단을 설명하는 것이 중요합니다.</div><p>학생 화면에서 순서대로 진행하며 작성 내용은 자동으로 저장됩니다. 막히는 부분이 있으면 <b>🙋 선생님 도움 요청</b>을 눌러주세요.</p></section>`}
function render(){let s=data?.session||{},m=data?.summary||{},running=!!s.timer_running,open=!!s.is_open,period=s.period_type==='1'?'1차시':s.period_type==='2'?'2차시':s.period_type==='makeup'?'보충 수행':'수업 준비';let title=!open?'수행평가 준비 화면':running?'수행평가 진행 중':s.auto_paused?'45분 활동이 자동 일시정지되었습니다.':s.phase==='waiting'?'학생 입장 대기 중':'수행 일시정지';let desc=!open?'새봄시 시장이 되어 제한된 예산으로 지하철 엘리베이터 우선 설치 정책을 결정합니다.':running?'각자 자신의 속도로 진행하세요. 자료가 필요하면 다시 확인하고, 막히면 도움 요청을 사용할 수 있습니다.':'작성한 내용은 그대로 저장되어 있습니다. 선생님의 안내를 기다려 주세요.';c.innerHTML=`<section class="hero"><div><div class="kicker">${s.class_no?`${s.class_no}반 · `:''}${period}</div><h1>${title}</h1><p>${desc}</p></div><div class="clock"><span>이번 차시 실제 수행시간</span><strong>${sec(s.elapsed_seconds||0)}</strong><span>${running?'수행시간 진행 중':open?'시간 정지 중':'아직 시작 전'}</span></div></section>${s.announcement?.text?`<div class="announcement">📢 <b>선생님 안내</b> · ${escapeHtml(s.announcement.text)}</div>`:''}${!running?intro():runningPanel(m,s)}${s.extra_window_open&&!running?`<div class="notice good" style="margin-top:14px"><b>⏱️ 학생 자율 마무리시간이 열려 있습니다.</b> 조금만 더 하면 끝나는 학생은 자신의 화면에서 ${Number(s.extra_minutes||5)}분 추가 개방시간을 직접 사용할 수 있습니다.</div>`:''}`}
function runningPanel(m,s){let goal=s.period_type==='1'?'권장 흐름: 자료 탐색 → 1차 정책 → 정책 근거·영향 진입':'권장 흐름: 정책 영향 마무리 → 새 정보 → 최종 정책 → 제출';return `<section class="grid grid3"><div class="card"><h2>오늘의 권장 진행</h2><p>${goal}</p></div><div class="card"><h2>현재 접속</h2><div class="stats"><div class="stat"><span>접속</span><strong>${m.online||0}</strong></div><div class="stat"><span>전체</span><strong>${m.roster||0}</strong></div><div class="stat"><span>제출</span><strong>${m.submitted||0}</strong></div></div></div><div class="card"><h2>막히면 이렇게</h2><p>학생 화면의 <b>🙋 도움 요청</b>을 누르면 선생님 화면에 알림이 뜹니다.</p></div></section><section class="card"><h2>반 전체 진행 분포</h2><div class="stages">${(m.stage_counts||Array(8).fill(0)).map((n,i)=>`<div class="stage"><small>STEP ${i}</small><b>${n}</b><small>${ST[i]}</small></div>`).join('')}</div></section>`}
function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
load();setInterval(load,2500);
</script></body></html>
