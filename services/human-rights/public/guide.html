7dee8;padding-top:12px;margin-top:12px}.completeGrid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.completeGrid label{font-size:12px;font-weight:850;color:#495a70}.completeGrid input{width:100%;margin-top:4px;border:1px solid #cad4e1;border-radius:10px;padding:10px;font:inherit}.completeBtn{border:0;border-radius:10px;padding:11px 13px;background:#157a4a;color:#fff;font-weight:900;cursor:pointer;min-height:42px}.completeBtn:disabled{opacity:.4;cursor:not-allowed}.completeMsg{font-size:12px;font-weight:800;margin-top:8px;min-height:18px}.guideNotice{background:#fff7df;border:1px solid #f0d48b;border-radius:14px;padding:12px 14px;line-height:1.6;font-size:13px;margin:10px 0 14px}.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 16px}.flow div{background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:10px 7px;text-align:center;font-size:11px}.flow b{display:block;font-size:15px;color:#17345f;margin-bottom:4px}.gcard{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 8px 22px #17345f0d}.gcard.done{border-color:#9fcfb2}.gcard h2{margin:0 0 6px;font-size:20px;color:#17345f}.gcard .lead{margin:0 0 12px;color:#55657a;line-height:1.65}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border-radius:13px;padding:12px;line-height:1.6;font-size:13px}.box.blue{background:#eef5ff;border:1px solid #cfe0f6}.box.green{background:#f1faf5;border:1px solid #c6e6d3}.box.pink{background:#fff3f2;border:1px solid #f2cfcc}.box.gray{background:#f7f8fa;border:1px solid #e2e5ea}.box b{color:#17345f}.example{border-left:4px solid #6b5fb5;background:#f7f4ff;border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.65;font-size:13px}.quiz{margin-top:12px;border-top:1px dashed #d7dee8;padding-top:12px}.quiz p{margin:0 0 8px;font-weight:850}.quizBtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.quizBtns.choices{grid-template-columns:1fr}.quiz button{border:1px solid #cad4e1;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:850;text-align:left}.quiz button:hover{background:#f7faff}.quizFeedback{margin-top:8px;font-size:12px;font-weight:800;min-height:18px}.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check{border:1px solid #dfe6ef;border-radius:11px;padding:10px;background:#fbfcfe;font-size:13px}.teacherHint{background:#eef5ff;border:1px solid #cfe0f6;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.6}.guideFoot{text-align:center;color:#68778b;font-size:12px;padding:18px 0}.guideSlideMode .guideShell{width:min(1180px,calc(100% - 32px))}.guideSlideMode .guideHero{padding:30px}.guideSlideMode .guideHero h1{font-size:42px}.guideSlideMode .prep,.guideSlideMode .guideNotice{display:none}.guideSlideMode .gcard{display:none;min-height:62vh;padding:32px}.guideSlideMode .gcard.slideOn{display:block}.guideSlideMode .gcard h2{font-size:34px}.guideSlideMode .gcard .lead,.guideSlideMode .box,.guideSlideMode .example,.guideSlideMode .quiz{font-size:20px}.slideNav{display:none}.guideSlideMode .slideNav{display:flex;position:sticky;bottom:12px;justify-content:center;gap:8px;z-index:6}.slideNav button{border:0;border-radius:12px;background:#17345f;color:#fff;padding:12px 18px;font-weight:900;cursor:pointer}.slideCounter{background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:11px 14px;font-weight:900}

<body><div id="guideMount"></div>
<script>
(function(){
const VERSION='v11.9';
const cards=[
{title:'1. 전체 흐름부터 익히기',lead:'이 수행평가는 하나의 정답을 맞히는 시험이 아니라, 자료를 보고 정책을 결정하고 그 이유를 설명하는 과정입니다.',body:`<div class="flow"><div><b>자료</b>정보 확인</div><div><b>설계</b>무엇을 할지</div><div><b>근거</b>왜 그렇게</div><div><b>영향</b>누가 더/덜</div><div><b>새 정보</b>무엇이 변했나</div><div><b>재판단</b>유지·변경</div><div><b>보고서</b>최종 확인</div></div><div class="box blue"><b>기억할 문장</b><br>“자료 → 판단 → 이유 → 영향 → 새 정보 → 다시 판단”의 순서로 생각하면 됩니다.</div>`,q:'처음부터 ‘정답 정책’을 찾아야 한다.',ans:'X',ex:'정답 정책 하나를 찾는 것이 아니라, 자료와 인권을 근거로 자신의 판단 과정을 설명하는 것이 핵심입니다.'},
{title:'2. 자료는 ‘요약’보다 ‘판단에 사용’하기',lead:'자료를 읽었다는 사실보다, 그 자료가 내 정책 결정에 어떤 의미가 있는지 연결하는 것이 중요합니다.',body:`<div class="two"><div class="box gray"><b>단순 요약</b><br>“A지역 이용자가 많다.”</div><div class="box green"><b>판단에 사용</b><br>“A지역 이용자가 많기 때문에 많은 학생이 이용한다는 기준에서 우선 검토할 수 있다.”</div></div><div class="example"><b>연습용 예시</b> · 학교 쉼터 설치 문제에서 “운동장 이용 학생이 가장 많다”는 자료를 봤다면, 숫자를 옮겨 쓰기보다 ‘이용자 수가 많다는 기준에서 운동장 근처를 우선할 근거가 된다’처럼 연결합니다.</div>`,q:'자료는 내용을 그대로 옮겨 쓰기만 하면 충분하다.',ans:'X',ex:'자료가 내 판단에 왜 중요한지를 연결해야 합니다.'},
{title:'3. 정책 설계와 정책 근거 구분하기',lead:'두 단계는 서로 이어지지만 역할이 다릅니다.',body:`<div class="two"><div class="box blue"><b>정책 설계 = 무엇을 할 것인가?</b><br>예산 안에서 어떤 선택을 하고 어떤 기준을 우선할지 결정합니다.</div><div class="box green"><b>정책 근거 = 왜 그렇게 했는가?</b><br>자료·정책 기준·인권을 연결해 이유를 설명합니다.</div></div><div class="example"><b>학교 쉼터 예시</b><br>설계: “도서관 앞과 운동장 앞에 설치한다.”<br>근거: “쉬는 시간 이용 학생이 많고, 휴식 공간 접근을 고르게 보장할 필요가 있기 때문이다.”</div>`,q:'“어디에 설치할지 정한다”는 정책 근거 단계이다.',ans:'X',ex:'무엇을 할지 정하는 것은 정책 설계이고, 왜 그렇게 정했는지를 설명하는 것이 정책 근거입니다.'},
{title:'4. TRADE-OFF는 ‘피해자 찾기’가 아닙니다',lead:'예산과 자원이 제한되어 있으면 한 정책이 모든 사람에게 같은 정도의 혜택을 주기 어렵습니다.',body:`<div class="two"><div class="box green"><b>더 큰 혜택을 받는 집단</b><br>내 정책 때문에 문제 해결 효과를 상대적으로 크게 얻는 사람들</div><div class="box pink"><b>상대적으로 뒤로 간 집단</b><br>직접 피해를 받는 사람이 아니라, 이번 정책에서 혜택이 덜하거나 우선순위가 뒤로 간 사람들</div></div>`,q:'후순위 집단은 반드시 정책 때문에 직접 피해를 입은 사람이어야 한다.',ans:'X',ex:'직접 피해가 없어도, 상대적으로 혜택이 덜하거나 우선순위에서 뒤로 간 집단이면 됩니다.'},
{title:'5. TRADE-OFF 미니 상황판단',lead:'설명을 읽는 것에서 끝내지 말고, 실제로 두 집단을 비교해 봅니다.',body:`<div class="example"><b>상황</b> · 학교가 한정된 예산으로 운동장과 도서관 앞에 쉼터를 먼저 설치했습니다. 급식실 앞은 이번 사업에서 제외됐습니다. 급식실 이용 학생에게 새로운 피해가 생긴 것은 아니지만, 이번 예산에서는 쉼터 혜택을 바로 받지 못합니다.</div>`,type:'choice',q:'이 상황에서 ‘상대적으로 우선순위가 뒤로 간 집단’으로 가장 적절한 것은?',options:[['A','운동장을 자주 쓰는 학생'],['B','도서관을 자주 쓰는 학생'],['C','급식실 앞 쉼터를 이용하고 싶었던 학생'],['D','학교 밖 지역 주민']],ans:'C',ex:'급식실 쪽 학생은 직접 피해자가 아니어도 이번 정책에서 상대적으로 혜택이 뒤로 미뤄진 집단으로 볼 수 있습니다.'},
{title:'6. 한계와 보완은 서로 연결하기',lead:'좋은 정책이라고 생각해도 약점은 생길 수 있습니다. 그 약점을 인정하고 줄이는 방법까지 제안합니다.',body:`<div class="two"><div class="box pink"><b>한계</b><br>내 정책으로 아직 해결되지 않은 문제는 무엇인가?</div><div class="box green"><b>보완</b><br>그 한계를 줄이기 위해 다음에 무엇을 할 수 있는가?</div></div><div class="example"><b>연결 방식</b><br>“이번에 급식실 쪽은 설치하지 못해 휴식 공간 접근이 상대적으로 부족할 수 있다. 따라서 다음 예산에서 급식실 인근을 우선 검토한다.”</div>`,q:'한계와 상관없는 보완책을 하나 적어도 된다.',ans:'X',ex:'보완책은 내가 지적한 한계를 실제로 줄일 수 있도록 연결되어야 합니다.'},
{title:'7. 새 정보가 나오면 ‘다시 생각’하기',lead:'새로운 정보는 기존 답을 틀렸다고 선언하는 신호가 아닙니다. 기존 판단을 다시 검토할 자료가 하나 더 생긴 것입니다.',body:`<div class="two"><div class="box blue"><b>변경할 수도 있음</b><br>새 정보가 중요해서 기존 기준이나 우선순위가 달라졌다면 수정합니다.</div><div class="box green"><b>유지할 수도 있음</b><br>새 정보를 검토해도 기존 판단의 근거가 더 중요하다고 보면 그대로 유지할 수 있습니다.</div></div><div class="example"><b>핵심 질문</b> · “무엇이 바뀌었나?” → “그 변화가 내 정책에 얼마나 중요한가?” → “그래서 유지할까, 일부 바꿀까, 크게 바꿀까?”</div>`,q:'새 정보가 제시되면 정책을 반드시 변경해야 한다.',ans:'X',ex:'새 정보의 중요도를 판단한 뒤 유지·일부 변경·큰 변경 모두 가능합니다.'},
{title:'8. 서술 구조 미니 연습',lead:'생각은 있는데 문장으로 연결하기 어려울 때 사용할 수 있는 기본 논리 순서를 연습합니다.',body:`<div class="box blue"><b>기본 구조</b><br>내 판단 → 판단을 뒷받침하는 자료 → 적용한 기준·권리 → 그래서 내 결론</div><div class="example"><b>주의</b> · 실제 수행평가 문장을 외우는 것이 아니라, 서로 다른 요소를 한 논리로 연결하는 순서만 익히는 연습입니다.</div>`,type:'choice',q:'다음 중 가장 논리적인 설명 순서는?',options:[['A','결론 → 아무 자료 → 다른 주제 → 결론 반복'],['B','내 판단 → 관련 자료 → 기준·권리와 연결 → 결론'],['C','자료 복사 → 자료 복사 → 자료 복사'],['D','권리 이름만 쓰기 → 글자 수 채우기']],ans:'B',ex:'자료를 나열하는 것보다 내 판단과 관련 자료, 기준·권리를 연결해 결론으로 이어가는 구조가 적절합니다.'},
{title:'9. 좋은 답안은 ‘길이’보다 연결이 중요합니다',lead:'글자 수를 채우기 위해 문장을 늘리기보다, 판단의 이유가 앞뒤로 이어지는지 확인하세요.',body:`<div class="checklist"><div class="check">✅ 자료를 실제 판단 근거로 사용했나?</div><div class="check">✅ 정책 기준과 인권이 이유에 연결됐나?</div><div class="check">✅ 수혜 집단과 상대적 후순위 집단을 비교했나?</div><div class="check">✅ 한계와 보완책이 서로 이어지나?</div><div class="check">✅ 새 정보가 최종 판단에 어떻게 영향을 줬는지 적었나?</div><div class="check">✅ 최종 선택과 설명이 서로 모순되지 않나?</div></div><div class="box gray" style="margin-top:10px"><b>주의</b> · 이 페이지는 실제 역, 실제 자료, 실제 정답 문장을 알려주지 않습니다. 수행평가에서는 자신의 판단을 직접 해야 합니다.</div>`,q:'좋은 답안은 무조건 가장 긴 답안이다.',ans:'X',ex:'분량 기준은 지켜야 하지만, 핵심은 자료·기준·인권·영향·재판단이 논리적으로 연결되는지입니다.'},
{title:'10. 수행평가 당일 사용법',lead:'생각한 내용을 잃지 않도록 저장과 제출 절차도 미리 익혀두세요.',body:`<div class="checklist"><div class="check">💾 자동저장이 되더라도 중요한 지점에서는 임시저장 상태를 확인합니다.</div><div class="check">🙋 막히면 도움 요청을 사용할 수 있습니다. 교사는 개념·사용법을 설명하지만 답을 대신 정해주지는 않습니다.</div><div class="check">⏱️ 45분은 차시 운영 기준이며, 저장된 답안은 다음 차시에 이어집니다.</div><div class="check">❓ 수행 중에는 ‘개념 도움’을 눌러 현재 단계의 짧은 일반 설명만 다시 확인할 수 있습니다.</div><div class="check">🔒 최종 제출 후에는 답안을 수정할 수 없으므로 보고서를 한 번 더 확인합니다.</div></div><div class="teacherHint"><b>수행 직전 30초 체크</b><br>① 자료와 판단 연결 ② 수혜/후순위 비교 ③ 한계/보완 연결 ④ 새 정보 재검토 ⑤ 마지막 임시저장 후 제출</div>`,q:'최종 제출 후에도 답안을 다시 수정할 수 있다.',ans:'X',ex:'최종 제출 뒤에는 수정할 수 없습니다. 제출 전에 전체 보고서와 저장 상태를 확인해야 합니다.'}
];
let slide=0;let correct={};try{correct=JSON.parse(localStorage.getItem('HR119_GUIDE_CORRECT')||'{}')||{}}catch{correct={}}
function saveCorrect(){try{localStorage.setItem('HR119_GUIDE_CORRECT',JSON.stringify(correct))}catch{}}
function countCorrect(){return cards.reduce((n,_,i)=>n+(correct[i]?1:0),0)}
function quizHtml(i,c){if(c.type==='choice')return `<div class="quiz"><p>확인문제 · ${c.q}</p><div class="quizBtns choices">${c.options.map(x=>`<button onclick="guideQuiz(${i},'${x[0]}')"><b>${x[0]}.</b> ${x[1]}</button>`).join('')}</div><div id="qf${i}" class="quizFeedback">${correct[i]?'✅ 이전에 맞힌 문제입니다.':''}</div></div>`;return `<div class="quiz"><p>확인문제 · ${c.q}</p><div class="quizBtns"><button onclick="guideQuiz(${i},'O')">O</button><button onclick="guideQuiz(${i},'X')">X</button></div><div id="qf${i}" class="quizFeedback">${correct[i]?'✅ 이전에 맞힌 문제입니다.':''}</div></div>`}
function prepHtml(){let n=countCorrect(),pct=Math.round(n/cards.length*100),ready=n===cards.length;return `<section class="prep"><div class="prepHead"><div><h2>📘 사전 준비 확인</h2><div style="font-size:12px;color:#667085;margin-top:3px">확인문제를 맞히면 자동으로 기록됩니다. 점수에는 반영되지 않습니다.</div></div><div class="prepCount">${n} / ${cards.length} 완료</div></div><div class="prepBar"><i style="width:${pct}%"></i></div><div class="completeBox"><div class="completeGrid"><label>학번<input id="prepSid" inputmode="numeric" placeholder="예: 10101"></label><label>이름<input id="prepName" placeholder="예: 김민서"></label><button id="prepSave" class="completeBtn" onclick="saveGuideComplete()" ${ready?'':'disabled'}>${ready?'사전 안내 완료 저장':'확인문제 완료 후 저장'}</button></div><div id="prepMsg" class="completeMsg">${ready?'✅ 모든 확인문제를 완료했습니다. 학번과 이름을 입력해 준비 완료를 저장하세요.':'아직 '+(cards.length-n)+'개의 확인문제가 남았습니다.'}</div></div></section>`}
function render(){const teacher=location.hash==='#guide-teacher';let visits=Number(localStorage.getItem('HR119_GUIDE_VISITS')||0);if(!sessionStorage.getItem('HR119_GUIDE_VISIT_COUNTED')){visits++;localStorage.setItem('HR119_GUIDE_VISITS',String(visits));sessionStorage.setItem('HR119_GUIDE_VISIT_COUNTED','1')}const mode=teacher?'guideOverlay guideSlideMode':'guideOverlay';document.getElementById('guideMount').innerHTML=`<div class="${mode}"><main class="guideShell"><header class="guideTop"><div class="guideBrand"><div class="guideMark">YT</div><div><h2 class="guideTitle">수행평가 사전 튜토리얼</h2><p class="guideSub">점수에 반영되지 않는 연습·설명 페이지</p></div></div><div class="guideBtns"><a class="guideBtn ${teacher?'':'primary'}" href="/guide">학생 복습 모드</a><a class="guideBtn ${teacher?'primary':''}" href="#guide-teacher">교실 설명 모드</a><a class="guideBtn" href="/">수행평가 화면</a></div></header><section class="guideHero"><span style="font-size:12px;font-weight:900">${VERSION} 사전 안내</span><h1>무엇을 해야 하는지 알고 시작하면<br>정책 판단에 더 집중할 수 있습니다.</h1><p>실제 수행평가의 답이나 특정 선택을 알려주는 페이지가 아닙니다. 수행 순서와 사고 방법을 미리 익히는 튜토리얼입니다.</p><span class="visit">📖 이 기기에서 ${visits}번째 읽기</span></section>${teacher?'':prepHtml()}<div class="guideNotice">💡 <b>여러 번 읽어도 됩니다.</b> 확인문제는 연습용이며 수행평가 점수에 전혀 반영되지 않습니다. 실제 평가 전에 익숙하지 않은 부분만 다시 찾아 읽어도 좋습니다.</div>${cards.map((c,i)=>`<section class="gcard ${correct[i]?'done':''} ${teacher&&i===slide?'slideOn':''}" data-slide="${i}"><h2>${c.title}</h2><p class="lead">${c.lead}</p>${c.body}${quizHtml(i,c)}</section>`).join('')}<div class="slideNav"><button onclick="guidePrev()">← 이전</button><span class="slideCounter">${slide+1} / ${cards.length}</span><button onclick="guideNext()">다음 →</button></div><footer class="guideFoot">이 페이지의 예시는 실제 수행평가와 다른 ‘학교 쉼터’ 상황을 사용합니다.</footer></main></div>`}
window.guideQuiz=function(i,v){const c=cards[i],el=document.getElementById('qf'+i),ok=v===c.ans;if(ok){correct[i]=1;saveCorrect()}if(el){el.textContent=(ok?'✅ 맞았습니다. ':'❌ 다시 생각해보세요. ')+c.ex;el.style.color=ok?'#147a4a':'#b42318'}if(ok&&!location.hash.includes('guide-teacher'))setTimeout(render,350)}
window.saveGuideComplete=async function(){const sid=(document.getElementById('prepSid')?.value||'').trim(),name=(document.getElementById('prepName')?.value||'').trim(),msg=document.getElementById('prepMsg');if(countCorrect()!==cards.length){if(msg)msg.textContent='확인문제를 모두 완료한 뒤 저장할 수 있습니다.';return}if(!sid||!name){if(msg)msg.textContent='학번과 이름을 모두 입력해 주세요.';return}try{let r=await fetch('/api/guide-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,name,correct_count:cards.length,guide_version:VERSION})});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'저장하지 못했습니다.');if(msg){msg.textContent='✅ 사전 안내 완료가 저장되었습니다. 이제 수행평가 전에 필요한 부분을 자유롭게 다시 읽어도 됩니다.';msg.style.color='#147a4a'}try{localStorage.setItem('HR119_GUIDE_STUDENT',JSON.stringify({student_id:sid,name,completed_at:j.completed_at||''}))}catch{}}catch(e){if(msg){msg.textContent='❌ '+e.message;msg.style.color='#b42318'}}}
window.guidePrev=function(){slide=Math.max(0,slide-1);render();window.scrollTo({top:0,behavior:'smooth'})};window.guideNext=function(){slide=Math.min(cards.length-1,slide+1);render();window.scrollTo({top:0,behavior:'smooth'})};window.addEventListener('hashchange',()=>{slide=0;render()});window.addEventListener('keydown',e=>{if(location.hash!=='#guide-teacher')return;if(e.key==='ArrowRight'||e.key==='PageDown')guideNext();if(e.key==='ArrowLeft'||e.key==='PageUp')guidePrev();if(e.key==='Escape')location.href='/guide'});render();
})();
</script></body></html>
