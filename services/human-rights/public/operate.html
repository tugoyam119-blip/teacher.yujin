<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인권도시 수행평가 · 교실 운영실 v11.6</title>
<style>
*{box-sizing:border-box}:root{--nav:#10233f;--blue:#2d68c4;--bg:#f4f7fb;--line:#dce4ee;--muted:#657388;--green:#157a4a;--orange:#aa6515;--red:#b42318;--purple:#6650a4;--shadow:0 8px 26px #213b6412}html{background:var(--bg)}body{margin:0;background:var(--bg);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.shell{width:min(1380px,calc(100% - 24px));margin:auto;padding:14px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.mark{width:44px;height:44px;border-radius:13px;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:950}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;min-height:40px;background:var(--nav);color:#fff;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:var(--nav);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}.hero{background:linear-gradient(135deg,#10233f,#1e4b82);color:#fff;border-radius:21px;padding:20px 22px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.5fr .8fr;gap:14px;margin-bottom:12px}.hero h2{font-size:27px;margin:3px 0}.hero p{margin:0;color:#dce8f8}.clock{border:1px solid #ffffff2b;background:#ffffff12;border-radius:16px;padding:13px}.clock span{font-size:11px;color:#d6e5fa}.clock strong{font-size:28px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);margin-top:10px}.card h3{margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:9px}.grid6{grid-template-columns:repeat(6,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.stat{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px}.stat span{font-size:11px;color:var(--muted);display:block}.stat strong{font-size:24px;color:var(--nav);display:block}.stat.help strong{color:var(--orange)}.stat.bad strong{color:var(--red)}label{display:block;font-size:12px;font-weight:800}select,input{width:100%;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:9px 10px;margin-top:4px;font:inherit}.control{display:grid;grid-template-columns:150px 170px 1fr;gap:9px;align-items:end}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.b-wait{background:#fff4d8;color:#815300}.b-run{background:#e9f8ef;color:#16613e}.b-pause{background:#eef2f7;color:#4c5a6f}.b-extra{background:#fff0dc;color:#955000}.notice{border-left:4px solid var(--blue);background:#eef5ff;border-radius:11px;padding:10px 12px;font-size:13px}.notice.warn{border-color:var(--orange);background:#fff6e8}.notice.bad{border-color:var(--red);background:#fff1f0}.announce{display:grid;grid-template-columns:1fr auto;gap:8px}.stageGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.stage{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.stage b{display:block;font-size:20px}.stage small{font-size:10px;color:var(--muted)}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.filters{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;color:#40516a;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:850;cursor:pointer}.pill.on{background:var(--nav);color:#fff;border-color:var(--nav)}.students{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.student{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px;cursor:pointer;text-align:left}.student:hover{border-color:#a9bad1;background:#fafcff}.student .name{font-weight:900}.student .meta{font-size:11px;color:var(--muted);margin-top:4px}.student.help{border-color:#e3a647;background:#fffaf0}.student.stall{box-shadow:inset 4px 0 #d08423}.student.savebad{box-shadow:inset 4px 0 var(--red)}.student.done{opacity:.72}.helpStrip{display:grid;gap:7px}.helpItem{border:1px solid #edc27d;background:#fff9ed;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:9px}.overlay{position:fixed;inset:0;background:#10233f66;z-index:50}.drawer{position:fixed;z-index:51;right:0;top:0;bottom:0;width:min(520px,96vw);background:#fff;overflow:auto;padding:17px;box-shadow:-20px 0 45px #0002}.detail{border:1px solid var(--line);border-radius:12px;background:#fafcff;padding:10px;margin:8px 0}.detail b{color:var(--nav)}.login{max-width:520px;margin:60px auto}.login .card{padding:22px}.flash{animation:flash 1s ease 2}@keyframes flash{50%{box-shadow:0 0 0 5px #f3b44755}}.nextAction{border-left:5px solid var(--blue);background:#eef5ff;border-radius:14px;padding:12px 14px;margin-top:10px}.nextAction b{color:var(--nav)}.classTimeGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.classTimeBox{border:1px solid var(--line);border-radius:12px;background:#fbfcfe;padding:9px}.classTimeBox.on{outline:3px solid #cfe0fa}.classTimeBox b{display:block}.classTimeBox small{display:block;color:var(--muted);line-height:1.55;margin-top:3px}a{text-decoration:none}
@media(max-width:1050px){.grid6{grid-template-columns:repeat(3,1fr)}.students{grid-template-columns:repeat(3,1fr)}.stageGrid{grid-template-columns:repeat(4,1fr)}.classTimeGrid{grid-template-columns:repeat(4,1fr)}}@media(max-width:720px){.hero{grid-template-columns:1fr}.control,.grid4,.grid2{grid-template-columns:1fr}.grid6{grid-template-columns:repeat(2,1fr)}.students{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.stageGrid{grid-template-columns:repeat(2,1fr)}.announce{grid-template-columns:1fr}.classTimeGrid{grid-template-columns:repeat(2,1fr)}.shell{width:min(100% - 14px,1380px)}}
</style>
</head><body><div id="root"></div>
<script>
const VERSION='v11.6',root=document.getElementById('root');let pin='';try{pin=sessionStorage.getItem('HR115_OP_PIN')||sessionStorage.getItem('HR102_TPIN')||''}catch{}let data=null,timer=null,lastHelp=new Set(),filter='all';
const STAGES=['시장 브리핑','자료 탐색','정책 설계','정책 근거','정책 영향','새 정보','최종 정책','보고서'];
const HELP={understand:'📖 문제 뜻 이해',find:'🔎 자료 찾기',write:'✍️ 글 정리',tech:'⚙️ 화면·저장',other:'🙋 기타'};
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const sec=s=>{s=Math.max(0,Number(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
async function api(url,opt={}){const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);try{let r=await fetch(url,{headers:{'Content-Type':'application/json'},signal:c.signal,...opt}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}finally{clearTimeout(tm)}}
function login(msg=''){root.innerHTML=`<main class="shell login"><div class="brand"><div class="mark">YT</div><div><h1>교실 운영실</h1><p>CLASSROOM OPS · ${VERSION}</p></div></div><section class="card"><h2>수업 진행 전용 화면</h2><p class="muted">학생 입장·수행 시작/정지·도움 요청·진행상황을 수업 중 빠르게 확인합니다.</p><label>교사 PIN<input id="pin" type="password"></label><div style="height:9px"></div><button class="btn" onclick="auth()">교실 운영실 열기</button>${msg?`<div class="notice bad">${esc(msg)}</div>`:''}</section></main>`}
async function auth(){pin=document.getElementById('pin').value.trim();try{data=await api('/api/teacher/dashboard?pin='+encodeURIComponent(pin));sessionStorage.setItem('HR115_OP_PIN',pin);sessionStorage.setItem('HR102_TPIN',pin);render();startAuto()}catch(e){login(e.message)}}
async function load(){try{data=await api('/api/teacher/dashboard?pin='+encodeURIComponent(pin));return true}catch{return false}}
function phaseLabel(s){if(!s.is_open)return['b-pause','닫힘'];if(s.timer_running)return['b-run','🟢 수행 중'];if(s.auto_paused)return['b-pause','⏸ 45분 자동 일시정지'];if(s.phase==='waiting')return['b-wait','🟡 입장 대기'];return['b-pause','⏸ 일시정지']}
function visibleRows(){let c=Number(data.session?.class_no||0),rows=(data.students||[]).filter(r=>!c||Number(r.class_no)===c);if(filter==='online')rows=rows.filter(r=>r.online);if(filter==='help')rows=rows.filter(r=>r.help_request);if(filter==='alert')rows=rows.filter(r=>isStalled(r)||isSaveBad(r));if(filter==='submitted')rows=rows.filter(r=>r.submitted);return rows}
function isStalled(r){let s=data?.session||{};if(!s.timer_running||!r.online||r.submitted||!r.last_action_at)return false;return Date.now()-new Date(r.last_action_at).getTime()>7*60*1000}
function isSaveBad(r){return r.online&&!r.submitted&&['warn','bad'].includes(String(r.save_status||''))}
function counts(){let c=Number(data.session?.class_no||0),rows=(data.students||[]).filter(r=>!c||Number(r.class_no)===c);return{rows,online:rows.filter(r=>r.online).length,submitted:rows.filter(r=>r.submitted).length,help:rows.filter(r=>r.help_request).length,stall:rows.filter(isStalled).length,save:rows.filter(isSaveBad).length,extra:rows.filter(r=>r.time?.personal_extra_active).length}}
function beep(){try{let A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=720;g.gain.value=.05;o.start();o.stop(a.currentTime+.13)}catch{}}
function detectHelp(){let cur=new Set((data.students||[]).filter(x=>x.help_request).map(x=>x.student_id));for(let id of cur)if(!lastHelp.has(id))beep();lastHelp=cur}
function nextAction(s,c){let e=Number(s.elapsed_seconds||0),limit=Number(s.auto_pause_limit_seconds||2700),remain=Math.max(0,limit-e);if(!s.is_open)return '<b>다음 행동:</b> 수업할 반과 차시를 고른 뒤 <b>학생 입장 열기</b>를 누르세요. 입장만 열어서는 시간이 흐르지 않습니다.';if(s.timer_running)return remain<=60?`<b>다음 행동:</b> <b>${sec(remain)}</b> 뒤 자동 일시정지됩니다. 학생 질문을 정리하며 차시 마무리를 준비하세요.`:`<b>현재 수행 중:</b> 자동 일시정지까지 <b>${sec(remain)}</b> 남았습니다. 도움 요청과 진행 분포를 확인하세요.`;if(s.auto_paused)return '<b>다음 행동:</b> 45분이 끝났습니다. 차시를 마치거나, 필요한 경우 <b>5분 계속</b> 또는 <b>45분 더</b>를 선택하세요.';if(s.extra_window_open)return `<b>다음 행동:</b> 학생 자율 추가시간이 열려 있습니다. 현재 <b>${c.extra}명</b>이 사용 중입니다. 모두 마무리하면 차시를 종료하세요.`;if(s.phase==='waiting')return '<b>다음 행동:</b> 학생 접속과 활동 설명이 끝나면 <b>수행 시작</b>을 누르세요.';return '<b>다음 행동:</b> 안내 후 <b>수행 시작/재개</b>를 누르거나 차시를 종료하세요.'}
function classTimesPanel(s){let arr=s.class_times||[];return `<section class="card"><div class="sectionHead"><div><h3>⏱️ 반별 실제 수행시간</h3><p class="small muted">각 반의 1·2차시 시간은 서로 독립적으로 저장됩니다.</p></div><a class="btn secondary" href="/classroom" target="_blank">📺 공개화면에서 보기</a></div><div class="classTimeGrid">${arr.map(x=>`<div class="classTimeBox ${Number(s.class_no)===Number(x.class_no)?'on':''}"><b>${x.class_no}반</b><small>1차시 ${sec(x.period1_seconds)}<br>2차시 ${sec(x.period2_seconds)}<br><b>누적 ${sec(x.total_regular_seconds)}</b></small></div>`).join('')}</div></section>`}
function controls(s){let closed=!s.is_open;return `<section class="card"><div class="sectionHead"><div><h3>🎛️ 차시 운영</h3><div class="statusline"><span class="badge ${phaseLabel(s)[0]}">${phaseLabel(s)[1]}</span>${s.extra_window_open?'<span class="badge b-extra">학생 자율 추가시간 열림</span>':''}</div></div><a class="btn secondary" href="/classroom${s.class_no?'?class='+s.class_no:''}" target="_blank">📺 공개화면</a></div><div class="control"><label>수업 반<select id="cls" ${!closed?'disabled':''}><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option><option value="6">6반</option><option value="7">7반</option></select></label><label>차시<select id="period" ${!closed?'disabled':''}><option value="1">1차시</option><option value="2">2차시</option><option value="makeup">보충 수행</option></select></label><div class="row">${closed?'<button class="btn green" onclick="openAdmission()">🟡 학생 입장 열기</button>':s.timer_running?'<button class="btn orange" onclick="pauseRun()">⏸ 일시정지</button>':s.auto_paused?'<button class="btn green" onclick="startRun(300)">▶ 5분 계속</button><button class="btn secondary" onclick="startRun(2700)">▶ 45분 더</button>':'<button class="btn green" onclick="startRun(0)">▶ 수행 시작/재개</button>'}<button class="btn red" ${closed?'disabled':''} onclick="closeRun()">■ 차시 종료</button>${!closed&&!s.timer_running?'<button class="btn secondary" onclick="resetClassTime()">↺ 이번 차시 00:00</button>':''}</div></div>${!closed?`<div class="row" style="margin-top:10px"><button class="btn ${s.extra_window_open?'orange':'secondary'}" onclick="toggleExtra(${s.extra_window_open?'false':'true'})">⏱️ 학생 자율 ${Number(s.extra_minutes||5)}분 추가시간 ${s.extra_window_open?'닫기':'열기'}</button><span class="small muted">학생이 필요할 때 직접 1회 사용 · 사용시간 별도 기록</span></div>`:''}</section>`}
function render(){if(!data)return login();let s=data.session||{},c=counts(),pl=phaseLabel(s);root.innerHTML=`<main class="shell"><header class="top"><div class="brand"><div class="mark">YT</div><div><h1>인권도시 · 교실 운영실</h1><p>${VERSION} · 수업 진행 전용</p></div></div><div class="row"><a href="/teacher" target="_blank" class="btn secondary">⚙️ 서버 관리실</a><button class="btn secondary" onclick="logout()">로그아웃</button></div></header><section class="hero"><div><div class="small">${s.class_no?`${s.class_no}반 · `:''}${s.period_type==='1'?'1차시':s.period_type==='2'?'2차시':s.period_type==='makeup'?'보충 수행':'수업 미선택'}</div><h2>${pl[1]}</h2><p>${s.timer_running?'학생 수행시간이 진행 중입니다.':s.is_open?'학생은 접속할 수 있지만 수행시간은 흐르지 않습니다.':'반을 선택해 학생 입장을 먼저 열어주세요.'}</p></div><div class="clock"><span>이번 차시 실제 수행시간</span><strong>${sec(s.elapsed_seconds||0)}</strong><span>자동 일시정지 기준 ${sec(s.auto_pause_limit_seconds||2700)}</span></div></section><div class="nextAction">${nextAction(s,c)}</div>${controls(s)}<section class="grid grid6"><div class="stat"><span>현재 접속</span><strong>${c.online}</strong><small>/ ${c.rows.length}명</small></div><div class="stat"><span>제출 완료</span><strong>${c.submitted}</strong></div><div class="stat help"><span>도움 요청</span><strong>${c.help}</strong></div><div class="stat bad"><span>7분 활동 없음</span><strong>${c.stall}</strong></div><div class="stat bad"><span>저장 확인 필요</span><strong>${c.save}</strong></div><div class="stat"><span>자율 추가시간</span><strong>${c.extra}</strong></div></section>${helpPanel(c.rows)}${stagePanel(c.rows)}${classTimesPanel(s)}${announcePanel(s)}${studentPanel(c.rows)}</main>`;let cl=document.getElementById('cls'),pd=document.getElementById('period');if(cl)cl.value=String(s.class_no||1);if(pd)pd.value=String(s.period_type||'1');detectHelp()}
function helpPanel(rows){let h=rows.filter(r=>r.help_request);if(!h.length)return'';return `<section class="card flash"><div class="sectionHead"><div><h3>🔔 도움 요청 ${h.length}명</h3><p class="small muted">요청 순서대로 확인할 수 있습니다.</p></div></div><div class="helpStrip">${h.sort((a,b)=>String(a.help_requested_at).localeCompare(String(b.help_requested_at))).map(r=>`<div class="helpItem"><div><b>${esc(r.student_id)} ${esc(r.name)}</b><div class="small">${HELP[r.help_category]||'🙋 도움 필요'} · ${ago(r.help_requested_at)}</div></div><div class="row"><button class="btn secondary" onclick="openStudent('${r.student_id}')">학생 보기</button><button class="btn green" onclick="resolveHelp('${r.student_id}')">확인 완료</button></div></div>`).join('')}</div></section>`}
function stagePanel(rows){let a=Array.from({length:8},(_,i)=>rows.filter(r=>r.ever_entered&&!r.submitted&&Number(r.step)===i).length);return `<section class="card"><h3>📍 현재 단계 분포</h3><p class="small muted">학생 개인 단계는 아래 목록에 표시하지 않습니다. 학생을 클릭하면 상세 단계가 보입니다.</p><div class="stageGrid">${a.map((n,i)=>`<div class="stage"><small>STEP ${i}</small><b>${n}</b><small>${STAGES[i]}</small></div>`).join('')}</div></section>`}
function announcePanel(s){return `<section class="card"><h3>📢 학생 전체 안내</h3><p class="small muted">보낸 안내는 학생 화면 상단에 잠시 표시됩니다.</p><div class="announce"><input id="ann" maxlength="200" placeholder="예: STEP 4에서는 정책의 한계와 보완 방법을 연결해서 생각하세요."><button class="btn" onclick="announce()">안내 보내기</button></div>${s.announcement?.text?`<p class="small muted">현재 안내: ${esc(s.announcement.text)}</p>`:''}</section>`}
function studentPanel(rows){let vr=visibleRows();return `<section class="card"><div class="sectionHead"><div><h3>👥 학생 상태</h3><p class="small muted">단계는 학생을 클릭하면 확인합니다.</p></div><div class="filters">${[['all','전체'],['online','접속'],['help','도움'],['alert','확인 필요'],['submitted','제출']].map(x=>`<button class="pill ${filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</div></div><div class="students">${vr.map(r=>`<button class="student ${r.help_request?'help':''} ${isStalled(r)?'stall':''} ${isSaveBad(r)?'savebad':''} ${r.submitted?'done':''}" onclick="openStudent('${r.student_id}')"><div class="name">${esc(r.student_id)} ${esc(r.name)}</div><div class="meta">${r.submitted?'✅ 제출 완료':r.help_request?'🙋 도움 요청':r.time?.personal_extra_active?'⏱️ 추가시간 사용 중':r.online?'🟢 활동 중':r.ever_entered?'⚪ 접속 끊김':'○ 미입장'}${isStalled(r)?' · ⚠️ 활동 없음':''}${isSaveBad(r)?' · 🔴 저장 확인':''}</div></button>`).join('')||'<div class="muted">표시할 학생이 없습니다.</div>'}</div></section>`}
function ago(t){if(!t)return'-';let s=Math.max(0,Math.round((Date.now()-new Date(t).getTime())/1000));return s<60?`${s}초 전`:`${Math.floor(s/60)}분 전`}
function openStudent(id){let r=(data.students||[]).find(x=>x.student_id===id);if(!r)return;let tm=r.time||{};document.body.insertAdjacentHTML('beforeend',`<div id="ov" class="overlay" onclick="closeStudent()"></div><aside id="drawer" class="drawer"><div class="sectionHead"><div><h2 style="margin:0">${esc(r.student_id)} ${esc(r.name)}</h2><p class="muted small">${r.online?'🟢 현재 접속':'⚪ 현재 미접속'}</p></div><button class="btn secondary" onclick="closeStudent()">닫기</button></div><div class="detail"><b>현재 단계</b><p><strong>STEP ${Number(r.step||0)} · ${STAGES[Number(r.step||0)]}</strong></p></div><div class="detail"><b>최근 활동</b><p>${ago(r.last_action_at)}${isStalled(r)?' · ⚠️ 7분 이상 변화 없음':''}</p></div><div class="detail"><b>저장 상태</b><p>${r.save_status==='bad'?'🔴 저장 실패':r.save_status==='warn'?'🟠 연결 확인 필요':'정상 또는 최근 경고 없음'}</p></div><div class="detail"><b>도움 요청</b><p>${r.help_request?(HELP[r.help_category]||'도움 필요')+' · '+ago(r.help_requested_at):'현재 요청 없음'}</p>${r.help_request?`<button class="btn green" onclick="resolveHelp('${r.student_id}')">도움 확인 완료</button>`:''}</div><div class="detail"><b>시간 기록</b><p>1차시 ${sec(tm.period1_used)} · 2차시 ${sec(tm.period2_used)}<br>추가시간 ${sec(tm.extra_seconds)}${tm.personal_extra_active?` · 현재 자율 추가시간 ${sec(tm.personal_extra_remaining_seconds)} 남음`:''}</p></div><div class="detail"><b>작성 진행</b><p>판단① ${(r.answer_lengths||[])[0]||0}자 · 판단② ${(r.answer_lengths||[])[1]||0}자 · 판단③ ${(r.answer_lengths||[])[2]||0}자</p></div></aside>`)}
function closeStudent(){document.getElementById('ov')?.remove();document.getElementById('drawer')?.remove()}
function setFilter(v){filter=v;render()}
async function openAdmission(){let class_no=Number(document.getElementById('cls').value),period_type=document.getElementById('period').value;try{await api('/api/teacher/classroom/open',{method:'POST',body:JSON.stringify({pin,class_no,period_type})});await refresh()}catch(e){alert(e.message)}}
async function startRun(ext=0){try{await api('/api/teacher/classroom/start',{method:'POST',body:JSON.stringify({pin,extend_seconds:ext})});await refresh()}catch(e){alert(e.message)}}
async function pauseRun(){try{await api('/api/teacher/classroom/pause',{method:'POST',body:JSON.stringify({pin})});await refresh()}catch(e){alert(e.message)}}
async function closeRun(){let active=counts().rows.filter(r=>r.time?.personal_extra_active);if(active.length){let names=active.slice(0,8).map(r=>`${r.student_id} ${r.name} (${sec(r.time?.personal_extra_remaining_seconds)} 남음)`).join('\n'),more=active.length>8?`\n외 ${active.length-8}명`:'';if(!confirm(`⚠️ 현재 추가시간 사용 중인 학생이 ${active.length}명 있습니다.\n\n${names}${more}\n\n그래도 차시를 종료할까요?`))return}else if(!confirm('현재 차시를 종료할까요? 학생 수행은 잠기고 기록은 유지됩니다.'))return;try{await api('/api/teacher/classroom/close',{method:'POST',body:JSON.stringify({pin})});await refresh()}catch(e){alert(e.message)}}
async function resetClassTime(){let s=data?.session||{};if(!s.is_open)return alert('먼저 해당 반과 차시의 학생 입장을 열어 주세요.');if(s.timer_running)return alert('수행 중에는 초기화할 수 없습니다. 먼저 일시정지해 주세요.');let label=s.period_type==='1'?'1차시':s.period_type==='2'?'2차시':'보충 수행';if(!confirm(`${s.class_no}반 ${label} 공개화면 시간을 00:00으로 초기화할까요?\n학생 답안·제출 기록은 지워지지 않습니다.`))return;try{await api('/api/teacher/classroom/time-reset',{method:'POST',body:JSON.stringify({pin,class_no:s.class_no,period_type:s.period_type})});await refresh()}catch(e){alert(e.message)}}
async function toggleExtra(enabled){try{await api('/api/teacher/classroom/extra-window',{method:'POST',body:JSON.stringify({pin,enabled,minutes:5,max_uses:1})});await refresh()}catch(e){alert(e.message)}}
async function announce(){let text=document.getElementById('ann').value.trim();if(!text)return;try{await api('/api/teacher/classroom/announce',{method:'POST',body:JSON.stringify({pin,text})});document.getElementById('ann').value='';await refresh()}catch(e){alert(e.message)}}
async function resolveHelp(id){try{await api('/api/teacher/help-resolve',{method:'POST',body:JSON.stringify({pin,student_id:id})});closeStudent();await refresh()}catch(e){alert(e.message)}}
async function refresh(){if(await load())render();else login('교사 인증을 다시 확인해 주세요.')}
function startAuto(){clearInterval(timer);timer=setInterval(refresh,3000)}
function logout(){clearInterval(timer);timer=null;pin='';sessionStorage.removeItem('HR115_OP_PIN');sessionStorage.removeItem('HR102_TPIN');login()}
(async()=>{if(!pin)return login();if(await load()){render();startAuto()}else login()})();
</script></body></html>
