<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기후국제회의 · 교실 진행 화면</title>
<style>:root{font-family:Pretendard,"Noto Sans KR",sans-serif;background:#eef5f0;color:#153628}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{margin:0}.head select{padding:11px 16px;border:1px solid #bfd3c6;border-radius:12px;background:white;font-size:16px}.hero{margin-top:22px;background:linear-gradient(135deg,#185c3b,#2d8056);color:white;border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:center}.hero h2{margin:0 0 8px;font-size:32px}.clock{text-align:right}.clock b{display:block;font-size:58px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}.stat,.stages{background:white;border:1px solid #d7e4dc;border-radius:18px;padding:18px}.stat span{display:block;color:#687a70}.stat b{font-size:34px}.stages{margin-top:18px}.stage-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:7px}.stage{text-align:center;background:#edf4ef;border-radius:10px;padding:10px 3px}.stage b{display:block;font-size:20px}.privacy{margin-top:16px;color:#687a70}@media(max-width:800px){.hero{align-items:flex-start;flex-direction:column}.clock{text-align:left}.stats{grid-template-columns:repeat(2,1fr)}.stage-grid{grid-template-columns:repeat(4,1fr)}}</style></head>
<body><main class="wrap"><header class="head"><div><h1>기후국제회의 수행평가</h1><div>개인정보 없는 교실 공개 진행 화면</div></div><select id="classNo"><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option><option value="6">6반</option><option value="7">7반</option></select></header>
<section class="hero"><div><h2 id="phase">입장 닫힘</h2><div id="mode">정규 수행</div></div><div class="clock"><span>남은 수행시간</span><b id="clock">90:00</b><span id="elapsed">경과 00:00</span></div></section>
<section class="stats"><div class="stat"><span>현재 접속</span><b id="online">0</b></div><div class="stat"><span>접속한 적 있음</span><b id="entered">0</b></div><div class="stat"><span>미접속</span><b id="never">0</b></div><div class="stat"><span>제출 완료</span><b id="submitted">0</b></div><div class="stat"><span>전체 대상</span><b id="total">0</b></div></section>
<section class="stages"><h3>단계별 진행 인원</h3><div id="stages" class="stage-grid"></div></section><p class="privacy">이 화면에는 학생 이름과 학번을 표시하지 않습니다.</p></main>
<script>const $=s=>document.querySelector(s),labels={closed:'입장 닫힘',ready:'입장완료·대기',running:'수행 중',paused:'일시정지',auto_paused:'40분 자동 일시정지',finished:'40분 종료'};function clock(v){v=Math.max(0,Math.floor(Number(v||0)));return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}async function load(){const r=await fetch('/api/classroom/public?classNo='+$('#classNo').value,{cache:'no-store'}),j=await r.json(),rt=j.runtime||{},s=j.summary||{};$('#phase').textContent=labels[rt.phase]||rt.phase;$('#mode').textContent=rt.mode==='makeup'?'결석·보충':'정규 수행';$('#clock').textContent=clock(rt.remainingSeconds);$('#elapsed').textContent='경과 '+clock(rt.elapsedSeconds);for(const k of ['online','entered','never','submitted','total'])$('#'+k).textContent=s[k]||0;$('#stages').innerHTML=(j.stageCounts||[]).map((n,i)=>`<div class="stage"><span>STEP ${i}</span><b>${n}</b></div>`).join('')}$('#classNo').onchange=load;load();setInterval(load,5000);</script></body></html>
