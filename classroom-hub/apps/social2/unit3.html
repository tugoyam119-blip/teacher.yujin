<script>
const generalTerms=new Set(window.unit3GeneralTerms||[]);
const termClass=n=>generalTerms.has(n)?'term general-term':'term';
const T=n=>`<button class="${termClass(n)}" data-term="${n}">${n}</button>`;
function guideHtml(s){const plan=window.unit3GuidePlan?.[s.title];if(!plan)return '';const main=plan.main?`<p class="main-support"><b>사례로 연결</b>${plan.main}</p>`:'',focus=plan.focus||[];if(!focus.length)return main;return main+`<section class="focus-stack" aria-label="강조 설명">${focus.map(item=>`<div class="focus-card"><b>${item[0]}</b><p>${item[1]}</p></div>`).join('')}</section>`}
const legacySlides=[
{t:1,k:'3-1 · 도입',title:'자본주의와 시장경제',body:`<p class="lead">우리가 자유롭게 물건을 사고팔고, 직업과 사업을 선택할 수 있는 까닭은 무엇일까요?</p><p class="question">자본주의를 설명하는 핵심 단어를 세 개 골라 봅시다.</p><div class="flow"><span>사유 재산</span><span>경제활동의 자유</span><span>사적 이익</span><span>시장 경쟁</span></div>`,c:['자본주의','시장경제 체제'],p:['자본주의를 단순히 돈을 중시하는 사회로 정의하지 않습니다.','사유 재산·경제활동의 자유·시장 경쟁을 연결합니다.']},
{t:1,k:'3-1 · 핵심',title:'자본주의의 의미와 특징',body:`<p>${T('자본주의')}는 사유 재산 제도를 바탕으로 시장에서 자유로운 경제활동을 보장하는 경제 체제입니다.</p><div class="board-grid"><div class="board-card"><b>사유 재산권</b><p>재산을 획득·사용·처분할 수 있습니다.</p></div><div class="board-card"><b>경제활동의 자유</b><p>생산·소비·직업·투자를 스스로 선택합니다.</p></div><div class="board-card"><b>사적 이익 추구</b><p>자신의 이익을 추구하고 선택에 책임집니다.</p></div><div class="board-card"><b>시장경제와 결합</b><p>경쟁 과정에서 가격과 거래량이 결정됩니다.</p></div></div>`,c:['자본주의','사유 재산권','시장경제 체제'],p:['HWP 본문의 세 가지 특징을 학생 언어로 풀었습니다.','핵심은 자유로운 선택과 선택에 대한 책임입니다.']},
{t:1,k:'3-1 · 역사',title:'상업 자본주의에서 산업 자본주의로',body:`<table class="board-table"><tr><th></th><th>${T('상업 자본주의')}</th><th>${T('산업 자본주의')}</th></tr><tr><td>배경</td><td>신항로 개척·중상주의</td><td>산업 혁명·기계 공업</td></tr><tr><td>이윤</td><td>상품의 유통 과정</td><td>제조업과 대량 생산</td></tr><tr><td>정부</td><td>수출 장려·수입 억제</td><td>자유방임·작은 정부</td></tr></table><p class="teacher-cue">질문: 두 단계는 ‘어디에서 이윤을 얻는가’가 어떻게 다를까요?</p>`,c:['상업 자본주의','중상주의','산업 자본주의','자유방임주의'],p:['유통 이윤과 생산 이윤을 대비합니다.','애덤 스미스의 보이지 않는 손을 시장의 자동 조절 기능과 연결합니다.']},
{t:1,k:'3-1 · 변화',title:'시장 실패와 수정 자본주의',body:`<div class="flow"><span>독과점·빈부 격차</span><b>→</b><span>1929년 대공황</span><b>→</b><span>대량 실업</span><b>→</b><span>정부 개입</span></div><p>${T('수정 자본주의')}는 정부가 시장에 개입해 ${T('시장 실패')}와 경기 침체를 해결해야 한다는 입장입니다.</p><div class="board-grid"><div class="board-card"><b>케인스</b><p>정부 지출로 일자리와 유효 수요를 늘립니다.</p></div><div class="board-card"><b>큰 정부</b><p>공공사업과 사회 보장 제도를 확대합니다.</p></div></div>`,c:['시장 실패','수정 자본주의','대공황'],p:['대공황 전후 정부 역할의 변화를 중심으로 봅니다.','수정 자본주의는 시장경제를 폐지한 것이 아닙니다.']},
{t:1,k:'3-1 · 변화',title:'정부 실패와 신자유주의',body:`<div class="flow"><span>정부 개입 확대</span><b>→</b><span>비효율·재정 부담</span><b>→</b><span>석유 파동</span><b>→</b><span>시장 기능 재강조</span></div><p>${T('신자유주의')}는 규제 완화, 민영화, 복지 축소 등을 통해 시장 경쟁을 확대하려는 입장입니다.</p><p class="keyline">효율성 회복과 함께 <span class="highlight">양극화·사회 안전망 약화</span>라는 비판도 봅니다.</p>`,c:['정부 실패','스태그플레이션','신자유주의'],p:['스태그플레이션은 경기 침체와 물가 상승의 동시 발생입니다.','수정 자본주의와 신자유주의를 등장 배경으로 비교합니다.']},
{t:1,k:'3-1 · 정리',title:'시장과 정부의 관계',body:`<table class="board-table"><tr><th></th><th>시장경제</th><th>계획경제</th><th>혼합 경제</th></tr><tr><td>해결 방식</td><td>가격과 자유로운 선택</td><td>정부의 계획·명령</td><td>시장을 정부가 보완</td></tr><tr><td>강조 가치</td><td>자유·효율성</td><td>평등·계획성</td><td>효율성과 형평성</td></tr></table><p class="question">시장과 정부 중 어느 한쪽의 역할이 항상 커야 할까요?</p>`,c:['시장경제 체제','계획경제 체제','혼합 경제 체제'],p:['현실의 대부분 국가는 혼합 경제 체제입니다.','시장 실패와 정부 실패 사이에서 역할이 조정됩니다.']},
{t:2,k:'3-2 · 도입',title:'합리적 선택이란?',body:`<p class="lead">욕구에 비해 자원이 부족한 ${T('희소성')} 때문에 우리는 선택해야 합니다.</p><p>${T('합리적 선택')}은 여러 대안 가운데 <b>순편익이 가장 큰 대안</b>을 선택하는 것입니다.</p><p class="question">가장 싼 선택은 언제나 가장 합리적일까요?</p>`,c:['희소성','합리적 선택','순편익'],p:['희소성은 희귀성과 달리 상대적인 개념입니다.','편익에는 만족감 같은 비금전적 가치도 포함됩니다.']},
{t:2,k:'3-2 · 계산',title:'기회비용을 빠짐없이 찾기',body:`<div class="big-formula">기회비용 = 명시적 비용 + 암묵적 비용</div><div class="board-grid"><div class="board-card"><b>${T('명시적 비용')}</b><p>직접 화폐로 지출한 비용</p></div><div class="board-card"><b>${T('암묵적 비용')}</b><p>선택 때문에 포기한 가장 가치 있는 대안</p></div></div><p>${T('매몰 비용')}은 이미 지출해 회수할 수 없으므로 현재 선택에서는 제외합니다.</p><p class="keyline">“얼마를 냈나?” + “무엇을 포기했나?”</p>`,c:['기회비용','명시적 비용','암묵적 비용','매몰 비용'],p:['포기한 모든 대안을 더하지 않습니다.','포기한 대안 중 가장 가치가 큰 것을 봅니다.']},
{t:2,k:'3-2 · 단계별 계산',title:'순편익으로 선택 판단하기',body:`<div class="big-formula">기회비용 = 명시적 비용 + 암묵적 비용<br>순편익 = 편익 − 기회비용</div><div class="calc-panel"><div class="calc-grid"><label>편익<input id="benefit" type="number" value="120000"></label><label>명시적 비용<input id="explicit" type="number" value="50000"></label><label>암묵적 비용<input id="implicit" type="number" value="40000"></label></div><div class="calc-actions"><button class="calc-run" id="choice-next">다음 풀이 단계</button><button class="calc-all" id="choice-all">전체 풀이 보기</button><button class="calc-reset" id="choice-reset">처음부터</button></div><div class="calc-progress" id="choice-progress">풀이 전 · 자료의 뜻부터 확인합니다.</div><div class="calc-steps" id="choice-steps"><div class="calc-step"></div><div class="calc-step"></div><div class="calc-step"></div><div class="calc-step final"></div></div></div>`,c:['기회비용','순편익'],p:['합리적 선택은 기회비용 최소가 아니라 순편익 최대입니다.','매몰 비용을 더하지 않았는지 확인합니다.'],kind:'choice'},
{t:2,k:'3-2 · 한계',title:'합리적 선택의 한계와 시장 실패',body:`<div class="board-grid"><div class="board-card"><b>${T('독과점')}</b><p>가격과 공급량 왜곡</p></div><div class="board-card"><b>${T('공공재')}</b><p>무임승차와 과소 공급</p></div><div class="board-card"><b>${T('긍정적 외부 효과')}</b><p>외부 편익, 과소 생산</p></div><div class="board-card"><b>${T('부정적 외부 효과')}</b><p>외부 비용, 과다 생산</p></div></div><p class="keyline">개인에게 합리적인 선택이 사회 전체에도 항상 최선은 아닙니다.</p>`,c:['시장 실패','독과점','공공재','외부 효과'],p:['공공재는 정부가 만든 모든 재화가 아닙니다.','비경합성과 비배제성을 확인합니다.']},
{t:2,k:'3-2 · 적용',title:'외부 효과와 정부 대응',body:`<table class="board-table"><tr><th></th><th>제3자에게</th><th>시장 결과</th><th>정부 대응</th></tr><tr><td>긍정적</td><td>이익</td><td>과소 생산·소비</td><td>보조금·세금 감면</td></tr><tr><td>부정적</td><td>피해</td><td>과다 생산·소비</td><td>세금·과징금·규제</td></tr></table><p class="question">예방 접종과 공장 소음은 각각 어느 쪽일까요?</p>`,c:['긍정적 외부 효과','부정적 외부 효과'],p:['긍정·부정은 행동의 선악이 아니라 제3자에게 생긴 효과의 방향입니다.','긍정적 효과는 늘리고 부정적 효과는 줄입니다.']},
{t:3,k:'3-3 · 정부',title:'정부의 바람직한 역할',body:`<div class="board-grid"><div class="board-card"><b>불공정 거래 규제</b><p>지위 남용과 담합 제한</p></div><div class="board-card"><b>공공재 공급</b><p>시장에 맡기면 부족한 재화 공급</p></div><div class="board-card"><b>긍정적 외부 효과</b><p>보조금으로 확대</p></div><div class="board-card"><b>부정적 외부 효과</b><p>세금과 규제로 축소</p></div></div>`,c:['불공정 거래','공공재','외부 효과'],p:['정부는 시장을 없애는 것이 아니라 시장 실패를 개선합니다.','정부 개입도 정부 실패를 만들 수 있습니다.']},
{t:3,k:'3-3 · 기업',title:'기업의 역할과 책임',body:`<div class="board-grid"><div class="board-card"><b>${T('기업가 정신')}</b><p>위험과 불확실성을 감수하며 혁신하려는 의지</p></div><div class="board-card"><b>${T('기업의 사회적 책임')}</b><p>환경·노동자·소비자·공정 경쟁까지 고려</p></div></div><p class="question">법규만 지키면 사회적 책임을 모두 다한 것일까요?</p>`,c:['기업가 정신','기업의 사회적 책임','ESG 경영'],p:['소극적 책임과 적극적 책임을 구분합니다.','기업가 정신과 사회적 책임은 대립하지 않습니다.']},

function bindCalc(){bindStepper('choice',()=>{const b=Number(document.getElementById('benefit').value),e=Number(document.getElementById('explicit').value),i=Number(document.getElementById('implicit').value);if([b,e,i].some(v=>!Number.isFinite(v)||v<0))return alert('0 이상의 숫자를 입력하세요.'),null;const o=e+i,n=b-o,judge=n>0?'순편익이 양수이므로 선택할 가치가 있습니다.':n<0?'순편익이 음수이므로 선택하지 않는 편이 합리적입니다.':'순편익이 0이므로 다른 조건도 함께 비교해야 합니다.';return [`<b>① 자료의 뜻 확인</b><p>편익 ${b.toLocaleString()}원, 직접 지출한 명시적 비용 ${e.toLocaleString()}원, 포기한 최선의 대안인 암묵적 비용 ${i.toLocaleString()}원입니다.</p>`,`<b>② 기회비용 계산</b><p>기회비용 = 명시적 비용 + 암묵적 비용 = ${e.toLocaleString()} + ${i.toLocaleString()} = <strong>${o.toLocaleString()}원</strong></p>`,`<b>③ 순편익 계산</b><p>순편익 = 편익 − 기회비용 = ${b.toLocaleString()} − ${o.toLocaleString()} = <strong>${n.toLocaleString()}원</strong></p>`,`<b>④ 합리적 선택 판단</b><p>${judge} 여러 대안이 있다면 각각의 순편익을 구해 가장 큰 대안을 선택합니다.</p>`]});bindStepper('trade',()=>{const A=Number(document.getElementById('ax').value),Y=Number(document.getElementById('ay').value),B=Number(document.getElementById('bx').value),Z=Number(document.getElementById('by').value);if([A,Y,B,Z].some(v=>!Number.isFinite(v)||v<=0))return alert('0보다 큰 숫자를 입력하세요.'),null;const ax=Y/A,ay=A/Y,bx=Z/B,by=B/Z,absX=A===B?'X 생산량은 같아 절대 우위가 없습니다.':`${A>B?'갑국':'을국'}이 X에 절대 우위`,absY=Y===Z?'Y 생산량은 같아 절대 우위가 없습니다.':`${Y>Z?'갑국':'을국'}이 Y에 절대 우위`,comp=ax===bx?'두 나라의 기회비용이 같아 비교 우위가 없습니다.':ax<bx?'갑국은 X, 을국은 Y에 비교 우위가 있습니다.':'을국은 X, 갑국은 Y에 비교 우위가 있습니다.';return [`<b>① 절대 우위 확인</b><p>X 생산량: 갑국 ${A}, 을국 ${B} → ${absX}<br>Y 생산량: 갑국 ${Y}, 을국 ${Z} → ${absY}</p>`,`<b>② 갑국의 기회비용</b><p>X 1개 = ${Y} ÷ ${A} = <strong>${ax.toFixed(2)}Y</strong><br>Y 1개 = ${A} ÷ ${Y} = <strong>${ay.toFixed(2)}X</strong></p>`,`<b>③ 을국의 기회비용</b><p>X 1개 = ${Z} ÷ ${B} = <strong>${bx.toFixed(2)}Y</strong><br>Y 1개 = ${B} ÷ ${Z} = <strong>${by.toFixed(2)}X</strong></p>`,`<b>④ 비교 우위와 특화 판단</b><p>같은 재화끼리 기회비용을 비교하면 ${comp} 각 나라는 비교 우위 재화에 특화할 때 무역 이익을 얻을 수 있습니다.</p>`]})}
