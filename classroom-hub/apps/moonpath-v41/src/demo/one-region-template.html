<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>미지의 길 v4.1.1 · 지역 탐험</title>
<style>
<!-- MP_SCENE_STYLE -->
<!-- MP_QUESTION_STYLE -->
</style></head><body>
<main id="canvas" aria-label="지역 탐험 · 교사용 시험 화면">
 <header><h1>《미지의 길》 달빛 이끼길</h1><div class="scene-caption">달빛 원정 · 기록은 이 브라우저에 보관됩니다</div><b id="engine-availability" class="scene-sr-only">시험 환경 준비 중</b></header>
 <nav id="scene-navigation" aria-label="탐험 이동"></nav>
 <section id="scene-hud" aria-label="공동 탐험 상태"><div id="status-data"></div></section>
 <section id="body">
  <aside class="pane"><h2 id="region-title">현재 지역</h2><p id="scene-progress-label">기본문제 대기</p><p id="region-progress" class="scene-sr-only">기본문제 대기</p><div id="scene-health-controls"></div><div id="scene-budget"></div><div id="results"></div>
   <details id="scene-debug"><summary>기록 상세 · 교사용 검증 전용 정보</summary><p id="slot-active">아직 시작하지 않음</p><p>학생 공개 정보 (읽기 전용)</p><pre id="public-json">{}</pre></details>
  </aside>
  <section class="pane scene-teacher"><h2>교사 조작</h2><div class="scene-lesson"><span id="scene-phase-label">수업 시작 대기</span><b id="lesson-phase" class="scene-sr-only">-</b><span id="turn-status"></span></div>
   <div id="scene-command-grid"><div id="scene-runtime-controls"></div>
    <div class="actions"><button id="region-enter">지역 진입</button><label>문제 모둠 <select id="team-select"></select></label><button id="draw-question" disabled>새 문제 준비</button><button id="intercept-open" disabled>가로채기</button></div>
    <div class="actions"><button id="complete-region" disabled>지역 완료 확정</button><button id="next-region" disabled>다음 지역 진입</button><button id="recovery-call" disabled>원모둠 회수 호출</button></div>
   </div>
  </section>
 </section>
 <div id="toolbar" role="group" aria-label="슬롯과 저장 도구"><span id="scene-tool-hint">저장 도구 ↔</span><label>슬롯 <select id="slot-picker"><option value="1">Ⅰ</option><option value="2">Ⅱ</option><option value="3">Ⅲ</option></select></label><label>새 시험 모둠 <select id="team-count"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
 <button id="new-expedition">새 시험</button><button id="continue-expedition">이어하기</button><button id="session-resume" disabled>수업 재개</button><button id="export-json">JSON 백업</button><label>복원 <input id="json-file" type="file" accept=".json"></label><button id="import-json">빈 슬롯 복원</button></div>
 <footer id="message" role="status" aria-live="polite">시험 파일 준비 중</footer>
</main>
<section id="question-pane" hidden role="dialog" aria-labelledby="question-popup-title" aria-describedby="question-label">
 <div class="question-art" aria-hidden="true"><div class="question-art-frame"></div><div class="question-art-title"></div><div class="question-art-corner"></div></div>
 <h2 id="question-popup-title">달빛 문제</h2><div id="question-navigation"></div>
 <div id="question-layout">
  <div id="question-content"><div class="question-head"><small id="question-label"></small><span id="question-clock" hidden></span><span id="question-clock-label" role="status" aria-live="polite"></span></div>
   <h3 id="question-stem" tabindex="-1">문제</h3><div id="question-stimulus"></div><div id="response-form"></div>
  </div>
  <div id="question-footer"><p id="question-status" role="status" aria-live="polite"></p>
   <div id="question-timers"><button id="timer-start" type="button">타이머 시작</button><button id="timer-pause" type="button">일시정지</button><button id="timer-resume" type="button">타이머 재개</button></div>
   <div id="question-grading"><label>교사 판정 근거<input id="teacher-reason" value="교사가 직접 확인함" aria-label="교사 판정 근거"></label><button id="submit-answer" type="button">답변 저장</button><button id="judge-right" type="button">정답 확정</button><button id="judge-wrong" type="button">오답 확정</button></div>
  </div>
 </div>
</section>

<script>function resize(){const k=Math.min(innerWidth/960,innerHeight/540),compact=innerWidth<960||innerHeight<540,canvas=document.getElementById('canvas');canvas.classList.toggle('scene-compact',compact);document.documentElement.classList.toggle('scene-compact-page',compact);document.body.classList.toggle('scene-compact-page',compact);canvas.style.transform=compact?'none':`translate(-50%,-50%) scale(${k})`;}addEventListener('resize',resize);resize();</script>
<!-- MP_MODULES -->
<!-- MP_ENTRY -->
</body></html>
