{id:'contract',title:'근로계약서',place:'하늘의 가방',kind:'결정적 단서',intro:'약속한 조건을 확인한다',text:`<div class="eyebrow">EVIDENCE 01 / 계약서 발췌</div><h2>여름방학 근로계약</h2><hr><table><tr><th>근로자</th><td>김하늘 · 만 17세 · 고등학생</td></tr><tr><th>계약 기간</th><td>2026. 7. 6.(월) ~ 7. 26.(일)</td></tr><tr><th>근무 약속</th><td>매주 월~금 16:00~20:30<br>18:00~18:30 자유로운 무급 휴게<br>실제 근로 1일 4시간 · 주 20시간</td></tr><tr><th>임금</th><td>기본 시급 10,500원<br>주휴수당은 요건 충족 시 별도 지급<br>매주 월요일에 직전 주 임금 지급</td></tr><tr><th>휴일</th><td>토요일 무급 휴무 · 일요일 주휴일</td></tr></table><p class="small">하늘과 사장이 직접 서명했고, 하늘도 계약서를 받았다. 친권자 동의서와 연령 증명 서류는 사업장에 비치되어 있다. 수습 약정 없음.</p>`,question:'매일 가게에 있던 시간과 실제 근로시간은 같은가요?',why:'약정 시급·주 20시간·주휴수당 별도 지급을 확정한다.'},
{id:'attendance',title:'출퇴근 기록',place:'직원 휴게실',kind:'결정적 단서',intro:'기록으로 근무를 재구성한다',text:`<div class="eyebrow">EVIDENCE 02 / 출퇴근 단말기</div><h2>하늘의 3주</h2><hr><table><tr><th>주간</th><th>출근한 날</th><th>실제 근로</th></tr><tr><td>7/6~7/12</td><td>월~금 모두 출근</td><td>20시간</td></tr><tr><td>7/13~7/19</td><td>월~금 모두 출근</td><td>20시간</td></tr><tr><td>7/20~7/26</td><td>월~금 모두 출근</td><td>20시간</td></tr></table><p>15일 모두 16:00 출근, 20:30 퇴근. 매일 18:00~18:30 휴게. 결근·지각·조퇴·추가 근무 기록 없음.</p><p class="small">일요일인 7/12, 7/19, 7/26까지 각각 근로관계가 유지되었다. 주말에 일하지 않았다.</p>`,question:'“가게에 머문 시간”에서 무엇을 빼야 할까요?',why:'3주 모두 소정근로일 개근, 총 60시간을 입증한다.'},
{id:'photo',title:'깨진 컵 사진',place:'카운터',kind:'일반 단서',intro:'현장에 남은 흔적을 살핀다',text:`<div class="eyebrow">EVIDENCE 03 / 7월 23일 현장 사진</div><h2>금이 간 유리컵 세 개</h2><hr><svg viewBox="0 0 650 165" role="img" aria-label="금이 간 컵 세 개와 유리 조각을 재현한 수사 도해" style="width:100%;max-height:170px;background:#ddd7c7"><g fill="none" stroke="#596a60" stroke-width="4"><path d="M75 30h95l-12 95H87zM110 31l13 29-17 21 21 43M170 50q55 0 20 48l-26 3M270 30h95l-12 95h-71zM302 31l18 30-12 20 19 43M365 50q55 0 20 48l-26 3M465 30h95l-12 95h-71zM497 31l18 30-12 20 19 43M560 50q55 0 20 48l-26 3"/><path d="M205 130l20-12 7 22zM395 134l20-15 8 24zM448 126l7 20 18-12z" stroke-width="2"/></g><text x="20" y="155" font-size="13" fill="#657065">현장 자료 재현 · 수업용 도해</text></svg><p>쟁반 옆에 깨진 컵 세 개가 놓여 있다. 사진만으로는 누가, 왜 컵을 깼는지 알 수 없다.</p><p>수리 메모에는 ‘교체 비용 30,000원’이라고 적혀 있다.</p>`,question:'물건이 깨졌다는 사실만으로 월급에서 빼도 될까요?',why:'사고의 존재를 보여 주지만 책임이나 임금 공제의 적법성은 입증하지 못한다.'},
{id:'post',title:'익명 게시글',place:'카페 게시판',kind:'함정 단서',intro:'떠도는 주장도 검증한다',text:`<div class="eyebrow">EVIDENCE 04 / 출처 미확인</div><h2>“알바는 원래…”</h2><hr><p style="font-size:27px">“학생 알바는 어른보다 적게 받아도 되고,<br>잠깐 일했으면 쉬는 날 돈은 없는 거 아닌가?”</p><p class="muted">작성자: 익명 / 근거 링크 없음</p><p>다른 학생이 이 글을 보고 하늘에게 전달했다.</p>`,question:'이 주장을 믿으려면 어떤 근거가 필요할까요?',why:'나이와 단기 근무만으로 최저임금·주휴 권리를 없앨 수 있다는 잘못된 주장이다.'},
{id:'profile',title:'가게 운영표',place:'사장실',kind:'일반 단서',intro:'사건의 배경을 확인한다',text:`<div class="eyebrow">EVIDENCE 05 / 카페 모퉁이</div><h2>매장 운영 정보</h2><hr><p>사장을 제외한 상시 근로자 6명.<br>하늘과 같은 일을 하는 통상근로자는 주 5일, 하루 8시간 근무한다.</p><p>하늘은 직원의 지시를 받아 음료를 만들고 매장을 정리했다. 독립적으로 일하는 사업자가 아니다.</p><p class="small">이 사건은 기본급·주휴수당·컵값 공제만 다룬다. 세금·사회보험은 별도 정산하며, 모든 금액 비교는 법정 공제 전 임금 기준이다.</p>`,question:'다른 직원의 근무일 수는 어떤 계산에 필요할까요?',why:'단시간근로자의 주휴수당 계산에 필요한 통상근로자 주 5일 조건을 확인한다.'},

{id:'chat',title:'사장과의 문자',place:'추가 확보 · 하늘의 휴대전화',kind:'결정적 단서',intro:'공제에 관한 당사자 의사를 확인한다',text:`<div class="eyebrow">EVIDENCE 07 / 7월 27일 대화</div><h2>동의했을까?</h2><hr><p><b>사장</b><br>네가 컵을 깼으니 마지막 급여에서 3만 원 뺐어. 주휴는 정직원에게만 주는 거고.</p><p><b>하늘</b><br>컵을 깬 건 맞아요. 하지만 월급에서 빼는 데 동의한 적은 없어요. 주휴는 계약서에 따로 준다고 쓰여 있어요.</p><p><b>사장</b><br>내가 계산한 대로 보낸 거야.</p><p class="small">컵값 공제에 관한 별도의 자유로운 상계 동의, 단체협약상 근거 또는 법령상 공제 근거는 없다.</p>`,question:'실수를 인정하는 것과 임금 공제에 동의하는 것은 같나요?',why:'컵 파손과 일방적인 임금 공제를 분리해서 판단할 수 있게 한다.'}
];
let lawText=`<div class="eyebrow">FIELD MANUAL / 2026. 9. 18. 확인</div><h2>청소년 노동권 수첩</h2><div class="lesson"><h3>01 · 시급의 기준</h3><p>2026년 최저임금은 시간당 10,320원. 청소년에게도 적용된다. 이 사건은 수습 감액 약정이 없다.</p></div><div class="lesson"><h3>02 · 주휴수당의 조건</h3><p>4주 평균(근로기간이 4주 미만이면 그 기간)의 1주 소정근로시간이 15시간 이상이고, 해당 주의 소정근로일을 개근했는지 확인한다. 주휴일까지 근로관계가 유지된 이 사건의 세 주를 각각 살핀다.</p><p>이 사건처럼 통상근로자가 주 5일 일하고 매주 근무시간이 같다면, 주휴 유급시간 = 주 소정근로시간 ÷ 5. 여기에 약정 시급을 곱한다. 모든 알바에게 일률적으로 8시간을 적용하지 않는다.</p></div><div class="lesson"><h3>03 · 실수와 월급은 별개</h3><p>임금은 원칙적으로 전액 지급한다. 법령·단체협약에 따른 공제 등은 별도로 보아야 한다. 컵을 깼다고 사용자가 손해액을 일방적으로 월급에서 뺄 수는 없다. 손해배상 책임 자체는 별도로 판단한다.</p></div><div class="lesson"><h3>04 · 미성년자도 권리의 주체</h3><p>본인이 계약하고 계약서를 받는다. 18세 미만의 연령 증명 서류와 친권자·후견인 동의서는 사업장에 갖춘다. 미성년자도 독자적으로 임금을 청구할 수 있다.</p></div><p class="small muted">근거: 최저임금위원회 2026 적용액, 근로기준법 제18·43·55·66~68조, 시행령 제9조·별표 2 및 제30조. 법령 요약은 게임 안에 수록되어 있어 인터넷 없이 읽을 수 있다.</p>`;

function storageLabel(){if($('storageStatus'))$('storageStatus').textContent=saveOK?'오프라인 실행 · 이 브라우저에 자동 저장':'오프라인 실행 · 자동 저장 불가 — 창을 닫으면 진행이 사라집니다';}
function toast(msg){clearTimeout(toastTimeout);$('toast').textContent=msg;$('toast').classList.remove('hidden');toastTimeout=setTimeout(()=>$('toast').classList.add('hidden'),3200);}
function classroomBaseModal(title,body){if($('modal').open)$('modal').close();$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal();$('modalBody').scrollTop=0;}
function closeModal(){$('modal').close();if(discussionInterval){clearInterval(discussionInterval);discussionInterval=null;}}
$('modal').addEventListener('close',()=>{if(discussionInterval){clearInterval(discussionInterval);discussionInterval=null;}});
function go(stage){if(stage>s.unlocked)return;s.stage=stage;save();render();window.scrollTo(0,0);}
function unlock(stage){s.unlocked=Math.max(s.unlocked,stage);go(stage);}

function renderNav(){$('nav').innerHTML=steps.map((name,i)=>`<button ${i>s.unlocked?'disabled':''} class="${s.stage===i?'active':''}" ${s.stage===i?'aria-current="step"':''} onclick="go(${i})">${String(i).padStart(2,'0')} ${name}</button>`).join('');}
function c1_intro(){return `<section class="hero"><div><div class="eyebrow">SOCIAL DETECTIVE OFFICE</div><h1>사라진<br>아르바이트비</h1><p class="quote">“분명 약속한 날은 다 일했는데…<br>제 월급, 이게 맞는 건가요?”</p><p class="muted">첫 아르바이트를 마친 만 17세 하늘.<br>이제 여러분이 기록 속 빈칸을 찾을 차례입니다.</p><div class="tags"><span class="tag">CASE 001</span><span class="tag">청소년 노동권</span><span class="tag">15~20분</span></div><div class="row"><button class="primary" onclick="startCase()">사건 수사 시작 →</button><button onclick="settings()">탐정단 설정</button></div></div><div class="folder"><div class="paper"><div class="row spread"><span class="eyebrow">접수일 2026. 7. 28.</span><span class="stamp">미해결</span></div>${cafeSVG(true)}<h3>의뢰인 · 김하늘</h3><p class="small" style="margin-top:10px">카페 모퉁이 / 여름방학 3주 근무<br>급여 내역의 지급 인정액: 600,000원<br>※ 세금·보험료 등 법정 공제 전 비교</p><hr><p>의뢰: 약속과 기록을 대조해<br><b>빠진 임금이 있는지 밝혀 주세요.</b></p></div></div></section><div class="panel"><b>오늘의 약속</b><p>학생은 조사할 곳을 말하고, 선생님은 클릭합니다. 정답뿐 아니라 좋은 질문과 근거 설명에도 탐정 점수 +1! 한 번 틀려도 다시 추리할 수 있습니다.</p><div class="timeline"><div><b>1분</b>사건 접수</div><div><b>4분</b>현장 탐색</div><div><b>3분</b>인터뷰</div><div><b>2분</b>중간 추리</div><div><b>4분</b>추가 조사</div><div><b>4분</b>판단·정리</div></div></div>`;}

0q55-65 44-75q-32 10-44 75" stroke="#799577" stroke-width="8" fill="none"/><rect x="380" y="125" width="68" height="78" fill="#cfbd90"/><path d="M391 144H435M391 159H435M391 175H423" stroke="#817954" stroke-width="3"/></svg>`;}
function c1_scene(){let ready=['contract','attendance','profile'].every(id=>s.found.includes(id))&&s.found.filter(id=>clues.findIndex(c=>c.id===id)<5).length>=4;return `<div class="row spread"><div><div class="eyebrow">01 / 현장 탐색 · 약 4분</div><h2>먼저, 어디를 살펴볼까요?</h2></div><button onclick="openBoard()">증거 보드 ${s.found.length}/7</button></div><p class="muted">물건을 선택하고, 그 기록이 무엇을 알려 주는지 설명해 보세요.</p><div class="scene">${cafeSVG()}${[['contract',26,73],['attendance',36,23],['photo',69,61],['post',7,17],['profile',71,19]].map(([id,x,y])=>`<button aria-label="${clues.find(c=>c.id===id).place}" class="spot ${s.found.includes(id)?'found':''}" style="left:${x}%;top:${y}%" onclick="openClue('${id}')">${clues.find(c=>c.id===id).place}</button>`).join('')}</div><div class="hint">탐정 질문: <b>누군가의 주장과 확인 가능한 사실은 어떻게 다를까요?</b></div><div class="nextbar"><p>${ready?'핵심 기록 확보 완료. 이제 사람들의 설명을 들어 봅시다.':'가방·휴게실·사장실을 포함해 최소 4곳을 조사하세요.'}</p><button class="primary" ${ready?'':'disabled'} onclick="unlock(2)">증인 인터뷰 →</button></div>`;}

function openBoard(){showModal('수사 증거 보드',`<p class="muted">확보한 증거를 다시 열어 비교할 수 있습니다.</p><div class="board cards" style="margin-top:18px">${clues.map((c,i)=>s.found.includes(c.id)?`<button class="evidence" onclick="openClue('${c.id}')"><span class="small">EVIDENCE ${String(i+1).padStart(2,'0')}</span><h3>${c.title}</h3><span class="small">${c.place}</span></button>`:`<div class="panel muted"><div class="eyebrow">${String(i+1).padStart(2,'0')}</div><p>미확보 기록</p></div>`).join('')}</div>`);}
let people=[{id:'sky',name:'김하늘',role:'의뢰인 · 만 17세',icon:'◉',question:'휴게시간에는 정말 쉴 수 있었나요?',answer:'네. 매일 6시부터 30분 동안 다른 직원이 제 일을 맡아 줬어요. 저는 밖에 나가거나 쉬었고, 일을 시키지는 않았어요. 약속한 날은 전부 출근했어요.',prompt:'출퇴근 기록과 이 진술을 합치면 하루 몇 시간 일했을까요?'},{id:'boss',name:'박 사장',role:'카페 모퉁이 운영자',icon:'▣',question:'급여를 어떻게 계산하셨나요?',answer:'하루 4시간씩 15일, 시급은 약속대로 계산했어. 컵을 깨뜨린 일은 하늘도 인정하잖아. 그리고 잠깐 일한 학생에게 쉬는 날 돈까지 줘야 하나? 자세한 건 급여 원장에 있어.',prompt:'사장의 설명 중 기록이나 법으로 확인해야 할 부분은 무엇인가요?'},{id:'coworker',name:'이지우',role:'같이 일한 직원',icon:'◎',question:'사고와 근무 상황을 보셨나요?',answer:'하늘은 3주 내내 정해진 날에 나왔어요. 컵은 하늘이 옮기다가 깨뜨린 게 맞아요. 하지만 컵값을 월급에서 빼기로 합의하는 모습은 못 봤어요. 그 부분은 둘의 대화를 확인해야겠죠.',prompt:'“못 봤다”는 진술만으로 동의가 없었다고 확정할 수 있을까요?'}];
function interviews(){return `<div class="eyebrow">02 / 증인 인터뷰 · 약 3분</div><h2>같은 사건, 다른 이야기</h2><p class="muted" style="margin:10px 0 22px">진술은 단서입니다. 기록과 대조하기 전에는 결론이 아닙니다.</p><div class="grid">${people.map(p=>`<div class="panel witness"><div class="avatar" aria-hidden="true">${p.icon}</div><h3>${p.name}</h3><p class="small muted">${p.role}</p><button onclick="interview('${p.id}')">${s.interviews.includes(p.id)?'✓ 진술 다시 듣기':'질문하기'}</button></div>`).join('')}</div><div class="hint">증인에게 추가로 묻고 싶은 질문을 한 가지씩 말해 보세요. 좋은 질문에도 점수를 줄 수 있습니다.</div><div class="nextbar"><button onclick="openBoard()">증거 보드</button><p>인터뷰 ${s.interviews.length}/3 완료</p><button class="primary" ${s.interviews.length===3?'':'disabled'} onclick="unlock(3)">중간 추리 →</button></div>`;}

function c1_middle(){return `<div class="eyebrow">03 / 중간 추리 · 약 2분</div><h2>우리 반의 첫 번째 가설</h2><p class="muted">아직 확정하지 마세요. 가설과 연결되는 증거 두 개를 고릅니다.</p><fieldset class="question"><legend>지금 가장 확인하고 싶은 가능성은?</legend>${['시급이 법정 기준보다 낮았을 것이다.','쉬는 날 임금이나 컵값 처리에 문제가 있을 것이다.','하늘이 결근해서 급여가 줄었을 것이다.'].map((v,i)=>`<label class="option"><input type="radio" name="hyp" value="${i}" ${s.hypothesis===i?'checked':''} onchange="s.hypothesis=${i};save()"><span>${v}</span></label>`).join('')}</fieldset><h3>왜 그렇게 생각하나요? · 증거 2개</h3><div class="cards">${clues.slice(0,5).filter(c=>s.found.includes(c.id)).map(c=>`<label class="option"><input type="checkbox" name="midev" value="${c.id}" ${s.midEvidence.includes(c.id)?'checked':''} onchange="midSelect(this)"><span>${c.title}</span></label>`).join('')}</div><div class="nextbar"><div class="row"><button onclick="discussion()">전체회의 · 경과 시간</button><button onclick="openBoard()">기록 다시 보기</button></div><button class="primary" onclick="submitMiddle()">가설 기록 · 추가 수사 →</button></div>`;}
function midSelect(el){if(el.checked){if(s.midEvidence.length===2){el.checked=false;toast('가장 관련 있는 증거 두 개만 선택하세요.');return;}s.midEvidence.push(el.value);}else s.midEvidence=s.midEvidence.filter(x=>x!==el.value);save();}
function submitMiddle(){if(s.hypothesis===null||s.midEvidence.length!==2){toast('가설 한 개와 근거 두 개를 선택하세요.');return;}unlock(4);toast('가설을 기록했습니다. 추가 증거로 검증하세요.');}
function c1_additional(){let ready=['pay','chat'].every(id=>s.found.includes(id));return `<div class="eyebrow">04 / 추가 증거 · 약 4분</div><h2>빠진 항목, 그리고 한 통의 문자</h2><p class="muted" style="margin:10px 0 20px">가설을 확인할 두 기록이 도착했습니다. 노동권 수첩과 함께 대조하세요.</p><div class="board cards">${clues.slice(5).map((c,i)=>`<button class="evidence" onclick="openClue('${c.id}')"><span class="small">EVIDENCE 0${i+6} ${s.found.includes(c.id)?'· 확인 완료':'· 새로 도착'}</span><h3>${c.title}</h3><p>${c.intro}</p></button>`).join('')}</div><div class="panel" style="margin-top:20px"><div class="row spread"><div><h3>노동권 수첩</h3><p class="muted">시급 · 주휴수당 · 임금 지급 원칙</p></div><button onclick="lawBook()">수첩 펼치기 ↗</button></div></div><div class="hint">계산 순서: <b>일한 시간의 임금 + 유급휴일 임금 − 이미 지급한 임금</b><br>세금·보험료는 이 사건의 차액 계산에 섞지 않습니다.</div><div class="nextbar"><button onclick="openBoard()">전체 증거 비교</button><p>${ready?'두 기록이 확보되었습니다. 이제 판단을 제출할 수 있습니다.':'추가 기록 두 개를 모두 확인하세요.'}</p><button class="primary" ${ready?'':'disabled'} onclick="unlock(5)">최종 판단 →</button></div>`;}

function radio(name,values){return values.map((v,i)=>`<label class="option"><input type="radio" name="${name}" value="${i}" ${s.final[name]===i?'checked':''} onchange="s.final['${name}']=${i};save()"><span>${v}</span></label>`).join('');}
function c1_judgment(){return `<div class="eyebrow">05 / 최종 판단 · 약 2분</div><h2>결론에는 근거가 필요합니다</h2><div class="row" style="margin-top:15px"><button onclick="openBoard()">증거 보드</button><button onclick="lawBook()">노동권 수첩</button><button onclick="discussion()">전체회의 · 경과 시간</button></div><fieldset class="question"><legend>1. 약정 기본 시급 10,500원은?</legend>${radio('rate',['2026년 최저임금보다 낮다.','2026년 최저임금 이상이다.'])}</fieldset><fieldset class="question"><legend>2. 이 사건의 주휴수당은?</legend>${radio('holiday',['학생이므로 지급 대상이 아니다.','주 20시간·개근·주휴일까지 고용 유지: 세 주 모두 발생한다.','주휴일에 실제로 일해야만 발생한다.'])}</fieldset><fieldset class="question"><legend>3. 컵값 30,000원을 일방적으로 뺀 것은?</legend>${radio('deduct',['컵을 깼으므로 일방 공제도 가능하다.','일방 공제는 안 된다. 손해배상 문제는 별도로 판단한다.'])}</fieldset><fieldset class="question"><legend>4. 빠진 임금을 계산해 보세요</legend><p class="small muted">모두 법정 공제 전 금액입니다. 숫자만 입력하세요.</p><div class="calc" style="margin-top:12px"><label>3주 기본급 (원)<input type="number" min="0" step="1" id="basic" value="${s.final.basic??''}" oninput="s.final.basic=this.value;save()"></label><label>3주 주휴수당 (원)<input type="number" min="0" step="1" id="holidaypay" value="${s.final.holidaypay??''}" oninput="s.final.holidaypay=this.value;save()"></label><label>추가로 지급할 임금 (원)<input type="number" min="0" step="1" id="shortfall" value="${s.final.shortfall??''}" oninput="s.final.shortfall=this.value;save()"></label><div class="hint small">지급 인정액 600,000원<br>최종 차액에 컵값을 두 번 더하지 않도록 주의하세요.</div></div></fieldset><fieldset class="question"><legend>5. 결론을 직접 뒷받침하는 기록 네 개는?</legend><p class="small muted">약정 조건 · 실제 근무 · 급여 계산 · 공제에 대한 의사를 각각 입증하는 기록을 고르세요.</p><div class="cards">${clues.filter(c=>s.found.includes(c.id)).map(c=>`<label class="option"><input type="checkbox" name="finalev" value="${c.id}" ${(s.final.evidence||[]).includes(c.id)?'checked':''} onchange="finalSelect(this)"><span>${c.title}</span></label>`).join('')}</div></fieldset><div id="verdictFeedback" role="status"></div><div class="nextbar"><p>선생님은 학생의 설명을 들은 뒤 제출해 주세요.</p><button class="primary" onclick="submitFinal()">판단서 제출 →</button></div>`;}
function finalSelect(el){let arr=s.final.evidence||[];if(el.checked)arr.push(el.value);else arr=arr.filter(x=>x!==el.value);s.final.evidence=arr;save();}
function c1_submitFinal(){let f=s.final,errors=[];if(f.rate!==1)errors.push('① 약정 시급과 노동권 수첩의 2026년 기준액을 직접 비교해 보세요.');if(f.holiday!==1)errors.push('② 계약 기간·주당 약정 시간·개근 기록을 함께 확인하세요.');if(f.deduct!==1)errors.push('③ 파손 사실과 임금 공제의 근거는 별개의 문제입니다. 문자를 다시 읽어 보세요.');if(Number(f.basic)!==630000)errors.push('④ 기본급: 실제 근로시간 × 일수 × 약정 시급으로 계산하세요.');if(Number(f.holidaypay)!==126000)errors.push('④ 주휴수당: 주 약정 시간 ÷ 통상근로자 주 근무일 수 × 시급 × 3주를 적용하세요.');if(Number(f.shortfall)!==156000)errors.push('④ 차액: 기본급 + 주휴수당 − 지급 인정액으로 계산하세요.');const need=['contract','attendance','pay','chat'];if((f.evidence||[]).length!==4||!need.every(x=>(f.evidence||[]).includes(x)))errors.push('⑤ 각각의 사실을 직접 입증하는 네 기록을 골라 주세요. 배경 자료와 직접 증거를 구분해 봅시다.');if(errors.length){$('verdictFeedback').innerHTML=`<div class="feedback"><h3>보완 수사 요청</h3><p>추리는 수정할 수 있습니다. 감점 없이 다시 도전하세요.</p>${errors.map(x=>`<p>${x}</p>`).join('')}</div>`;$('verdictFeedback').scrollIntoView({behavior:'smooth',block:'center'});return;}s.running=false;unlock(6);chime();}
function c1_closed(){return `<div class="eyebrow">06 / 사건 종결 · 개념 정리 2분</div><div class="ribbon">CASE CLOSED</div><h2 style="text-align:center">사라진 건 근무시간이 아니라, 권리였습니다.</h2><div class="panel" style="margin-top:25px"><div class="row spread"><div><p class="muted">추가로 지급해야 할 임금 · 법정 공제 전</p><div class="amount">156,000원</div></div><div>주휴수당 누락 <b>126,000원</b><br>일방적으로 뺀 컵값 <b>30,000원</b></div></div><hr style="border-color:var(--line)"><p>기본급: 4시간 × 15일 × 10,500원 = 630,000원<br>주휴수당: (20시간 ÷ 5일) × 10,500원 × 3주 = 126,000원<br>정당한 총 임금: 756,000원<br>차액: 756,000원 − 지급 인정액 600,000원 = <b>156,000원</b></p></div><div class="hint">하늘: “제가 실수한 일과, 일한 대가를 받는 권리가 같은 문제가 아니라는 걸 알았어요.”<br><span class="small">게임 속 판단입니다. 실제 구제는 사실관계 확인과 법적 절차를 거칩니다.</span></div><div class="row"><button class="primary" onclick="showLessons()">개념 정리 · 다음 행동</button><button onclick="classify()">단서의 정체 공개</button><button onclick="discussion()">마지막 토론</button></div><div class="panel" style="margin-top:20px"><h3>교실을 나가기 전, 한 문장</h3><p>“일하다가 실수했더라도, __________.”</p><p class="muted">오늘 내 생각을 바꾼 증거 하나를 말해 보세요. 정답을 처음부터 알지 못했어도 괜찮습니다.</p></div><div class="nextbar"><button onclick="exportScores()">탐정 점수 저장</button><button class="quiet" onclick="resetGate()">다음 반 · 새 수사</button></div>`;}
function c1_showLessons(){showModal('사건에서 가져갈 네 가지',`<div class="lesson"><h3>① 시급만 맞으면 끝일까?</h3><p>이 사건의 기본 시급은 최저임금 이상이지만, 주휴수당 누락과 일방 공제 문제가 남습니다. 급여 전체를 항목별로 살펴야 합니다.</p></div><div class="lesson"><h3>② 주휴는 일하지 않은 날의 유급휴일</h3><p>이 사건은 매주 20시간 약정, 개근, 일요일까지 고용 유지 조건을 충족했습니다. 단기간·청소년이라는 이유만으로 제외되지 않습니다.</p></div><div class="lesson"><h3>③ “실수했다” ≠ “임금에서 빼도 된다”</h3><p>사장의 일방 공제는 임금 전액 지급 원칙에 어긋납니다. 다만 실제 손해에 대한 배상 책임이 무조건 사라진다는 뜻은 아닙니다.</p></div><div class="lesson"><h3>④ 증거를 모으고 도움을 요청하기</h3><p>계약서·근무 기록·급여 내역·문자를 보관하고, 누락 항목과 금액을 제시해 정산을 요청합니다. 해결되지 않으면 고용노동부 1350에 상담하거나 관할 노동관서에 임금체불 진정을 할 수 있습니다. 미성년자도 독자적으로 임금을 청구할 수 있습니다.</p></div><div class="hint">확장 질문: 15세 이상 18세 미만은 원칙적으로 하루 7시간·주 35시간 이내 근로. 당사자 합의 시 하루 1시간·주 5시간 한도로 연장할 수 있습니다. 이 사건의 하루 4시간·주 20시간은 한도 안입니다.</div><button onclick="sources()">법령·공식 자료 출처</button>`);}

let audioContext;function chime(){if(!s.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});[523.25,659.25,783.99].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.09;o.frequency.value=f;o.connect(g);g.connect(audioContext.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.31);});}catch(e){}}

function c1_teacherGuide(){showModal('교사용 진행·정답 안내',`<div class="stack"><h2>18분 진행안</h2><p>접수 1분 → 현장 4분 → 인터뷰 3분 → 중간 추리 2분 → 추가 조사 4분 → 최종 판단 2분 → 정리 2분.</p><p>현장에서는 계약서·출퇴근 기록·운영표를 포함한 네 단서가 필요합니다. 인터뷰는 세 명 모두, 추가 기록은 두 개 모두 확인해야 다음 단계로 넘어갑니다. 함정 게시글까지 조사하면 토론이 풍성해집니다.</p><p>중간 가설은 오답도 허용합니다. 최종 판단은 시급 ②, 주휴 ②, 공제 ②. 계산은 630,000 / 126,000 / 156,000원. 직접 증거는 계약서·출퇴근 기록·급여 원장·문자 네 개입니다.</p><p>주휴: 같은 업무의 통상근로자가 주 5일이므로 (3주 소정근로 60시간 ÷ 통상근로자 3주 소정근로일 15일) = 4시간. 1주 42,000원 × 3주 = 126,000원. 계약은 7/26 일요일까지 유지됩니다. 실제 근로 60시간 외에 주휴 유급시간 12시간이 있습니다.</p><p>급여는 법정 공제 전 기준으로만 비교합니다. 실제 통장액을 그대로 체불액과 비교하는 사례가 아닙니다. 세금·보험료의 가입·공제 여부를 가르치는 사례로 사용하지 마세요.</p><p>점수는 자동 채점 보상이 아닌 교사 수동 보상입니다. 좋은 질문·근거 수정에도 +1. ‘취소’는 마지막으로 준 1점을 되돌립니다. 정답이 달라도 감점은 없습니다.</p><p>18분 시계는 권장 시간이며 초과해도 계속 진행됩니다. 새로 열면 시계는 멈춘 상태로 복구됩니다. 같은 파일·브라우저에서 자동 저장되며, 브라우저 설정에 따라 저장이 제한될 수 있습니다.</p><div class="row"><button onclick="sources()">법적 근거 확인</button><button onclick="resetGate()">새 수사 초기화</button></div></div>`);}
function c1_sources(){showModal('확인한 공식 법령·자료',`<p>법령 확인일: <b>2026. 9. 18.</b><br>사건 기간: 2026. 7. 6.~7. 26. / 최종 지급일 7. 27.</p><p class="small muted">아래 링크는 원문을 확인할 때만 인터넷이 필요합니다. 게임 진행과 수첩 열람에는 연결이 필요 없습니다.</p><div class="lesson"><a href="https://www.minimumwage.go.kr/minWage/policy/decisionMain.do" target="_blank" rel="noopener noreferrer">최저임금위원회 · 연도별 결정현황</a><p>2026년 시급 10,320원 적용.</p></div><div class="lesson"><a href="https://www.law.go.kr/법령/근로기준법" target="_blank" rel="noopener noreferrer">국가법령정보센터 · 근로기준법</a><p>제18조(단시간근로), 제43조(임금), 제54·55조(휴게·휴일), 제66~69조(연소자·계약·임금 청구·근로시간).</p></div><div class="lesson"><a href="https://www.law.go.kr/법령/근로기준법시행령" target="_blank" rel="noopener noreferrer">근로기준법 시행령 · 제9조·별표 2, 제30조</a><p>단시간근로자 유급휴일 임금과 개근 요건.</p></div><div class="lesson"><a href="https://www.moel.go.kr/news/cardinfo/view.do?bbs_seq=20250200286" target="_blank" rel="noopener noreferrer">고용노동부 · 단시간근로자 주휴수당 안내</a><p>2025. 2. 6. 게시. 근무시간·개근 요건 및 산식 확인.</p></div><div class="lesson"><a href="https://labor.moel.go.kr/minwonSysInfo/parttimehelpway.do" target="_blank" rel="noopener noreferrer">고용노동부 노동포털 · 아르바이트 피해 구제</a></div><p class="small muted">시간적 적용: 확인일에 시행 중인 규정과 사건 당시 규정을 구분했습니다. 2026. 12. 10. 시행 예정인 제54조 개정 예외는 7월 사건에 적용하지 않습니다. 이 사건은 매일 자유로운 30분 휴게를 실제 부여한 것으로 설정했습니다. 인물·가게·기록은 수업용 창작입니다.</p>`);}

{id:'contract',title:'거래 약속',place:'채팅 창',kind:'결정적 단서',intro:'물건·가격·기한을 확인한다',text:`<div class="eyebrow">EVIDENCE 01 / 2026. 9. 1.</div><h2>무선 헤드폰 거래</h2><hr><p><b>민서</b> · 헤드폰 45,000원에 배송비 4,000원, 합계 49,000원이 맞죠?</p><p><b>판매자</b> · 맞아요. 입금하면 9월 2일까지 제가 택배사에 물건을 맡길게요.</p><p><b>민서</b> · 그 조건으로 구매할게요.</p><p class="small">구매자 이민서와 판매자 모두 만 19세 이상. 거래는 유효하게 성립했다. 계약에서 미발송 때에도 대금을 반환하지 않는다는 약정은 없다.</p>`,question:'판매자가 하기로 한 일은 운송장 만들기인가요, 물건 맡기기인가요?',why:'물품·대금·배송비와 9월 2일 발송 약속을 확정한다.'},
{id:'attendance',title:'송금 확인서',place:'결제 기록',kind:'결정적 단서',intro:'구매자가 지급한 금액을 확인한다',text:`<div class="eyebrow">EVIDENCE 02 / 결제 기록</div><h2>49,000원 송금 완료</h2><hr><p>2026. 9. 1. 15:21<br>이민서 → 판매자가 지정한 본인 계좌</p><p>상품 대금 45,000원 + 배송비 4,000원<br>거래 플랫폼 밖에서 직접 계좌이체</p><p><b>판매자 확인 메시지</b> · “49,000원 받았습니다.”</p><p class="small">추가 수수료 없음. 현재까지 반환된 돈 없음. 실제 계좌번호 등 개인정보는 수업 자료에서 생략했다.</p>`,question:'받지 못한 물건의 가격만 돌려받으면 원래 상태가 될까요?',why:'판매자가 상품값과 배송비를 합해 49,000원을 받았음을 입증한다.'},
{id:'photo',title:'운송장 사진',place:'사진 보관함',kind:'일반 단서',intro:'사진이 증명하는 범위를 따진다',text:`<div class="eyebrow">EVIDENCE 03 / 판매자가 보낸 사진</div><h2>운송장 번호가 있으니 발송 완료?</h2><hr><div style="border:3px dashed #6d817c;padding:25px"><b>가상택배 · 예약 운송장</b><p>예약번호 CLASS-0902<br>받는 분: 이민서<br>접수 구분: 온라인 예약</p><p style="letter-spacing:5px">▎▎▌▎▌▌▎▎▌▎▌▎▌</p></div><p>판매자는 “택배 보냈어요”라는 말과 함께 이 사진을 보냈다. 사진에는 택배사 인수 시각이나 접수 직원 확인이 없다.</p><p class="small">사진·택배사·번호는 수업용 창작이며 실제 조회 대상이 아니다.</p>`,question:'라벨을 만들었다는 것과 물건을 전달했다는 것은 같나요?',why:'운송장 생성은 보여 주지만 실제 택배 인수를 증명하지는 못한다.'},
{id:'post',title:'인기 댓글',place:'커뮤니티',kind:'함정 단서',intro:'단정적인 조언을 검증한다',text:`<div class="eyebrow">EVIDENCE 04 / 출처 미확인 댓글</div><h2>“중고는 원래 환불 불가!”</h2><hr><p>“개인끼리 거래면 물건을 안 보내도 환불해 줄 의무 없어. 중고는 다 본인 책임이지.”</p><p class="muted">공감 87개 · 법적 근거 없음</p><p>다른 댓글에는 “인터넷에서 샀으니 무조건 7일 환불!”이라고 적혀 있다.</p>`,question:'서로 반대되는 두 주장 중 하나는 반드시 맞을까요?',why:'개인 간 거래의 단순 변심과 판매자의 미이행은 구분해야 한다. 두 단정 모두 이 사건의 해결 근거가 아니다.'},
{id:'profile',title:'판매자 정보',place:'거래 프로필',kind:'일반 단서',intro:'어떤 거래인지 확인한다',text:`<div class="eyebrow">EVIDENCE 05 / 당사자 확인</div><h2>사업자가 아닌 개인 판매자</h2><hr><p>판매자는 자신이 쓰던 헤드폰 한 개를 처분하는 개인이다. 사업으로 반복 판매하는 사람이 아닌 것으로 확인되었다.</p><p>플랫폼은 물건의 판매 당사자가 아니며, 이 거래에 안전결제·에스크로 서비스를 제공하지 않았다.</p><p>좋은 후기 12개가 있다. 후기는 다른 거래에 대한 평가다.</p>`,question:'좋은 후기가 이번 거래의 발송까지 증명할까요?',why:'사업자와 소비자 사이의 거래와 구분할 배경이다. 기존 후기가 이번 계약의 이행을 보장하지는 않는다.'},
{id:'pay',title:'택배사 확인서',place:'추가 확보 · 배송 기록',kind:'결정적 단서',intro:'운송장 사진을 실제 기록과 대조한다',text:`<div class="eyebrow">EVIDENCE 06 / 9월 18일 확인</div><h2>예약만 생성, 물품 인수 없음</h2><hr><p>가상택배 고객센터 확인:<br>“해당 번호는 9월 2일 온라인 예약으로 생성되었습니다. 당사는 이 물품을 인수하지 않았습니다.”</p><p>9/2 예약 생성 → 집하·인수 기록 없음 → 운송·배달 기록 없음</p><p class="small">단순 조회 지연으로 단정하지 않도록 고객센터의 인수 여부 확인까지 확보했다. 다른 운송장으로 보냈는지는 판매자에게 별도 확인해야 한다.</p>`,question:'택배사가 잃어버렸다는 가설을 유지할 수 있나요?',why:'해당 택배사에 물건을 맡겼다는 설명과 충돌한다. 판매자의 추가 답변으로 다른 발송 가능성도 확인해야 한다.'},
{id:'chat',title:'추가 대화와 해제 통지',place:'추가 확보 · 메시지 원본',kind:'결정적 단서',intro:'미발송 사실과 해결 절차를 확인한다',text:`<div class="eyebrow">EVIDENCE 07 / 시간순 메시지</div><h2>물건은 아직 판매자의 집에</h2><hr><p><b>9/3 민서</b> · 약속한 발송이 확인되지 않아요. 9월 10일까지 실제 발송해 주세요. 그때까지 보내지 않으면 계약을 해제하겠습니다.</p><p><b>9/3 판매자</b> · 물건이 집에 있어요. 일주일이면 충분해요. 10일까지 보낼게요.</p><p><b>9/11 판매자</b> · 다른 택배로도 안 보냈어요. 지금도 제 집에 있어요. 그래도 중고니까 환불은 안 해요.</p><p><b>9/11 민서</b> · 추가로 정한 기간에도 발송하지 않았으므로 계약을 해제합니다. 송금한 상품값과 배송비를 반환해 주세요. <b>[판매자 읽음]</b></p><p class="small">9/18 현재까지 미발송·미환급. 판매자에게 이행 장애는 없고, 추가 7일은 이 사건에서 충분한 기간이었던 것으로 확정한다. 정해진 7일이 모든 계약의 법정 최고 기간이라는 뜻은 아니다.</p>`,question:'처음 약속, 추가 이행 요청, 해제 의사표시는 각각 언제인가요?',why:'미발송 인정·충분한 추가 기간·기간 경과·해제 통지 도달을 입증한다.'}

],lawText:`<div class="eyebrow">거래 권리 수첩 / 2026. 9. 18. 확인</div><h2>약속이 지켜지지 않았다면</h2><div class="lesson"><h3>① 거래 상대방부터 확인</h3><p>이 사건은 사업자가 아닌 개인 간 일회성 거래입니다. 사업자와의 통신판매에서 다루는 ‘7일 청약철회’를 그대로 적용하는 문제는 아닙니다. 개인 간 거래에도 계약상 의무는 있습니다.</p></div><div class="lesson"><h3>② 사진 한 장의 증명 범위</h3><p>예약 운송장과 실제 물품 인수 기록을 구분합니다. 배송조회만으로 단정하지 말고 택배사 확인과 판매자의 답변도 대조합니다.</p></div><div class="lesson"><h3>③ 이행 요청 → 기간 경과 → 해제 통지</h3><p>민법 제544조는 일반적으로 상당한 기간을 정해 이행을 요구하고, 그 기간에도 이행하지 않으면 계약을 해제할 수 있도록 합니다. 해제 의사표시는 상대방에게 해야 합니다(제543조). 추가 기간의 충분성은 사건마다 다릅니다.</p></div><div class="lesson"><h3>④ 원상회복과 해결 창구</h3><p>해제 후에는 원래 상태로 되돌리는 것이 원칙입니다(제548조). 받은 금전의 이자나 손해배상은 별도 검토합니다. 이번 계산은 반환할 원금만 묻습니다. 전자문서·전자거래분쟁조정위원회는 개인 간 전자거래의 조정도 다룹니다.</p></div><p class="small muted">계약 불이행과 형사상 사기는 구분합니다. 이 자료만으로 처음부터 속일 의도가 있었다고 확정하지 않습니다.</p>`};

function libraryView(){return `<section class="library"><div class="eyebrow">SOCIAL DETECTIVE OFFICE / 사건 보관함</div><h1>오늘, 어떤 사건을<br>해결할까요?</h1><p class="muted">화면을 열 때마다 사건을 선택하세요. 사건별 진행은 따로, 탐정 이름과 점수는 함께 이어집니다.</p><div class="cards" style="margin-top:30px">${[{title:'사라진 아르바이트비',theme:'청소년 노동권',icon:'◈',desc:'약속한 날을 모두 일했는데, 첫 월급은 왜 예상보다 적게 들어왔을까요?'},{title:'사라진 중고거래 물건',theme:'소비자 권리 · 개인 간 거래',icon:'▱',desc:'운송장 사진까지 받았는데, 주문한 중고 물건은 왜 도착하지 않았을까요?'}].map((c,i)=>{const n=i+1,st=db.cases[n];return `<article class="casecard"><div class="row spread"><span class="eyebrow">CASE 00${n}</span><span class="caseicon">${c.icon}</span></div><h2>${c.title}</h2><div class="tags"><span class="tag">${c.theme}</span><span class="tag">15~20분</span></div><p>${c.desc}</p><div class="row"><button class="primary" onclick="selectCase(${n},false)">${st?'이어 열기':'사건 열기'} →</button>${st?`<button onclick="freshGate(${n})">처음부터</button>`:''}</div>${st?`<p class="small muted" style="margin:15px 0 0">저장된 위치: ${steps[st.stage]} · 경과 ${timeText(st.elapsed)}</p>`:''}</article>`;}).join('')}</div><div class="hint">처음에는 <b>학생 이름 등록</b>으로 우리 반 명단을 넣어 주세요. 이름이 없어도 수사는 진행할 수 있습니다.</div><div class="musiccontrol"><button onclick="settings()">학생 이름 등록</button></div></section>`;}
function selectCase(n,fresh=false){if(drawBusy){toast('탐정 추첨이 끝난 뒤 사건을 바꿔 주세요.');return;}save();currentCase=n;s={...defaults(),...(!fresh?db.cases[n]:{}),...db.shared,running:false};library=false;setData();save();closeModal();render();window.scrollTo(0,0);if(s.music)startMusic();}
function freshGate(n){showModal('사건을 처음부터 열기',`<p>CASE 00${n}의 단서·판단·경과 시간만 초기화합니다. 학생 이름과 누적 탐정 점수는 유지합니다.</p><button class="primary" style="margin-top:20px" onclick="selectCase(${n},true)">처음부터 열기</button>`);}
function showLibrary(){if(drawBusy){toast('탐정 추첨이 끝나면 사건을 바꿀 수 있습니다.');return;}s.running=false;save();library=true;closeModal();render();window.scrollTo(0,0);}
function startCase(){if(s.unlocked===0){s.running=true;lastTick=Date.now();}unlock(1);if(s.music)startMusic();}
function intro(){if(currentCase===1)return c1_intro();return `<section class="hero"><div><div class="eyebrow">CASE 002 / 이어지는 의뢰</div><h1>사라진<br>중고거래 물건</h1><p class="quote">“운송장 사진까지 받았는데…<br>헤드폰은 어디에 있는 걸까요?”</p><p class="muted">하늘의 소개로 찾아온 대학생 이민서.<br>좋은 후기를 믿고 산 헤드폰이 도착하지 않았습니다.</p><div class="tags"><span class="tag">소비자 권리</span><span class="tag">개인 간 거래</span><span class="tag">15~20분</span></div><button class="primary" onclick="startCase()">사건 수사 시작 →</button></div><div class="folder"><div class="paper"><div class="eyebrow">접수일 2026. 9. 18.</div><div style="font-size:100px;text-align:center;color:#526b76">▱</div><h3>예약번호 CLASS-0902</h3><hr><p>보낸 돈: 49,000원<br>받은 물건: 없음<br>판매자: “중고거래라 환불 안 돼요.”</p><hr><p><b>의뢰: 발송 여부와<br>돌려받을 권리를 밝혀 주세요.</b></p></div></div></section><div class="panel"><h3>첫 번째 사건에서 배운 수사 원칙</h3><p>주장과 사실을 구분하고, 여러 기록을 연결합니다. 이번에도 결론은 증거를 모은 뒤에 내립니다. CASE 001을 먼저 해결하지 않아도 시작할 수 있습니다.</p></div>`;}
function scene(){if(currentCase===1)return c1_scene();const ready=['contract','attendance','profile'].every(x=>s.found.includes(x))&&s.found.length>=4;return `<div class="row spread"><div><div class="eyebrow">01 / 현장 탐색 · 약 4분</div><h2>민서의 디지털 책상</h2></div><button onclick="openBoard()">증거 보드 ${s.found.length}/7</button></div><p class="muted">확인할 자료를 말해 주세요. 이 화면은 가상의 거래 기록입니다.</p><div class="scene2"><div class="desk">${clues.slice(0,5).map((c,i)=>`<button onclick="openClue('${c.id}')"><span>${s.found.includes(c.id)?'✓ 확인 완료':'기록 0'+(i+1)}</span><b>${c.place}</b><span style="margin:12px 0 0">${c.intro}</span></button>`).join('')}</div></div><div class="hint">“번호가 있다”는 사실에서 “발송했다”는 결론으로 바로 넘어가도 될까요?</div><div class="nextbar"><p>${ready?'기본 기록을 확보했습니다. 이제 당사자의 설명을 듣습니다.':'채팅 창·결제 기록·거래 프로필을 포함해 네 곳 이상 조사하세요.'}</p><button class="primary" ${ready?'':'disabled'} onclick="unlock(2)">증인 인터뷰 →</button></div>`;}
function middle(){if(currentCase===1)return c1_middle();return c1_middle().replace('시급이 법정 기준보다 낮았을 것이다.','택배사가 배송 중 분실했을 것이다.').replace('쉬는 날 임금이나 컵값 처리에 문제가 있을 것이다.','판매자가 예약만 하고 실제 발송은 하지 않았을 것이다.').replace('하늘이 결근해서 급여가 줄었을 것이다.','민서가 송금하지 않아 발송되지 않았을 것이다.').replace('전체회의 · 경과 시간','전체회의 · 경과 시간');}
function additional(){if(currentCase===1)return c1_additional();return c1_additional().replace('빠진 항목, 그리고 한 통의 문자','사진 속 번호를 추적하다').replaceAll('노동권 수첩','거래 권리 수첩').replace('시급 · 주휴수당 · 임금 지급 원칙','발송 증거 · 이행 요청 · 계약 해제').replace(/계산 순서: <b>[\s\S]*?<\/div><div class="nextbar">/,'시간순으로 연결하기: <b>거래 약속 → 송금 → 실제 발송 확인 → 추가 이행 요청 → 해제 통지</b></div><div class="nextbar">');}

function judgment(){if(currentCase===1)return c1_judgment();return `<div class="eyebrow">05 / 최종 판단</div><h2>물건의 행방과 돌려받을 권리</h2><div class="row" style="margin-top:16px"><button onclick="openBoard()">증거 보드</button><button onclick="lawBook()">거래 권리 수첩</button><button onclick="discussion()">전체회의</button></div><fieldset class="question"><legend>1. 확보한 기록으로 확인한 사실은?</legend>${radio('delivery',['택배사가 배송 중 물건을 잃어버렸다.','예약만 생성되었고, 물건은 아직 판매자가 갖고 있다.','좋은 후기가 있으므로 발송은 완료되었다.'])}</fieldset><fieldset class="question"><legend>2. 민서의 반환 요구 근거는?</legend>${radio('right',['개인 간 거래이므로 어떤 경우에도 환불 불가다.','상당한 추가 기간에도 미이행하여 해제 의사를 통지했다.','인터넷 거래는 상대방과 상관없이 항상 7일 청약철회가 된다.'])}</fieldset><fieldset class="question"><legend>3. 지금 할 수 있는 적절한 행동은?</legend>${radio('action',['판매자를 사기범으로 확정하고 신상을 공개한다.','기록을 보관하고 반환을 요구하며, 불응 시 개인 간 전자거래 분쟁조정 등을 검토한다.','한국소비자원이 모든 개인 간 거래의 환급을 강제로 집행한다.'])}</fieldset><fieldset class="question"><legend>4. 반환을 요구할 원금은 얼마인가요?</legend><label>상품값과 판매자에게 보낸 배송비 합계 (원)<input id="refund" type="number" min="0" value="${safe(s.final.refund||'')}" oninput="s.final.refund=this.value;save()"></label><p class="small muted">이미 돌려받은 돈은 없습니다. 이 문항은 원금만 계산합니다. 이자·손해배상은 별도 검토합니다.</p></fieldset><fieldset class="question"><legend>5. 네 사실의 직접 증거를 골라 주세요</legend><p class="muted small">약속한 내용 · 받은 돈 · 택배사 인수 여부 · 미이행과 해제 절차</p><div class="cards">${clues.filter(c=>s.found.includes(c.id)).map(c=>`<label class="option"><input type="checkbox" name="finalev" value="${c.id}" ${(s.final.evidence||[]).includes(c.id)?'checked':''} onchange="finalSelect(this)"><span>${c.title}</span></label>`).join('')}</div></fieldset><div id="verdictFeedback" role="status"></div><div class="nextbar"><p>교사는 학생의 근거 설명을 들은 뒤 제출합니다.</p><button class="primary" onclick="submitFinal()">판단서 제출 →</button></div>`;}
function submitFinal(){if(currentCase===1)return c1_submitFinal();const f=s.final,err=[];if(f.delivery!==1)err.push('① 택배사 확인서와 판매자의 최종 답변을 함께 읽어 보세요.');if(f.right!==1)err.push('② 약속 위반 이후 민서가 한 행동을 시간순으로 살펴보세요.');if(f.action!==1)err.push('③ 권리 구제와 형사 범죄의 확정은 다릅니다. 거래 수첩의 해결 창구를 확인하세요.');if(Number(f.refund)!==49000)err.push('④ 판매자가 받은 상품값과 배송비를 합산하세요.');if((f.evidence||[]).length!==4||!['contract','attendance','pay','chat'].every(x=>(f.evidence||[]).includes(x)))err.push('⑤ 네 사실을 각각 직접 입증하는 기록을 고르세요.');if(err.length){$('verdictFeedback').innerHTML=`<div class="feedback"><h3>보완 수사 요청</h3>${err.map(e=>`<p>${e}</p>`).join('')}<p>감점 없이 다시 추리할 수 있습니다.</p></div>`;$('verdictFeedback').scrollIntoView({block:'center'});return;}s.running=false;unlock(6);chime();}
function closed(){const result=currentCase===1?c1_closed():`<div class="eyebrow">06 / 사건 종결</div><div class="ribbon">CASE CLOSED</div><h2>운송장은 만들어졌지만, 물건은 떠나지 않았습니다.</h2><div class="panel" style="margin-top:22px"><p class="muted">해제에 따라 반환을 요구할 원금</p><div class="amount">49,000원</div><p>상품 대금 45,000원 + 미사용 배송비 4,000원</p><p class="small muted">민법상 금전 반환의 이자·손해배상 문제는 이 원금과 별도입니다.</p></div><div class="hint">9/2 발송 약속 → 9/3 추가 이행 요구 → 9/10까지 미이행 → 9/11 해제 통지 도달.<br>이 사건에서는 충분한 기간을 준 뒤에도 발송하지 않았습니다. ‘개인 간 거래’라는 이유로 그 의무가 사라지지 않습니다.</div><p>민서: “사진을 받았다는 것과 물건을 보냈다는 게 다른 거였네요. 기록을 갖추어 정산을 요구할게요.”</p><div class="row" style="margin-top:20px"><button class="primary" onclick="showLessons()">개념 정리 · 다음 행동</button><button onclick="classify()">단서의 정체 공개</button><button onclick="exportScores()">탐정 점수 저장</button></div><div class="panel" style="margin-top:22px"><h3>마지막 질문</h3><p>“개인 간 거래라도 __________.”</p><p class="muted">형사상 사기 여부를 이 자료만으로 단정하지 않은 이유도 설명해 보세요.</p></div>`;return result+`<div class="panel row spread" style="margin-top:24px"><div><h3>이번 수사 경과 · ${timeText(s.elapsed)}</h3><p class="small muted">탐정 이름과 누적 점수는 다음 사건에도 이어집니다.</p></div><button class="primary" onclick="selectCase(${currentCase===1?2:1},false)">CASE 00${currentCase===1?2:1} ${db.cases[currentCase===1?2:1]?'이어 열기':'수사하러 가기'} →</button><button onclick="showLibrary()">사건 선택으로</button></div>`;}
function classroomBaseLessons(){if(currentCase===1)return c1_showLessons();showModal('거래에서 지킬 네 가지',`${caseTwo.lawText}<div class="hint">먼저 원금 반환을 요청하고 증거를 보관합니다. 해결되지 않으면 플랫폼의 분쟁 절차, 전자문서·전자거래분쟁조정위원회, 민사상 청구 등을 검토합니다. 실제 사기 정황이 있으면 별도로 경찰 상담·신고를 검토할 수 있지만, 단순 지연만으로 사기죄가 확정되지는 않습니다.</div><button onclick="sources()">공식 법령·출처</button>`);}
function nameOf(id){return s.names[id]||'이름 미등록';}
function eligible(){return s.students.filter(id=>!s.excluded.includes(id));}
function renderAside(){const active=s.active;$('aside').innerHTML=`<div class="eyebrow">우리 반 탐정단</div><div class="activeDetective"><span class="small muted">현재 출동 탐정</span><b id="activeNum">${active?safe(nameOf(active)):'—'}</b></div>${!s.students.length?'<div class="namehint small">학생 이름을 먼저 등록하면 이름 선택·추첨·점수를 사용할 수 있습니다.</div>':''}<label class="small" for="mode">참여 방식</label><select id="mode" onchange="s.mode=this.value;save();renderAside()"><option value="volunteer" ${s.mode==='volunteer'?'selected':''}>지원 탐정 · 손든 학생</option><option value="random" ${s.mode==='random'?'selected':''}>무작위 이름 탐정</option><option value="designate" ${s.mode==='designate'?'selected':''}>지목 탐정 · 이름 선택</option></select><div style="margin-top:12px">${s.mode==='random'?`<button id="drawButton" style="width:100%" ${!eligible().length?'disabled':''} onclick="draw()">탐정 뽑기</button><p class="scorehint">한 바퀴 동안 중복 없음 · 남은 ${eligible().filter(id=>!s.drawn.includes(id)).length}/${eligible().length}명</p>`:`<label for="detective" class="small">${s.mode==='volunteer'?'손든 학생 이름':'지목할 학생 이름'}</label><select id="detective" onchange="s.active=Number(this.value)||null;save();renderAside()"><option value="">이름 선택</option>${eligible().map(id=>`<option value="${id}" ${active===id?'selected':''}>${safe(nameOf(id))}</option>`).join('')}</select>`}</div><div class="row" style="margin-top:14px"><button class="primary" onclick="award(1)">★ +1</button><button onclick="undoScore()">취소</button></div><p class="scorehint">좋은 질문 · 근거 설명 · 오류 수정<br>두 사건의 누적 점수를 함께 기록합니다.</p><div id="scorelist">${Object.entries(s.scores).filter(([id,p])=>p>0).sort((a,b)=>b[1]-a[1]).map(([id,p])=>`<div class="scoreitem"><span>${safe(nameOf(id))}</span><b>★ ${p}</b></div>`).join('')||'<p class="muted small">첫 탐정의 활약을 기다립니다.</p>'}</div><div class="stack" style="margin-top:20px"><button class="quiet small" style="width:100%" onclick="discussion()">전체회의 · 경과 시간</button><button class="quiet small" style="width:100%" onclick="settings()">학생 이름 · 소리 설정</button><button class="quiet small" style="width:100%" onclick="exportScores()">누적 점수 저장</button></div>`;}
async function draw(){if(drawBusy)return;let pool=eligible().filter(n=>!s.drawn.includes(n));if(!pool.length){s.drawn=[];pool=eligible();}if(!pool.length){toast('학생 이름을 등록하세요.');return;}drawBusy=true;$('drawButton').disabled=true;for(let i=0;i<10;i++){if($('activeNum'))$('activeNum').textContent=nameOf(pool[Math.floor(Math.random()*pool.length)]);await new Promise(r=>setTimeout(r,70+i*8));}s.active=pool[Math.floor(Math.random()*pool.length)];s.drawn.push(s.active);drawBusy=false;save();renderAside();toast(nameOf(s.active)+' 탐정 출동!');chime();}
function award(p){if(drawBusy){toast('추첨이 끝난 뒤 점수를 주세요.');return;}if(!s.active){toast('먼저 탐정 이름을 선택하세요.');return;}s.scores[s.active]=(s.scores[s.active]||0)+p;s.history.push(s.active);save();renderAside();toast('★ '+nameOf(s.active)+' 탐정 +1');chime();}
function undoScore(){const n=s.history.pop();if(!n){toast('취소할 점수가 없습니다.');return;}s.scores[n]=Math.max(0,(s.scores[n]||0)-1);save();renderAside();toast(nameOf(n)+' 탐정의 마지막 1점을 취소했습니다.');}
function settings(){if(drawBusy){toast('추첨 후 설정할 수 있습니다.');return;}showModal('학생 이름 · 소리 설정',`<div class="setup"><label class="wide">학생 이름 · 한 줄에 한 명 (최대 60명)<textarea id="namesInput" placeholder="김민서&#10;이지우&#10;박하준">${safe(s.students.map(nameOf).join('\n'))}</textarea></label><label class="wide">이번 수업에서 제외할 이름 · 쉼표 또는 줄바꿈으로 구분<textarea id="excludeNames" style="min-height:65px" placeholder="결석한 학생 이름">${safe(s.excluded.map(nameOf).join(', '))}</textarea></label><p class="small muted wide">동명이인은 ‘김민서 A’, ‘김민서 B’처럼 구분하세요. 이름과 점수는 이 브라우저에만 저장됩니다. 명단에서 뺀 학생의 기존 점수는 기록에 남습니다.</p><label class="checkrow"><input type="checkbox" id="soundInput" ${s.sound?'checked':''}>점수 효과음</label><label class="checkrow"><input type="checkbox" id="musicInput" ${s.music?'checked':''}>추리 배경음악</label><label class="wide">배경음악 음량 <input type="range" class="volume" id="volumeInput" min="0" max="50" value="${Math.round(s.volume*100)}" oninput="previewVolume(this.value)"><span class="small" id="volumeLabel">${Math.round(s.volume*100)}%</span></label><div id="settingsError" role="status" class="wide"></div><button class="primary wide" onclick="applySettings()">설정 적용</button></div>`);}
function applySettings(){const names=$('namesInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),excluded=$('excludeNames').value.split(/[,，\n]+/).map(x=>x.trim()).filter(Boolean);if(names.length>60||names.some(n=>n.length>30)||new Set(names).size!==names.length||excluded.some(n=>!names.includes(n))||(names.length&&new Set(excluded).size===names.length)){ $('settingsError').textContent='이름은 중복 없이 60명까지, 이름당 30자 이내로 입력하세요. 제외 이름은 명단에 있어야 하며 참여자는 한 명 이상 남겨 주세요.';return;}s.students=names.map(n=>{let id=Object.keys(s.names).find(id=>s.names[id]===n);if(!id){id=s.nextId++;s.names[id]=n;}return Number(id);});s.excluded=s.students.filter(id=>excluded.includes(nameOf(id)));s.drawn=[];if(!eligible().includes(s.active))s.active=null;s.sound=$('soundInput').checked;s.music=$('musicInput').checked;s.volume=Number($('volumeInput').value)/100;save();closeModal();render();if(s.music)startMusic();else stopMusic();toast('이름과 소리 설정을 적용했습니다.');}
function timeText(t){t=Math.max(0,Math.floor(t||0));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function updateClock(){$('clock').textContent=library?'경과 00:00':'경과 '+timeText(s.elapsed);$('pause').disabled=library||s.stage===6;$('pause').textContent=s.running?'시계 멈춤':'시계 시작';}
function toggleTimer(){if(library||s.stage===6)return;s.running=!s.running;lastTick=Date.now();save();updateClock();}
function discussion(){let started=Date.now();showModal('전체회의 · 걸린 시간을 확인하세요',`<div class="timerbadge" id="discussionClock">00:00</div><p style="text-align:center">“우리가 아는 사실 / 더 필요한 증거”<br>각자 하나씩 말해 봅시다.</p><p class="muted small" style="margin-top:18px;text-align:center">권장 30초 · 경과 시간은 계속 올라갑니다. 닫으면 토론 시계를 끝냅니다.</p>`);discussionInterval=setInterval(()=>{if($('discussionClock'))$('discussionClock').textContent=timeText((Date.now()-started)/1000);},250);}
let musicTimer=null,musicMaster=null,musicNodes=new Set(),musicPlaying=false,musicBar=0;
function musicUI(){$('musicBtn').textContent=musicPlaying?'♫ 음악 끄기':'♫ 음악 켜기';}
function previewVolume(v){$('volumeLabel').textContent=v+'%';if(musicMaster&&audioContext)musicMaster.gain.setTargetAtTime(Number(v)/100,audioContext.currentTime,.08);}
async function startMusic(){if(musicPlaying||!s.music||document.hidden)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();if(!s.music||document.hidden)return;if(musicPlaying)return;musicMaster=musicMaster||audioContext.createGain();musicMaster.disconnect();musicMaster.connect(audioContext.destination);musicMaster.gain.setValueAtTime(s.volume,audioContext.currentTime);musicPlaying=true;musicPhrase();musicUI();}catch(e){toast('음악 켜기를 다시 눌러 주세요.');}}
function note(freq,t,duration,gain,type='sine'){const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(musicMaster);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.start(t);o.stop(t+duration+.05);musicNodes.add(o);o.onended=()=>{musicNodes.delete(o);o.disconnect();g.disconnect();};}
function musicPhrase(){if(!musicPlaying)return;const chords=[[146.83,174.61,220],[130.81,164.81,196],[116.54,146.83,174.61],[110,138.59,164.81]],c=chords[musicBar++%4],t=audioContext.currentTime+.1;note(c[0]/2,t,6.4,.10,'sine');c.forEach(f=>note(f,t,6.4,.035,'triangle'));[0,2,1,2,0,1,2,1].forEach((i,j)=>note(c[i]*2,t+j*.8,1.25,.035));musicTimer=setTimeout(musicPhrase,6400);}
function stopMusic(){musicPlaying=false;clearTimeout(musicTimer);musicTimer=null;for(const o of musicNodes){try{o.stop();}catch(e){}}musicNodes.clear();musicUI();}
function toggleMusic(){s.music=!musicPlaying;save();if(s.music)startMusic();else stopMusic();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(s.music)startMusic();});
function teacherGuide(){if(currentCase===1&&!library){c1_teacherGuide();$('modalBody').innerHTML=$('modalBody').innerHTML.replace('18분 시계는 권장 시간이며 초과해도 계속 진행됩니다.','시계는 0부터 올라가는 경과 시간입니다.').replace('학생 번호','학생 이름');return;}showModal('교사용 진행 안내',`<div class="stack"><h2>사건 선택과 수업 진행</h2><p>열 때마다 사건 보관함에서 주제를 선택합니다. 두 사건의 진행·시간은 별도 저장되고 이름·점수는 공유됩니다. 명단을 등록하고 지원·무작위·지목 방식으로 이름을 선택하세요.</p><p>수사·토론 시계는 모두 0부터 올라갑니다. 사건을 바꾸면 수사 시계가 멈추며, 다시 열 때도 멈춘 상태입니다. 배경음악은 사건을 클릭한 뒤 재생하며 상단 버튼과 설정으로 제어합니다.</p><h3>CASE 002 해설</h3><p>접수 1분 → 탐색 4분 → 인터뷰 3분 → 중간 추리 2분 → 추가 증거 4분 → 판단·정리 4분. 선택형 답은 모두 두 번째, 원금은 49,000원입니다. 직접 증거는 거래 약속·송금 확인서·택배사 확인서·추가 대화와 해제 통지입니다.</p><p>이 사건은 성인 개인 간 일회성 매매입니다. 합의한 추가 7일이 충분했다는 사실을 명시했습니다. 모든 거래에 7일의 최고 기간이 정해진 것은 아닙니다. 반환 원금 외 이자·손해배상은 별도입니다. 사기죄나 실제 환급 완료를 확정하지 않습니다.</p><button onclick="sources()">공식 출처</button><button onclick="resetGate()">새 수업 시작</button></div>`);}
function sources(){if(currentCase===1&&!library)return c1_sources();showModal('CASE 002 · 공식 출처',`<p>확인일 2026. 9. 18. · 인물·기록·택배사는 창작입니다. 본문 요약은 오프라인으로 볼 수 있습니다. 아래 원문 링크만 인터넷이 필요합니다.</p><div class="lesson"><a target="_blank" rel="noopener" href="https://www.law.go.kr/법령/민법">국가법령정보센터 · 민법</a><p>제543조 해제 의사표시, 제544조 이행지체와 해제, 제548조 원상회복·반환 금전의 이자.</p></div><div class="lesson"><a target="_blank" rel="noopener" href="https://www.kca.go.kr/odr/pg/ma/pgProcssInfo.do">한국소비자원 · 피해구제 절차와 제외 대상</a><p>사업자와 소비자 사이의 분쟁을 다루는 절차와 개인 간 거래를 구별합니다.</p></div><div class="lesson"><a target="_blank" rel="noopener" href="https://usr.ecmc.or.kr/mediation/faq.do">전자문서·전자거래분쟁조정위원회 · 조정 안내</a><p>개인 간 전자거래 분쟁에 대해서도 조정을 신청할 수 있습니다. 신청만으로 환급을 보장하거나 강제집행하는 절차는 아닙니다.</p></div><div class="lesson"><a target="_blank" rel="noopener" href="https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률">전자상거래 등에서의 소비자보호에 관한 법률</a><p>사업자의 통신판매와 개인 간 거래를 구분해 청약철회 적용 여부를 검토합니다.</p></div>`);}

function render(){classroomBaseRender();document.body.classList.toggle('teacher-open',teacherOpen);document.documentElement.style.setProperty('--class-font',(s.classFont||32)+'px');if(!library){const done=s.participation||{};$('main').insertAdjacentHTML('afterbegin',`<section class="participation" aria-label="이 단계의 전원 참여 활동"><div class="row spread"><div><h3>모두 생각 → 전원 선택 → 짝 설명 → 함께 정리</h3><p>${safe(participationPrompts[currentCase][s.stage][0])}</p></div><button class="primary" onclick="openActivity()">${done[s.stage]?'활동 다시 열기':'전원 참여 시작'}</button></div><div class="row spread"><div class="activityDots">${steps.map((v,i)=>`<span title="${safe(v)}" class="${done[i]?'done':''}">${done[i]?'✓':i+1}</span>`).join('')}</div><span class="compactMeta">학급 활동 ${Object.keys(done).length}/7 · 교사 확인 기록</span></div></section>`);if(s.stage===5)setupJudgment();}else{$('main').insertAdjacentHTML('afterbegin','<div class="hint mobileHelp">교실 큰 화면 모드 · 증거는 한 장씩, 판단은 한 문항씩 봅니다. 이름과 점수는 상단 ‘교사 도구’에서 열 수 있습니다.</div>');}const t=$('teacherTools');if(t)t.setAttribute('aria-expanded',String(teacherOpen));}

function plain(el){return el.innerHTML.replace(/<br\s*\/?\s*>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/[ \t]+/g,' ').trim();}
function splitText(text,limit=105){const parts=[];let t=text.trim();while(t.length>limit){let at=Math.max(t.lastIndexOf('\n',limit),t.lastIndexOf('. ',limit),t.lastIndexOf('。',limit));if(at<limit*.35)at=t.lastIndexOf(' ',limit);if(at<limit*.35)at=limit;parts.push(t.slice(0,at+1).trim());t=t.slice(at+1).trim();}if(t)parts.push(t);return parts;}
function docPages(html){const box=document.createElement('div');box.innerHTML=html;const result=[];let heading='기록 살펴보기';for(const node of box.children){if(/^H[123]$/.test(node.tagName)){heading=node.textContent;continue;}if(node.tagName==='HR'||node.tagName==='SVG'||node.classList.contains('eyebrow'))continue;if(node.tagName==='TABLE'){const rows=[...node.rows];let labels=[];if(rows[0]&&[...rows[0].cells].every(c=>c.tagName==='TH')){labels=[...rows.shift().cells].map(c=>c.textContent);}for(const row of rows){let txt=[...row.cells].map((c,i)=>labels[i]?labels[i]+' · '+plain(c):plain(c)).join('\n');for(const str of splitText(txt))result.push({heading,text:str});}}else for(const str of splitText(plain(node)))result.push({heading,text:str});}return result;}
function openReader(title,pages,raw=''){reader={title,pages:pages.length?pages:[{heading:title,text:'자료를 확인하세요.'}],index:0,raw};showModal(title,'');$('modal').classList.add('reader-dialog');paintReader();}

// Activity stopwatch: elapsed time increases; each new phase starts paused.
let activityClock={elapsed:0,started:0,running:false,phase:''};
function activitySeconds(){return Math.floor((activityClock.elapsed+(activityClock.running?Date.now()-activityClock.started:0))/1000);}
function pauseActivityClock(){if(activityClock.running){activityClock.elapsed+=Date.now()-activityClock.started;activityClock.running=false;}updateActivityClock();}
function toggleActivityClock(){if(activityClock.running)pauseActivityClock();else{activityClock.started=Date.now();activityClock.running=true;}updateActivityClock();}
function resetActivityClock(){activityClock.elapsed=0;activityClock.started=Date.now();activityClock.running=false;updateActivityClock();}
function updateActivityClock(){const el=document.getElementById('activityElapsed');if(!el)return;const sec=activitySeconds();el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');document.getElementById('activityClockToggle').textContent=activityClock.running?'일시정지':'시작 / 계속';const hint=document.getElementById('activityClockHint');hint.textContent=activity.phase===2?(sec>=40?'두 사람 모두 설명했나요?':sec>=20?'역할을 바꾸어 설명하세요':'첫 번째 친구가 설명하세요'):'걸린 시간 · 위로 세는 타이머';}
const activityPaintWithoutClock=paintActivity;
paintActivity=function(){const key=activity.caseId+':'+activity.stage+':'+activity.phase;if(activityClock.phase!==key){pauseActivityClock();activityClock={elapsed:0,started:0,running:false,phase:key};}activityPaintWithoutClock();document.querySelector('#modalBody .readerFooter').insertAdjacentHTML('beforebegin','<div class="activityClock" aria-label="활동 경과 시간"><strong id="activityElapsed">00:00</strong><button id="activityClockToggle" onclick="toggleActivityClock()">시작 / 계속</button><button onclick="resetActivityClock()">다시 0초</button><span id="activityClockHint"></span></div>');updateActivityClock();};

openActivity=function(){pauseActivityClock();activityClock.phase='';activityOpenWithoutClock();};

3:{title:'임무 2 · 사장의 설명을 믿어도 될까?',goal:'주장과 사실을 구별하고, 다음에 요청할 증거를 정하세요.',tasks:['계약서와 익명 글의 충돌 찾기','사진에서 확인되는 사실 말하기','사장에게 추가로 물을 질문 만들기','“아직 ___을 확인해야 합니다.”'],ids:['photo','post'],q:'실제로 어떤 돈을 빼거나 빠뜨렸는지 확인하려면?',options:['컵 사진만 다시 보면 충분하다.','익명 글에 추천이 많은지 확인한다.','급여 원장과 공제에 관한 대화를 요청한다.'],answer:2,feedback:'사진은 파손 흔적입니다. 실제 급여 계산과 당사자의 의사를 보여 주는 기록이 더 필요합니다.'},

// One elapsed stopwatch per case; never count time while the page is closed.
let roleTimer={elapsed:0,start:0,running:false},roleTimerOwner=null;
function roleTimerSync(){if(roleTimerOwner===s)return;roleTimerOwner=s;const elapsed=Number(s.discussionElapsedMs);roleTimer={elapsed:Number.isFinite(elapsed)&&elapsed>=0?elapsed:0,start:0,running:false};}
function roleMillis(){roleTimerSync();return roleTimer.elapsed+(roleTimer.running?Math.max(0,Date.now()-roleTimer.start):0);}
function roleSeconds(){return Math.floor(roleMillis()/1000);}
const saveBeforeDiscussionTimer=save;
save=function(){if(roleTimerOwner===s)s.discussionElapsedMs=roleMillis();saveBeforeDiscussionTimer();};
function pauseRoleTimer(){roleTimerSync();if(roleTimer.running){roleTimer.elapsed=roleMillis();roleTimer.running=false;save();}roleTimerPaint();}
function roleTimerToggle(){roleTimerSync();if(roleTimer.running)pauseRoleTimer();else{roleTimer.running=true;roleTimer.start=Date.now();save();}roleTimerPaint();}
function roleTimerReset(){roleTimerOwner=s;roleTimer={elapsed:0,start:0,running:false};s.discussionElapsedMs=0;save();roleTimerPaint();}
function roleTimerPaint(){roleTimerSync();if(!$('roleTime'))return;$('roleTime').textContent=timeText(roleSeconds());$('roleTimerButton').textContent=roleTimer.running?'일시정지':'팀 토론 시작 / 계속';$('roleTimerButton').setAttribute('aria-pressed',String(roleTimer.running));$('roleTimerHint').textContent=roleTimer.running?'토론 경과 시간 · 각자 확인한 근거를 차례로 말해 주세요.':'시간은 늘어납니다. 시작 / 계속을 눌러 토론 시간을 재세요.';}
setInterval(()=>{roleTimerSync();if(!roleTimer.running)return;const r=s.roleCase;if(library||!r||r.step<2||r.step>5||r.rounds?.[5]?.revealed)pauseRoleTimer();else roleTimerPaint();},250);
window.addEventListener('pagehide',()=>{if(roleTimerOwner===s)save();});

function roleClock(){return `<div class="roleClock"><strong id="roleTime">00:00</strong><button id="roleTimerButton" onclick="roleTimerToggle()">팀 토론 시작 / 계속</button><button onclick="roleTimerReset()">0초로</button><span id="roleTimerHint">약속 탐정부터 20초씩</span></div>`;}
function roleCall(pass=false){const r=roleState();if(!roleTeamValid()){toast('팀 명단을 다시 배정해 주세요.');return;}const candidates=r.teams.flatMap((t,i)=>roleNames.map((_,j)=>({team:i,role:j,id:roleMember(t,j)})));const min=Math.min(...candidates.map(c=>r.calls[c.id]||0));const pool=candidates.filter(c=>(r.calls[c.id]||0)===min),pick=pool[Math.floor(Math.random()*pool.length)];r.calls[pick.id]=(r.calls[pick.id]||0)+1;r.called=pick;s.active=pick.id;save();render();}
function roleCredit(){const r=roleState();if(!r.called)return;const key=r.step+':'+r.called.id;if(r.contributions[key]){toast('이 임무의 기여를 이미 기록했습니다.');return;}r.contributions[key]=true;s.active=r.called.id;award(1);save();render();}
function roleDiscussion(){const r=roleState();return `<section class="panel"><h3>모든 팀이 준비 → 네 역할이 한 문장씩</h3><p>연결 탐정은 다른 역할의 설명을 들은 뒤 결론을 말합니다. 작은 팀은 한 사람이 두 역할을 맡아도 됩니다.</p>${roleClock()}<div class="row"><button onclick="roleCall()">준비 후 발표 팀·역할 뽑기</button><button onclick="roleCall(true)">패스 · 다른 탐정</button><button onclick="showRoleTeams()">우리 팀 역할 보기</button></div>${r.called?`<div class="roleCall">${r.called.team+1}팀 · ${roleNames[r.called.role]} · ${safe(nameOf(r.called.id))}<p>“제가 찾은 근거는 ___입니다.” 팀원 도움을 받아도 좋아요.</p><button onclick="roleCredit()">근거·질문·수정 기여 +1</button></div>`:''}<p class="small">모든 팀은 동시에 손가락으로 선택합니다. 아직 모르겠으면 손바닥을 펴세요. 교사는 이유를 듣고 아래에 반의 답을 기록합니다.</p></section>`;}
function showRoleTeams(){showModal('우리 팀 역할',roleAssignments());}
function roleCheck(){const r=roleState(),m=roleMissionData[r.step];if(r.choices[r.step]!==m.answer){$('roleFeedback').textContent=m.feedback+' 감점 없이 다시 선택하세요.';return;}if(!m.ids.every(id=>r.read.includes(id))||(r.step===3&&!(r.witnesses||[]).includes('boss'))||(r.step===4&&!r.manual)){ $('roleFeedback').textContent='이번 임무의 자료와 필수 인터뷰·수첩을 먼저 확인하세요.';return;}r.done[r.step]=true;save();render();}
function roleMission(){const r=roleState(),m=roleMissionData[r.step];return `<div class="eyebrow">CASE 001 / ${r.step-1}번째 수사 임무 · 약 4분</div><h1>${m.title}</h1><p class="roleGoal">${m.goal}</p><div class="roleJobs">${m.tasks.map((t,i)=>`<div><b>${roleNames[i]}</b><p>${t}</p></div>`).join('')}</div><div class="cards roleEvidence">${m.ids.map(id=>`<button onclick="roleOpenEvidence('${id}')">${r.read.includes(id)?'✓ ':''}${roleEvidence[id].title}</button>`).join('')}</div>${r.step===3?`<div class="row"><button onclick="roleWitness('boss')">필수 · 사장에게 질문</button><button onclick="roleWitness('haneul')">하늘에게 질문</button><button onclick="roleWitness('coworker')">동료에게 질문</button></div>`:''}${r.step===4?'<button onclick="roleManual()">필수 · 노동권 수첩으로 검증</button>':''}${roleDiscussion()}<section class="panel"><h3>${m.q}</h3>${m.options.map((o,i)=>`<label class="option"><input type="radio" name="roleChoice" value="${i}" ${r.choices[r.step]===i?'checked':''} onchange="roleState().choices[roleState().step]=${i};save()">${i+1}. ${o}</label>`).join('')}<button onclick="roleCheck()">근거와 함께 확인</button><p id="roleFeedback" role="status">${r.done[r.step]?'임무 확인 완료. 다른 팀은 같은 근거를 골랐나요?':''}</p></section>${roleFacts()}<div class="nextbar"><span>빠른 팀의 추가 질문: 이 자료만으로 아직 알 수 없는 것은?</span><button class="primary" ${r.done[r.step]?'':'disabled'} onclick="roleGo(${r.step+1})">${r.step===4?'하늘에게 답장 쓰기 →':'다음 임무 →'}</button></div>`;}
function roleOpenEvidence(id){const r=roleState(),d=roleEvidence[id];if(!d||r.step<d.mission)return;const c=clues.find(c=>c.id===id);openReader(c.title,d.pages.map(([heading,text])=>({heading,text})),c.text);reader.roleEvidence=id;paintReader();}
const readerBeforeRole=paintReader;
paintReader=function(){readerBeforeRole();if(reader&&reader.roleEvidence&&reader.index===reader.pages.length-1){$('modalBody').insertAdjacentHTML('beforeend',`<button class="primary" onclick="roleRecord('${reader.roleEvidence}')">각자 근거를 찾았어요 · 발견 사실에 기록</button>`);}if(reader&&reader.roleManual&&reader.index===reader.pages.length-1)$('modalBody').insertAdjacentHTML('beforeend','<button class="primary" onclick="roleState().manual=true;save();closeModal();render()">조건을 사건과 대조했어요</button>');};
function roleRecord(id){const r=roleState();if(!r.read.includes(id))r.read.push(id);if(!s.found.includes(id))s.found.push(id);save();closeModal();render();}
function roleWitness(id){const data={boss:['사장','“하늘이 컵을 깬 건 사실이에요. 학생이 잠깐 일한 건데 쉬는 날 임금까지 줘야 하나요?”','주장 중 기록이나 법적 근거로 확인할 것은 무엇인가요?'],haneul:['하늘','“약속한 날은 다 출근했어요. 컵을 깬 일은 있지만, 급여 계산을 자세히 설명받고 싶어요.”','하늘의 기억을 어떤 기록과 대조할까요?'],coworker:['동료','“하늘은 매일 30분 자유롭게 쉬었어요. 저는 같은 일을 주 5일, 하루 8시간 해요.”','휴게시간과 다른 직원의 근무일 수는 어떤 계산에 필요할까요?']};const [name,quote,q]=data[id];const r=roleState();r.witnesses=r.witnesses||[];if(!r.witnesses.includes(id))r.witnesses.push(id);save();openReader(name+' 인터뷰',[{heading:'반론 탐정이 질문합니다',text:quote},{heading:'팀에서 확인할 질문',text:q+'\n“그 말씀을 확인하려면 ___이 필요합니다.”'}]);}
function roleManual(){openReader('노동권 수첩 · 이번 사건에 적용하기',[
{heading:'① 약정 시급은 기준 이상일까?',text:'2026년 최저임금은 10,320원. 하늘의 약정은 10,500원.\n청소년에게도 적용됩니다. 이 사건에는 수습 약정이 없습니다.'},
{heading:'② 쉬는 날 임금의 조건',text:'주 소정근로시간 15시간 이상·그 주 약속한 날 개근 여부를 봅니다.\n하늘은 매주 20시간·개근·일요일까지 고용 유지. 세 주를 각각 확인하세요.'},
{heading:'③ 이 사건의 주휴 유급시간',text:'같은 일을 하는 통상근로자는 주 5일 근무.\n하늘은 주 20시간 ÷ 5일 = 주휴 유급시간 4시간.\n4시간 × 약정 시급 × 3주로 계산합니다.'},
{heading:'④ 실수와 임금 지급을 구별',text:'임금은 원칙적으로 전액 지급합니다.\n이 사건에는 컵값 공제 동의나 법령·단체협약 근거가 없습니다.\n손해배상 책임은 임금 일방 공제와 별도로 판단합니다.'}],lawText);reader.roleManual=true;paintReader();}
function roleReply(){const r=roleState(),f=r.reply;return `<div class="eyebrow">마지막 임무 / 하늘이 설명할 수 있게 도와주세요 · 약 3분</div><h1>하늘에게 보내는 수사 답장</h1><p class="roleGoal">각 팀은 핵심 증거 두 개와 그 이유를 말하세요. 교사는 반의 답장을 기록합니다.</p><p>약속 탐정: 계약 조건 확인 → 기록 탐정: 누락·차감 확인 → 반론 탐정: 실수 책임과 구별 → 연결 탐정: 답장 읽기</p><section class="panel"><h3>1. 무엇이 문제였나요?</h3>${['시급 자체가 2026년 최저임금보다 낮았다.','주휴수당이 빠지고, 동의 없이 컵값이 공제되었다.','컵을 깼으므로 더 받을 임금은 없다.'].map((v,i)=>`<label class="option"><input type="radio" name="replyConclusion" value="${i}" ${f.conclusion===i?'checked':''} onchange="roleState().reply.conclusion=${i};save()">${v}</label>`).join('')}<h3>2. 누락·일방 공제를 직접 보여 주는 증거 두 개</h3><p class="small">계약서·출퇴근 기록으로 자격을 확인한 뒤, 사장의 실제 처리와 공제 의사를 입증하는 두 기록을 고르세요.</p>${r.read.map(id=>`<label class="option"><input type="checkbox" name="replyEvidence" value="${id}" ${(f.evidence||[]).includes(id)?'checked':''} onchange="roleReplyEvidence(this)">${safe(clues.find(c=>c.id===id).title)}</label>`).join('')}<h3>3. 추가로 지급할 임금 · 법정 공제 전</h3><button onclick="roleCalculation()">계산 도움 · 근거부터 확인</button><label class="roleAmount">금액 (원)<input id="roleAmount" type="number" min="0" value="${safe(f.amount||'')}" oninput="roleState().reply.amount=this.value;save()"></label><h3>4. 증거를 연결하는 한 문장</h3><p class="small">“___ 기록에는 ___, ___ 기록에는 ___이라고 나와 있어.”</p><textarea id="roleReason" maxlength="500" oninput="roleState().reply.reason=this.value;save()" placeholder="팀의 설명을 교사가 짧게 적어 주세요.">${safe(f.reason||'')}</textarea><label class="option"><input id="roleReviewed" type="checkbox" ${f.reviewed?'checked':''} onchange="roleState().reply.reviewed=this.checked;save()">교사 확인: 각 팀이 역할별 근거를 나누고, 답장의 설명을 함께 검토했습니다.</label><p id="replyFeedback" role="status"></p><button class="primary" onclick="roleSubmitReply()">답장 완성 · 사건 종결 →</button></section>${roleFacts()}`;}
function roleReplyEvidence(el){const f=roleState().reply;let a=f.evidence||[];if(el.checked&&a.length>=2){el.checked=false;toast('핵심 기록 두 개를 선택하세요.');return;}f.evidence=el.checked?[...a,el.value]:a.filter(id=>id!==el.value);save();}
function roleCalculation(){openReader('계산 도움 · 숫자의 출처를 설명하세요',[{heading:'기본급은 계약서와 출퇴근 기록으로',text:'4시간 × 15일 × 10,500원 = 630,000원.\n사장의 원장에도 기본급은 같은 금액입니다.'},{heading:'주휴수당과 차액',text:'주휴: (20시간 ÷ 5일) × 10,500원 × 3주 = 126,000원.\n총 756,000원 − 지급 인정 600,000원 = 156,000원.\n컵값 30,000원을 다시 더하면 이중 계산입니다.'}]);}
function roleSubmitReply(){const r=roleState(),f=r.reply;let error='';if(![2,3,4].every(n=>r.done[n]))error='세 임무를 먼저 확인하세요.';else if(f.conclusion!==1)error='수첩의 시급 기준과 원장의 누락·차감 항목을 비교하세요.';else if((f.evidence||[]).length!==2||!['pay','chat'].every(id=>f.evidence.includes(id)))error='원장은 누락·차감 내역을, 문자는 공제에 관한 의사를 보여 줍니다. 두 기록을 다시 연결하세요.';else if(Number(f.amount)!==156000)error='계산 도움에서 총 임금과 지급 인정액을 비교하세요.';else if(!(f.reason||'').trim()||!f.reviewed)error='팀의 근거 설명을 적고 교사가 함께 검토한 뒤 확인해 주세요.';if(error){$('replyFeedback').textContent=error+' 감점 없이 고칠 수 있습니다.';return;}r.solved=true;s.running=false;roleGo(6);chime();}
function roleClosed(){const f=roleState().reply;return `<div class="ribbon">CASE CLOSED</div><h1>하늘이 말할 근거가 생겼습니다.</h1><section class="paper"><h3>하늘에게</h3><p>계약서와 출퇴근 기록을 확인했어. 세 주의 주휴수당이 빠졌고, 컵값이 동의 없이 임금에서 공제되었어.</p><p>우리가 고른 핵심 기록은 <b>급여 정산 원장과 사장과의 문자</b>야.</p><p>${safe(f.reason)}</p><p>추가로 지급할 임금은 법정 공제 전 <b>156,000원</b>이야. 컵 파손의 손해배상 문제는 별도로 판단해야 해.</p></section><p class="roleGoal">하늘: “이제 무엇을 근거로 정산을 요청할지 알겠어요.”</p><p>게임 속 답장을 완성했습니다. 실제 메시지를 전송하거나 실제 환급이 이루어진 것은 아닙니다.</p><div class="roleJobs"><div><b>약속 탐정</b><p>계약을 기록으로 남긴다.</p></div><div><b>기록 탐정</b><p>실제 근무와 지급을 비교한다.</p></div><div><b>반론 탐정</b><p>주장과 증거, 책임과 권리를 구별한다.</p></div><div><b>연결 탐정</b><p>근거를 묶어 권리를 설명한다.</p></div></div><div class="row"><button onclick="classify()">일반·결정적·함정 단서의 정체</button><button onclick="showLessons()">노동권 개념 정리</button><button onclick="sources()">공식 출처</button><button onclick="exportScores()">기여 점수 저장</button><button class="primary" onclick="selectCase(2,false)">CASE 002로 →</button></div>`;}
const renderBeforeRole=render;
render=function(){if(library||currentCase!==1){renderBeforeRole();return;}const r=roleState();renderAside();document.body.classList.toggle('teacher-open',teacherOpen);document.documentElement.style.setProperty('--class-font',(s.classFont||32)+'px');$('caseLabel').textContent='/ CASE 001 · 역할 수사';document.title='사회탐정사무소 · CASE 001 역할 수사';$('nav').innerHTML=roleSteps.map((name,i)=>`<button ${i>r.step?'disabled':''} onclick="roleGo(${i})" class="${i===r.step?'active':''}">${name}</button>`).join('');let body='';if(r.step===0)body=`<div class="eyebrow">CASE 001 / 역할로 함께 푸는 사건 · 15~20분 목표</div><h1>사라진 아르바이트비</h1><section class="paper roleLetter"><h2>하늘의 의뢰</h2><p>“세 주 동안 약속한 날은 다 일했어요. 그런데 급여 계산이 이상해요.”</p><p>“사장님께 무엇이 잘못됐는지 설명할 수 있도록, <b>증거를 찾아 답장을 써 주세요.</b>”</p></section><p class="roleGoal">우리의 목표: 약속 확인 → 의심과 질문 → 새 증거로 검증 → 근거 있는 답장</p><button class="primary" onclick="roleGo(1)">의뢰 수락 · 탐정팀 만들기 →</button>`;else if(r.step===1)body=`<h1>우리 팀에서 내가 맡을 일</h1><p>명단을 가까이 앉은 순서대로 넣으면 4명씩 팀이 됩니다. 이름 대신 별명도 가능합니다.</p><div class="row"><button onclick="settings()">학생 이름 등록·수정</button><button onclick="roleAllocate(false)">명단 순서로 팀 배정</button><button onclick="roleAllocate(true)">무작위로 팀 배정</button></div><div class="roleJobs">${roleNames.map((n,i)=>`<div><b>${n}</b><p>${roleDescriptions[i]}</p></div>`).join('')}</div><p class="small">1~3명 남는 팀은 역할을 겸합니다. 결석자는 이름 설정에서 제외하세요. 역할은 성적·성격과 관계없이 배정됩니다.</p>${roleAssignments()}<button class="primary" ${roleTeamValid()?'':'disabled'} onclick="roleGo(2)">내 역할 확인 · 임무 1 시작 →</button>`;else if(r.step<=4)body=roleMission();else if(r.step===5)body=roleReply();else body=r.solved?roleClosed():'<p>답장을 완성한 뒤 사건을 종결하세요.</p><button onclick="roleGo(5)">답장으로</button>';$('main').innerHTML='<div class="roleCase">'+body+'</div>';storageLabel();updateClock();musicUI();roleTimerPaint();};

const guideBeforeRole=teacherGuide;
teacherGuide=function(){if(library||currentCase!==1)return guideBeforeRole();showModal('CASE 001 · 역할 수사 진행 안내','<h2>역할을 맡아 하늘의 답장을 완성합니다</h2><p>명단은 가까이 앉은 순서로 입력하고 4인 팀을 배정하세요. 남는 팀은 역할을 겸하며, 결석자는 설정에서 제외합니다. 팀을 새로 배정하면 발표 호출·기여 중복 확인 기록은 다시 시작합니다.</p><p>접수·배정 2분 → 임무 1, 2, 3 각 4분 → 답장·정리 4분을 목표로 합니다. 자료를 열기 전에 역할별 임무를 읽어 주세요. 모든 팀이 준비한 뒤 발표 팀과 역할을 뽑습니다.</p><p>네 역할이 20초씩 설명합니다. 빠른 팀은 자료만으로 알 수 없는 점을 찾습니다. 점수는 정답 외에도 근거·질문·생각 수정에 줍니다. 패스에는 감점이 없습니다.</p><p>임무 확인 답: 1번, 3번, 2번. 마지막 답장: 주휴수당 누락·컵값 일방 공제 / 급여 정산 원장과 문자 / 법정 공제 전 156,000원. 설명 문장은 자동 의미 채점하지 않으며 교사가 검토합니다.</p><p>기존 사건 1의 예전 수사 기록이 있어도 새 역할 수사는 의뢰부터 시작합니다. 이름·기존 점수와 사건 2는 유지됩니다. 초기화 버튼은 기존 범위대로 작동합니다.</p><button onclick="sources()">공식 출처</button>');};
// Group reasoning: teacher records spoken/paper answers and judges evidence.
function groupData(){const r=roleState();if(!r.groups)r.groups=(r.teams||[]).map((_,i)=>(i+1)+'모둠');if(!r.rounds)r.rounds={};return r;}
function groupRound(){const r=groupData();if(!r.rounds[r.step])r.rounds[r.step]={answers:{},revealed:false,winners:{},reason:''};return r.rounds[r.step];}
let groupSelected=0;
function groupHasAnswers(){return Object.values(groupData().rounds).some(x=>Object.keys(x.answers||{}).length);}
function setupGroups(){const r=groupData();showModal('기존 모둠 그대로 참여',`<h2>자리를 옮기지 않아도 됩니다</h2><p>모둠 이름을 한 줄에 하나씩 적어 주세요. 학생 이름 입력 없이 시작할 수 있습니다. 역할은 모둠 안에서 정합니다.</p><label>참여 모둠 (1~15개)<textarea id="groupNames" style="width:100%;min-height:180px;font-size:28px">${safe((r.groups.length?r.groups:['1모둠','2모둠','3모둠','4모둠','5모둠','6모둠']).join('\n'))}</textarea></label><p id="groupError" role="status"></p><button class="primary" onclick="applyGroups()">이 모둠으로 참여</button>`);}
function applyGroups(){const names=$('groupNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),r=groupData();if(!names.length||names.length>15||new Set(names).size!==names.length||names.some(x=>x.length>30)){$('groupError').textContent='서로 다른 모둠 이름을 1~15개, 이름당 30자 이내로 입력하세요.';return;}if(groupHasAnswers()&&JSON.stringify(names)!==JSON.stringify(r.groups)){$('groupError').textContent='제출 기록이 있어 모둠 구성을 바꿀 수 없습니다. 새 학급은 초기화의 새 수업 시작을 이용하세요.';return;}r.groups=names;r.groupMode=true;save();closeModal();render();}
const validBeforeGroups=roleTeamValid;
roleTeamValid=function(){return roleState().groupMode?groupData().groups.length>0:validBeforeGroups();};
const allocateBeforeGroups=roleAllocate;
roleAllocate=function(shuffle){if(groupHasAnswers()){toast('답안 기록을 보호하기 위해 이번 수업의 모둠은 유지합니다.');return;}roleState().groupMode=false;allocateBeforeGroups(shuffle);roleState().groups=roleState().teams.map((_,i)=>(i+1)+'모둠');save();render();};
const assignmentsBeforeGroups=roleAssignments;
roleAssignments=function(){if(!roleState().groupMode)return assignmentsBeforeGroups();return `<div class="roleTeams">${groupData().groups.map(name=>`<section class="panel"><h3>${safe(name)}</h3><p>약속·기록·반론·연결 탐정은 모둠 안에서 정하세요. 한 사람이 역할을 겸해도 됩니다.</p></section>`).join('')}</div>`;};
roleDiscussion=function(){return `<section class="panel"><h3>모둠마다 답 하나 + 근거 하나</h3><p>각자 찾은 것을 말한 뒤 모둠의 답을 정하세요. 먼저 모두 종이나 공책에 적고, 교사가 모둠별 답을 입력합니다.</p>${roleClock()}<button onclick="showRoleTeams()">모둠·역할 보기</button><p class="small">다른 모둠 발표 전에 답을 확정하세요. 입력 화면은 프로젝터에 보이므로 종이 답안을 먼저 받으면 서로 따라 쓰는 것을 줄일 수 있습니다.</p></section>`;};
function groupAnswerUI(){const r=groupData(),q=groupRound();if(!r.groups.length)return '<button onclick="setupGroups()">참여 모둠 등록</button>';groupSelected=Math.min(groupSelected,r.groups.length-1);const a=q.answers[groupSelected]||{};const count=r.groups.filter((_,i)=>q.answers[i]?.submitted).length;const prompt=r.step===5?'하늘에게 어떤 결론과 금액을 설명할까요? 핵심 증거도 함께 적으세요.':roleMissionData[r.step].q;return `<section class="panel groupAnswers"><h2>모둠별 추리 제출</h2><p>${prompt}</p><p class="small">제출 ${count}/${r.groups.length} · 교사가 받아 적는 답안입니다. 학생 기기로 전송하지 않습니다.</p>${!q.revealed?`<div class="row">${r.groups.map((n,i)=>`<button onclick="groupSelected=${i};render();document.querySelector('.groupAnswers').scrollIntoView()" ${i===groupSelected?'aria-current="true"':''}>${safe(n)} ${q.answers[i]?.submitted?'✓':''}</button>`).join('')}</div><h3>${safe(r.groups[groupSelected])}의 추리</h3><label>우리 모둠의 답<textarea id="groupAnswer" maxlength="500" ${a.submitted?'readonly':''} oninput="groupDraft('answer',this.value)">${safe(a.answer||'')}</textarea></label><label>그렇게 생각한 증거와 이유<textarea id="groupEvidence" maxlength="700" ${a.submitted?'readonly':''} oninput="groupDraft('evidence',this.value)">${safe(a.evidence||'')}</textarea></label><div class="row">${a.submitted?'<button onclick="groupUnsubmit()">발표 전 답안 수정</button>':'<button class="primary" onclick="groupSubmit()">이 모둠 답 제출</button><button onclick="groupPass()">이번 모둠은 판단 보류</button>'}<button class="primary" ${count===r.groups.length?'':'disabled'} onclick="groupReveal()">모든 모둠 답 함께 공개</button></div><p id="groupInputError" role="status"></p>`:`<p class="roleGoal">누가 가장 타당하게 추론했나요?</p><p>교사 판단 기준: ① 사실과 맞는가 ② 증거가 결론을 뒷받침하는가 ③ 다른 가능성도 검토했는가. 정답만 맞힌 것보다 설명을 함께 비교하세요.</p><div class="groupCompare">${r.groups.map((name,i)=>{const x=q.answers[i];return `<article class="paper"><h3>${safe(name)} ${q.winners[i]?'🍬':''}</h3><p><b>답</b> ${safe(x.answer)}</p><p><b>근거</b> ${safe(x.evidence)}</p><button onclick="groupWinner(${i})">${q.winners[i]?'선정 취소':'우수 추론 모둠 · 사탕 1개'}</button></article>`;}).join('')}</div><label>선정 이유 · 교사가 한 문장으로 피드백<textarea maxlength="500" oninput="groupRound().reason=this.value;save()">${safe(q.reason||'')}</textarea></label><p class="small">동점은 여러 모둠을 선정할 수 있습니다. 자동 채점이 아니며, 사탕은 선정된 모둠당 1개로 기록합니다. 실제 지급은 교사가 합니다. 적절한 답이 없으면 선정하지 않아도 됩니다.</p>`}</section>`;}
function groupDraft(k,v){const q=groupRound();if(q.revealed||q.answers[groupSelected]?.submitted)return;q.answers[groupSelected]=q.answers[groupSelected]||{};q.answers[groupSelected][k]=v;save();}
function groupSubmit(){const q=groupRound(),a=q.answers[groupSelected]||{};if(!(a.answer||'').trim()||!(a.evidence||'').trim()){$('groupInputError').textContent='답과 근거를 모두 적어 주세요. 아직 어렵다면 판단 보류를 선택해도 됩니다.';return;}a.submitted=true;q.answers[groupSelected]=a;save();render();document.querySelector('.groupAnswers').scrollIntoView();}
function groupUnsubmit(){const q=groupRound();if(q.revealed)return;q.answers[groupSelected].submitted=false;save();render();document.querySelector('.groupAnswers').scrollIntoView();}
function groupPass(){const q=groupRound();if(q.revealed)return;q.answers[groupSelected]={answer:'판단 보류',evidence:'다른 모둠의 근거를 듣고 생각을 정리하겠습니다.',submitted:true};save();render();document.querySelector('.groupAnswers').scrollIntoView();}
function groupReveal(){const r=groupData(),q=groupRound();if(!r.groups.every((_,i)=>q.answers[i]?.submitted))return;q.revealed=true;save();render();document.querySelector('.groupAnswers').scrollIntoView();}
function groupWinner(i){const r=groupData(),q=groupRound();if(!q.revealed||!r.groups[i])return;if(q.winners[i])delete q.winners[i];else q.winners[i]=true;save();render();document.querySelector('.groupAnswers').scrollIntoView();}
function groupTotals(){const r=groupData();return `<section class="panel"><h3>모둠별 사탕 기록</h3>${r.groups.map((n,i)=>`<p>${safe(n)} · 🍬 ${Object.values(r.rounds).filter(q=>q.winners[i]).length}개</p>`).join('')}<p class="small">임무·답장별 우수 추론 선정 횟수입니다. 개인 점수와 별도로 저장됩니다.</p></section>`;}
const missionBeforeGroups=roleMission;
roleMission=function(){let html=missionBeforeGroups();const marker='<section class="panel"><h3>'+roleMissionData[roleState().step].q+'</h3>';html=html.replace(marker,groupAnswerUI()+marker);if(!groupRound().revealed){const start=html.indexOf(marker),end=html.indexOf('</section>',start)+10;if(start>=0)html=html.slice(0,start)+'<p class="hint">모든 모둠의 추리를 공개한 뒤 반의 결론을 확인합니다.</p>'+html.slice(end);}return html;};
const replyBeforeGroups=roleReply;
roleReply=function(){return groupAnswerUI()+(groupRound().revealed?replyBeforeGroups():'<p class="hint">모둠별 최종 답장을 먼저 제출하세요. 함께 공개한 뒤 하늘에게 보낼 반의 답장을 완성합니다.</p>');};
const closedBeforeGroups=roleClosed;
roleClosed=function(){return closedBeforeGroups()+groupTotals();};
const renderBeforeGroups=render;
render=function(){renderBeforeGroups();if(library||currentCase!==1)return;const r=groupData();if(r.step===1){document.querySelector('.roleCase').insertAdjacentHTML('afterbegin','<section class="panel"><h2>지금 앉아 있는 모둠 그대로!</h2><p>친구들과 만든 모둠을 유지하고 이름만 등록하세요. 기존 명단 배정 기능도 아래에서 사용할 수 있습니다.</p><button class="primary" onclick="setupGroups()">기존 모둠 이름 등록 · 명단 없이 시작</button></section>');}if(r.step>=2&&r.step<=5)document.querySelector('.roleCase').insertAdjacentHTML('beforeend',groupTotals());};
const guideBeforeGroup=teacherGuide;
teacherGuide=function(){guideBeforeGroup();if(currentCase===1&&!library)$('modalBody').insertAdjacentHTML('afterbegin','<div class="hint"><h2>새 운영 방식 · 모둠별 추리와 사탕</h2><p>기존 모둠 이름만 등록하거나 기존 명단 배정을 이용하세요. 모두 종이에 답을 먼저 확정한 뒤 교사가 모둠별 답·근거를 입력합니다. 전원 제출 후 함께 공개하고 근거의 타당성을 비교합니다. 우수 추론 모둠 버튼으로 모둠당 사탕 1개를 기록하며 동점도 가능합니다. 판정은 교사가 하고, 적절한 답이 없으면 선정하지 않습니다. 선정 취소로 잘못 기록한 사탕을 되돌릴 수 있습니다.</p></div>');};
// Shared group-only setup; migrate existing group labels, never student names.
if(!s.classGroups?.length){const old=db.cases[1]?.roleCase?.groups;if(old?.length)s.classGroups=[...old];}
function classroomGroups(){return s.classGroups||[];}
function lockedGroups(){const states=[s.roleCase,...Object.values(db.cases).map(c=>c.roleCase)];return states.some(r=>Object.values(r?.rounds||{}).some(q=>Object.keys(q.answers||{}).length));}
groupData=function(){const r=roleState();r.groups=[...classroomGroups()];r.groupMode=true;r.rounds=r.rounds||{};return r;};
roleTeamValid=function(){return classroomGroups().length>0;};
roleAssignments=function(){return `<div class="roleTeams">${classroomGroups().map(name=>`<section class="panel"><h3>${safe(name)}</h3><p>약속·기록·반론·연결 탐정은 모둠 안에서 정하세요. 역할을 겸해도 됩니다.</p></section>`).join('')}</div>`;};
settings=function(){showModal('모둠 이름 · 소리 설정',`<h2>함께 앉은 모둠 이름을 등록하세요</h2><p>한 줄에 한 모둠씩, 최대 15모둠. 역할은 모둠 안에서 정합니다.</p><label>모둠 이름<textarea id="groupNames" style="width:100%;min-height:180px;font-size:28px">${safe(classroomGroups().join('\n'))}</textarea></label><div class="row"><label><input type="checkbox" id="soundInput" ${s.sound?'checked':''}>보상 효과음</label><label><input type="checkbox" id="musicInput" ${s.music?'checked':''}>배경음악</label></div><label>음량 <input id="volumeInput" type="range" min="0" max="50" value="${Math.round(s.volume*100)}" oninput="previewVolume(this.value)"><span id="volumeLabel">${Math.round(s.volume*100)}%</span></label><p id="settingsError" role="status"></p><button class="primary" onclick="applySettings()">모둠 설정 저장</button>`);};
setupGroups=function(){settings();};
applySettings=function(){const names=$('groupNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!names.length||names.length>15||new Set(names).size!==names.length||names.some(x=>x.length>30)){$('settingsError').textContent='서로 다른 모둠 이름을 1~15개, 이름당 30자 이내로 입력하세요.';return;}const changed=JSON.stringify(names)!==JSON.stringify(classroomGroups());if(changed&&(lockedGroups()||Object.values(s.groupCandies||{}).some(n=>n>0))){$('settingsError').textContent='답안·사탕 기록이 있어 모둠 변경을 잠갔습니다. 새 수업 시작으로 기록을 초기화한 뒤 변경하세요.';return;}s.classGroups=names;s.sound=$('soundInput').checked;s.music=$('musicInput').checked;s.volume=Number($('volumeInput').value)/100;if(changed){s.groupCalls={};s.activeGroup=null;}save();closeModal();render();if(s.music)startMusic();else stopMusic();};
const oldNameOf=nameOf;
nameOf=function(id){return typeof id==='string'&&id.startsWith('g:')?classroomGroups()[Number(id.slice(2))]||'모둠':oldNameOf(id);};
function groupChoose(){const names=classroomGroups();if(!names.length){toast('모둠 이름을 먼저 등록하세요.');return null;}s.groupCalls=s.groupCalls||{};const min=Math.min(...names.map((_,i)=>s.groupCalls[i]||0));const pool=names.map((_,i)=>i).filter(i=>(s.groupCalls[i]||0)===min);const i=pool[Math.floor(Math.random()*pool.length)];s.groupCalls[i]=(s.groupCalls[i]||0)+1;s.activeGroup=i;save();return i;}
function drawGroup(){const i=groupChoose();renderAside();if(i!==null)toast(classroomGroups()[i]+' 발표 차례');}

function groupExtraAward(){if(!Number.isInteger(s.activeGroup)||!classroomGroups()[s.activeGroup]){toast('먼저 모둠을 선택하세요.');return;}s.groupCandies=s.groupCandies||{};s.groupAwardHistory=s.groupAwardHistory||[];s.groupCandies[s.activeGroup]=(s.groupCandies[s.activeGroup]||0)+1;s.groupAwardHistory.push(s.activeGroup);save();renderAside();toast(classroomGroups()[s.activeGroup]+' 사탕 1개 기록');}
function groupExtraUndo(){const i=(s.groupAwardHistory||[]).pop();if(i===undefined)return;s.groupCandies[i]=Math.max(0,(s.groupCandies[i]||0)-1);save();renderAside();}
function totalGroupCandy(i){const states={...db.cases};if(!library)states[currentCase]={...states[currentCase],roleCase:s.roleCase};return (s.groupCandies?.[i]||0)+Object.values(states).reduce((sum,c)=>sum+Object.values(c.roleCase?.rounds||{}).filter(q=>q.winners?.[i]).length,0);}
renderAside=function(){$('aside').innerHTML=`<h3>모둠 운영</h3><button onclick="settings()">모둠 이름 · 소리 설정</button><label>발표·보상 모둠<select id="activeGroup" onchange="s.activeGroup=this.value===''?null:Number(this.value);save()"><option value="">모둠 선택</option>${classroomGroups().map((n,i)=>`<option value="${i}" ${s.activeGroup===i?'selected':''}>${safe(n)}</option>`).join('')}</select></label><button onclick="drawGroup()">발표 모둠 뽑기</button><div class="row"><button onclick="groupExtraAward()">추가 사탕 +1</button><button onclick="groupExtraUndo()">추가 보상 취소</button></div><p class="small">각 사건의 우수 추론 보상은 답안 비교 화면에서 기록합니다. 여기는 별도 추가 보상입니다.</p>${classroomGroups().map((n,i)=>`<p>${safe(n)} · 🍬 ${totalGroupCandy(i)}</p>`).join('')}<button onclick="exportScores()">모둠 사탕 기록 저장</button>`;};
award=function(){groupExtraAward();};undoScore=function(){groupExtraUndo();};
exportScores=function(){const cell=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const rows=['모둠,사탕 기록',...classroomGroups().map((n,i)=>cell(n)+','+totalGroupCandy(i))];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='사회탐정사무소_모둠사탕.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const libBeforeOnlyGroups=libraryView;
libraryView=function(){return libBeforeOnlyGroups().replace('탐정 이름과 점수는 함께 이어집니다.','모둠 이름은 두 사건에서 함께 사용합니다.').replace('학생 이름 등록','모둠 이름 등록').replace('으로 우리 반 명단을 넣어 주세요. 이름이 없어도 수사는 진행할 수 있습니다.','으로 참여할 모둠을 넣어 주세요.').replaceAll('학생 이름 등록','모둠 이름 등록');};
const renderBeforeOnlyGroups=render;
render=function(){renderBeforeOnlyGroups();if(!library&&currentCase===1&&roleState().step===1){document.querySelector('.roleCase').innerHTML=`<h1>모둠 이름을 등록하고 시작하세요</h1><p>친구들과 앉은 모둠을 그대로 유지합니다. 역할은 모둠 안에서 나누세요.</p><button class="primary" onclick="settings()">모둠 이름 등록·수정</button><div class="roleJobs">${roleNames.map((n,i)=>`<div><b>${n}</b><p>${roleDescriptions[i]}</p></div>`).join('')}</div>${roleAssignments()}<button class="primary" ${roleTeamValid()?'':'disabled'} onclick="roleGo(2)">모둠 확인 · 임무 1 시작 →</button>`;}if(library){const h=$('main').querySelector('.mobileHelp');if(h)h.textContent='모둠 이름을 등록한 뒤 사건을 선택하세요. 교사 도구에서 모둠별 사탕 기록을 관리합니다.';}document.querySelectorAll('#main button').forEach(b=>{if(/탐정단 설정/.test(b.textContent))b.textContent='모둠 설정';if(/탐정 점수 저장/.test(b.textContent))b.textContent='모둠 사탕 기록 저장';});};

teacherGuide=function(){showModal('모둠 수사 · 교사 안내',`<h2>모둠 이름만 등록합니다</h2><p>모둠 이름을 한 줄에 하나씩 등록하세요. 두 사건에서 함께 사용합니다. 역할은 모둠 안에서 나눕니다.</p><p>사건 1은 세 임무에서 각 모둠이 답과 근거를 종이에 먼저 정한 뒤 교사가 입력합니다. 모두 제출한 뒤 함께 비교하고 우수 추론 모둠에 사탕을 기록합니다. 동점 선정·선정 취소를 지원합니다.</p><p>사건 2는 기존 전체 참여 활동을 유지하고 발표 도우미는 모둠 단위로 뽑습니다. 교사 도구에서 추가 사탕을 기록할 수 있습니다.</p><p>답안 또는 사탕 기록이 있는 동안 모둠 변경은 잠깁니다. 새 학급은 ‘새 수업 시작’으로 기록을 초기화한 뒤 모둠을 수정하세요.</p><button onclick="sources()">공식 출처</button>`);};

let batchQuestions=[
'① 실제로 일한 시간은 하루 몇 시간, 3주 합계 몇 시간인가요?',
'② 약정 시급은 2026년 기준에 맞나요? 비교한 숫자를 쓰세요.',
