];
function batchDossier(){return `<div class="batchDossier"><h2>CASE 001 · 사건 자료 전체</h2><p>하늘(만 17세)은 3주 동안 카페에서 일했습니다. 급여 지급 인정액은 600,000원입니다. 무엇이 잘못됐는지 설명할 수 있도록 자료를 비교하세요.</p><p class="small">인물·자료는 수업용 창작입니다. 금액은 모두 세금·사회보험 등 법정 공제 전 기준입니다.</p><div class="batchGrid">${[
['A · 근로계약서','기간: 2026.7.6.~7.26. / 월~금 16:00~20:30. 매일 18:00~18:30 자유로운 무급 휴게. 약정 시급 10,500원. 주휴수당은 요건 충족 시 별도 지급. 일요일 주휴일, 토요일 무급 휴무. 수습 약정 없음.'],
['B · 출퇴근 기록','3주 동안 월~금 15일 모두 출근. 약속한 시간대로 일했고 결근·지각·조퇴·추가 근무 없음. 매일 30분 자유롭게 휴게. 각 주 일요일인 7/12·7/19·7/26까지 근로관계 유지. 주말에는 일하지 않음.'],
['C · 가게 운영표','상시 근로자 6명. 하늘과 같은 일을 하는 통상근로자는 주 5일, 하루 8시간 근무. 하늘은 직원 지시에 따라 음료 제조와 매장 정리 업무를 수행.'],
['D · 현장 사진과 메모','깨진 컵 세 개와 교체 비용 30,000원 메모. 사진만으로 누가, 왜 컵을 깼는지, 임금 공제에 동의했는지는 알 수 없음.'],
['E · 익명 게시글','“학생 알바는 적게 받아도 되고, 잠깐 일하면 쉬는 날 돈은 없는 것 아닌가?” 작성자 익명, 근거 링크 없음. 사실로 확인된 내용은 아님.'],
['F · 급여 정산 원장','7/13: 기본급 210,000원, 주휴 0원, 지급 인정 210,000원.\n7/20: 기본급 210,000원, 주휴 0원, 지급 인정 210,000원.\n7/27: 기본급 210,000원, 주휴 0원, 컵값 차감 30,000원, 지급 인정 180,000원.\n합계 지급 인정 600,000원. 다른 차감·선지급 없음.'],
['G · 사장과 하늘의 문자','사장: “컵값 3만 원 뺐어. 주휴는 정직원만 주는 거야.”\n하늘: “컵을 깬 것은 맞지만 월급에서 빼는 데 동의한 적은 없어요. 계약서에는 주휴를 따로 준다고 쓰여 있어요.”\n별도 자유로운 상계 동의, 법령 또는 단체협약상 공제 근거 없음.'],
['H · 증인 진술','하늘: “약속한 날은 다 출근했어요.”\n사장: “학생이 잠깐 일했는데 쉬는 날 임금까지 줘야 하나요?”\n동료: “하늘은 매일 30분 자유롭게 쉬었어요. 저는 같은 일을 주 5일, 하루 8시간 해요.”\n말은 기록과 대조해 확인하세요.']
].map(([h,p])=>`<article><h3>${h}</h3><p>${safe(p)}</p></article>`).join('')}</div><section class="batchLaw"><h3>함께 보는 노동권 수첩</h3><p>2026년 최저임금은 시간당 10,320원이며 청소년에게도 적용됩니다.</p><p>주휴수당은 4주 평균(4주 미만이면 그 기간)의 1주 소정근로시간 15시간 이상인지, 그 주 약속한 근로일에 개근했는지 확인합니다. 이 사건은 매주 주휴일까지 고용이 유지된 조건입니다.</p><p>통상근로자가 주 5일 일하고 매주 근무시간이 같은 이 사건에서는 주휴 유급시간 = 주 소정근로시간 ÷ 5. 여기에 약정 시급과 해당 주 수를 곱합니다.</p><p>임금은 원칙적으로 전액 지급합니다. 컵 파손의 손해배상 책임과 임금의 일방 공제는 별도로 판단합니다. 법령·단체협약 등 공제 근거와 공제에 대한 의사를 확인하세요.</p><p class="small">근거: 최저임금위원회 2026 적용액, 근로기준법 제18·43·55조, 시행령 제9조·별표2·제30조. 원문은 게임의 공식 출처에서 확인할 수 있습니다.</p></section><section class="batchQuestions"><h3>모둠이 함께 답할 질문 전체</h3>${batchQuestions.map(q=>`<p>${q}</p>`).join('')}<p><b>답만 쓰지 말고, 자료 A~H 중 어떤 기록을 근거로 삼았는지 함께 설명하세요.</b></p></section></div>`;}

function batchSolution(){const q=groupRound();if(!q.revealed)return;roleState().batchSolution=true;save();showModal('함께 확인하는 해설',`<h2>각 모둠의 근거와 비교해 보세요</h2><p>① 하루 실제 근로 4시간, 15일 합계 60시간입니다. 4시간 30분에서 자유로운 휴게 30분을 제외합니다.</p><p>② 약정 10,500원은 2026년 최저임금 10,320원 이상입니다.</p><p>③ 매주 약정 20시간·개근·주휴일까지 고용 유지 조건입니다. 주휴수당은 (20 ÷ 5) × 10,500 × 3 = 126,000원입니다.</p><p>④ 파손을 인정한 것과 임금 공제에 동의한 것은 다릅니다. 이 사건의 일방 공제는 타당하지 않으며 손해배상 책임은 별도로 판단합니다.</p><p>⑤ 기본급 630,000 + 주휴수당 126,000 − 지급 인정액 600,000 = <b>156,000원</b>입니다. 컵값을 한 번 더 더하지 않습니다.</p><p>계약서·출퇴근 기록·운영표로 조건과 시간을, 급여 원장·문자로 누락과 공제 의사를 입증합니다. 사진과 익명 글만으로는 결론을 내릴 수 없습니다.</p><p>교사는 숫자뿐 아니라 근거 연결과 다른 가능성을 검토한 설명도 비교해 우수 추론 모둠을 선정합니다.</p><button onclick="closeModal();render()">답안 비교로 돌아가기</button>`);}

const c3Evidence=sceneEvidenceBody;sceneEvidenceBody=function(id){if(currentCase!==3)return c3Evidence(id);if(id==='handbook')return `<section class="sceneHandbook">${caseThree.lawText}</section>`;if(id==='witness')return '<div class="tapeEvidence"><h2>매점 담당자의 진술</h2><p>“물건이 평소보다 적게 왔어요. 그런데 축제 때문에 찾는 학생은 더 많았어요. 동아리 예약도 정상 판매로 기록했습니다.”</p><p>“가격은 매입가가 바뀐 것을 확인하고 조정했어요. 장부와 가격표를 함께 봐 주세요.”</p><p class="small">수업용 진술입니다. 설명이 맞는지 다른 기록으로 확인하세요.</p></div>';return `<div class="sceneDocument">${caseThree.clues.find(c=>c.id===id).text}</div>`;};
const c3Library=libraryView;libraryView=function(){const box=document.createElement('div');box.innerHTML=c3Library();const st=db.cases[3];box.querySelector('.cards').insertAdjacentHTML('beforeend',`<article class="casecard"><div class="eyebrow">CASE 003 / 세 가지 수사 미션</div><h2>사라진 매점 과자</h2><div class="tags"><span class="tag">수요·공급·가격</span><span class="tag">15~20분</span></div><p>매점 진열대는 텅 비고 가격표도 바뀌었는데, 과자에는 무슨 일이 있었을까요?</p><div class="row"><button class="primary" onclick="selectCase(3,false)">${st?'이어 열기':'사건 열기'} →</button>${st?'<button onclick="freshGate(3)">처음부터</button>':''}</div>${st?`<p class="small">저장된 위치: ${st.roleCase?.step===6?'사건 종결':st.roleCase?.step===5?'모둠 답안':st.roleCase?.step>=2?'현장·증거':'의뢰·준비'} · 경과 ${timeText(st.elapsed)}</p>`:''}</article>`);return box.innerHTML.replaceAll('두 사건','모든 사건');};

const c3Matches=[['supply','팔 수 있는 양이 평소보다 줄었다.'],['demand','구매 요청이 평소보다 늘었다.'],['margin','판매가 인상이 봉지당 단순 차액을 늘린 것은 아니다.']];

function c3Draft(){const q=groupRound();return q.answers[groupSelected]||(q.answers[groupSelected]={order:['','','',''],numbers:{},matches:{},submitted:false});}
function c3Edit(type,key,value){const q=groupRound();if(q.revealed)return;const a=c3Draft();if(a.submitted)return;if(type==='order')a.order[Number(key)]=value;else a[type][key]=value;save();}
function c3Score(a){if(a.pass)return {order:0,numbers:0,matches:0,total:0};const order=['B','D','C','A'].filter((x,i)=>a.order?.[i]===x).length;const numbers=Object.entries({available:36,left:0,short:12}).filter(([k,v])=>String(a.numbers?.[k]??'').trim()!==''&&Number(a.numbers[k])===v).length;const matches=Object.entries({supply:'P',demand:'Q',margin:'R'}).filter(([k,v])=>a.matches?.[k]===v).length;return {order,numbers,matches,total:order+numbers+matches};}
function c3Select(type,key,value,options,disabled){return `<select aria-label="${key}" onchange="c3Edit('${type}','${key}',this.value)" ${disabled?'disabled':''}><option value="">선택하세요</option>${options.map(([v,t])=>`<option value="${v}" ${value===v?'selected':''}>${v} · ${t}</option>`).join('')}</select>`;}
function c3Inputs(a){if(c3Tab===0)return `<h2>미션 1 · 사건 파일 복구 / 4점</h2><p>네 사건을 먼저 일어난 순서대로 놓으세요. 같은 카드는 한 번만 사용합니다.</p><div class="roleJobs">${c3Events.map(([v,t])=>`<div><b>${v}</b><p>${t}</p></div>`).join('')}</div>${[0,1,2,3].map(i=>`<label>${i+1}번째 ${c3Select('order',i,a.order?.[i],c3Events,a.submitted)}</label>`).join('')}`;if(c3Tab===1)return `<h2>미션 2 · 재고 장부 복구 / 3점</h2><p>주문량 대신 실제 입고량을 사용하세요. 모든 수량은 봉지 단위입니다.</p>${[['available','오늘 판매 가능한 총수량'],['left','기록된 판매를 뺀 뒤 남을 수량'],['short','오늘 구매 요청 중 충족하지 못한 수량']].map(([k,t])=>`<label>${t}<input type="number" min="0" step="1" aria-label="${k}" value="${safe(a.numbers?.[k]??'')}" ${a.submitted?'readonly':''} oninput="c3Edit('numbers','${k}',this.value)"></label>`).join('')}<p class="small">계산식은 종이 학습지에 적어 주세요. 화면에서는 수량만 채점합니다.</p>`;return `<h2>미션 3 · 주장과 증거 연결 / 3점</h2><p>각 주장을 직접 뒷받침하는 자료 묶음을 하나씩 고르세요.</p>${c3Matches.map(([k,t])=>`<label>${t}${c3Select('matches',k,a.matches?.[k],c3Options,a.submitted)}</label>`).join('')}`;}
function c3Submit(pass=false){const a=c3Draft();if(groupRound().revealed)return;if(pass){a.pass=true;a.submitted=true;}else{if(new Set(a.order).size!==4||a.order.some(x=>!['A','B','C','D'].includes(x))||!['available','left','short'].every(k=>String(a.numbers[k]??'').trim()!==''&&Number.isInteger(Number(a.numbers[k]))&&Number(a.numbers[k])>=0)||!c3Matches.every(([k])=>['P','Q','R','S'].includes(a.matches[k]))){$('c3Error').textContent='세 미션을 모두 완성하세요. 순서 카드는 중복 없이, 수량은 0 이상의 정수로 입력합니다.';return;}delete a.pass;a.submitted=true;}save();render();}
function c3Reveal(){const q=groupRound();if(!classroomGroups().every((_,i)=>q.answers[i]?.submitted))return;q.revealed=true;save();render();}
function c3Unsubmit(){const q=groupRound();if(q.revealed)return;q.answers[groupSelected].submitted=false;delete q.answers[groupSelected].pass;save();render();}
function c3Reward(){const q=groupRound();if(!q.revealed||q.rewarded)return;const scores=classroomGroups().map((_,i)=>c3Score(q.answers[i]).total);const max=Math.max(...scores);if(max>0)scores.forEach((score,i)=>{if(score===max)q.winners[i]=true;});q.rewarded=true;save();render();}
function c3Answers(){const names=classroomGroups(),q=groupRound();if(!names.length)return '<button onclick="settings()">모둠 이름 등록</button>';groupSelected=Math.min(groupSelected,names.length-1);if(q.revealed)return `<h1>수사 결과 · 자동 채점</h1><p>순서 4점 + 재고 3점 + 증거 연결 3점 = 10점. 속도·말솜씨는 채점하지 않습니다.</p><div class="groupCompare">${names.map((n,i)=>{const a=q.answers[i],v=c3Score(a);return `<article class="paper"><h2>${safe(n)} · ${v.total}/10 ${q.winners[i]?'🍬':''}</h2><p>${a.pass?'판단 보류':`순서: ${safe(a.order.join(' → '))}<br>재고: ${safe(a.numbers.available)} / ${safe(a.numbers.left)} / ${safe(a.numbers.short)}<br>연결: ${safe(a.matches.supply)} / ${safe(a.matches.demand)} / ${safe(a.matches.margin)}`}</p><p>순서 ${v.order}/4 · 재고 ${v.numbers}/3 · 연결 ${v.matches}/3</p></article>`;}).join('')}</div><div class="row"><button onclick="c3Solution()">세 미션 해설 보기</button><button ${q.rewarded?'disabled':''} onclick="c3Reward()">${q.rewarded?'사탕 기록 완료':'최고점 모둠 사탕 기록 · 동점 모두'}</button><button ${roleState().c3Explained?'':'disabled'} onclick="c3Close()">사건 종결 →</button></div><p class="small">전원 0점이면 사탕을 기록하지 않습니다. 같은 결과의 보상은 한 번만 기록됩니다.</p>`;
const a=c3Draft(),count=names.filter((_,i)=>q.answers[i]?.submitted).length;return `<h1>모둠의 세 미션 답안</h1><p>모든 모둠이 학습지에 먼저 확정한 뒤 교사가 입력합니다. 제출 전에는 정답·점수가 공개되지 않습니다.</p><div class="row">${names.map((n,i)=>`<button onclick="groupSelected=${i};render()">${safe(n)} ${q.answers[i]?.submitted?'✓':''}</button>`).join('')}</div><h2>${safe(names[groupSelected])} · 제출 ${count}/${names.length}</h2><div class="row">${['순서 복구','재고 계산','증거 연결'].map((t,i)=>`<button onclick="c3Tab=${i};render()" ${c3Tab===i?'aria-current="true"':''}>${i+1}. ${t}</button>`).join('')}</div><section class="panel">${c3Inputs(a)}</section><p id="c3Error" role="status"></p><div class="row">${a.submitted?'<button onclick="c3Unsubmit()">공개 전 답안 수정</button>':'<button onclick="c3Submit()">세 미션 한 번에 제출</button><button onclick="c3Submit(true)">이번 모둠은 판단 보류</button>'}<button ${count===names.length?'':'disabled'} onclick="c3Reveal()">전원 제출 · 결과 공개</button><button onclick="batchOpenDossier()">매점 다시 조사</button><button onclick="batchPrint()">모둠 답안 학습지 받기</button></div>${roleClock()}`;}
function c3Solution(){if(!groupRound().revealed)return;roleState().c3Explained=true;save();showModal('세 미션의 해설',`<h2>1. B → D → C → A</h2><p>9/21 16시 발주 → 17시 축제 안내 → 9/22 8시 납품 → 12시 15분 품절입니다.</p><h2>2. 36봉 / 0봉 / 12봉</h2><p>판매 가능: 이전 6 + 실제 입고 30 = 36봉.<br>남을 수량: 36 − 예약 판매 12 − 일반 판매 24 = 0봉.<br>요청 48봉 중 판매 36봉, 미충족 12봉입니다. 단말기 기록과 실사 재고가 맞으므로 기록상 사라진 물건은 없습니다.</p><h2>3. P / Q / R</h2><p>P: 실제 입고가 평소 60봉에서 30봉으로 줄었습니다.<br>Q: 축제 안내와 오늘 구매 요청 48봉(평소 24봉)을 연결합니다.<br>R: 1,000−700=300원, 1,200−900=300원. 봉지당 단순 차액은 같습니다. 전체 이익이나 순이익이 같다는 뜻은 아닙니다.</p><p>오늘의 품절은 줄어든 공급 가능량과 늘어난 구매 요청을 함께 봐야 설명됩니다. 동아리는 12봉을 정상 구매했으며, 소문만으로 사재기나 도난을 단정할 수 없습니다.</p><button onclick="closeModal();render()">결과로 돌아가기</button>`);}

const c3Render=render;render=function(){if(library||currentCase!==3)return c3Render();const r=roleState();renderAside();document.body.classList.toggle('teacher-open',teacherOpen);document.documentElement.style.setProperty('--class-font',(s.classFont||32)+'px');$('caseLabel').textContent='/ CASE 003 · 매점 수사';document.title='사회탐정사무소 · CASE 003';$('nav').innerHTML=[[0,'의뢰'],[1,'모둠'],[2,'매점·증거'],[5,'세 미션·결과'],[6,'사건 종결']].map(([n,t])=>`<button ${n>r.step?'disabled':''} onclick="roleGo(${n})">${t}</button>`).join('');let body='';if(r.step===0)body=`<div class="eyebrow">CASE 003 / 순서 복구 × 재고 계산 × 증거 연결 · 15~20분</div><h1>사라진 매점 과자</h1><section class="paper"><h2>학생회의 의뢰</h2><p>“축제 날 인기 과자가 점심 전에 동났어요. 가격도 올랐고, 누가 사재기했다는 소문이 돌아요.”</p><p>“누군가를 탓하기 전에, 기록을 보고 무슨 일이 있었는지 밝혀 주세요.”</p></section><p>세 미션은 총 10점. 모둠별 답안을 모두 제출하면 자동으로 채점합니다. 최고점 동점 모둠은 함께 사탕을 받습니다.</p><button onclick="roleGo(1)">의뢰 수락 · 모둠 준비 →</button>`;else if(r.step===1)body=`<h1>모둠에서 수사 역할을 나누세요</h1><button onclick="settings()">모둠 이름 등록·수정</button>${roleAssignments()}<p>모든 모둠은 같은 자료를 조사합니다. 학습지에 세 미션의 답을 함께 정리하세요.</p><button onclick="batchPrint()">모둠 답안 학습지 받기</button><button ${roleTeamValid()?'':'disabled'} onclick="roleGo(2)">모둠 확인 · 매점으로 →</button>`;else if(r.step<5)body=`<h1>빈 진열대 뒤의 기록을 찾아라</h1><p>모든 물건은 처음부터 조사할 수 있습니다. 순서와 수량, 가격 기록을 연결하세요.</p>${sceneMap()}<div class="row"><button onclick="sceneBoard()">증거 보드 · ${sceneSeen().length}/9</button><button onclick="c3MissionGuide()">세 미션 보기</button><button onclick="batchPrint()">모둠 답안 학습지 받기</button><button class="primary" onclick="roleGo(5)">모둠의 세 미션 답안 →</button></div>${roleClock()}`;else if(r.step===5)body=c3Answers();else body=r.solved?c3Closed():'<button onclick="roleGo(5)">미션으로 돌아가기</button>';$('main').innerHTML='<div class="roleCase">'+body+'</div>';storageLabel();updateClock();musicUI();roleTimerPaint();};

const c4Law=`<h2>지방자치 수첩</h2><div class="lesson"><h3>예산안은 누가 만들까?</h3><p>시장은 시의 집행기관을 이끌며 예산안을 편성해 시의회에 제출합니다. 공약 발표만으로 예산이 확정되지는 않습니다.</p><p class="small">지방자치법 제114·142조 / 이 사건은 보통의 시를 가정합니다.</p></div><div class="lesson"><h3>예산은 누가 확정할까?</h3><p>시의회는 예산안을 살펴보고 의결합니다. 시장 동의 없이 지출 항목의 금액을 늘리거나 새 비용 항목을 만들 수는 없습니다.</p><p class="small">지방자치법 제47·142조. 제안 금액과 확정 금액을 구별하세요.</p></div><div class="lesson"><h3>집행과 예산 변경</h3><p>시장은 소관 부서를 통해 사무를 집행합니다. 예산을 바꿀 필요가 있을 때는 추가경정예산안을 편성해 의회의 의결을 받는 절차가 있습니다.</p><p class="small">지방자치법 제116·145조. 확정 예산도 용도와 법령·계약 절차에 따라 집행해야 합니다.</p></div><div class="lesson"><h3>주민은 무엇을 확인할까?</h3><p>원하는 정책과 확인된 사실을 구별하세요. 계획을 보완하는 기관과 심의하는 기관에 각각 설명을 요청하고 의견을 낼 수 있습니다.</p><p class="small">수업에서는 공개 의견 제출을 가정합니다. 의회 청원 등 개별 제도의 요건은 별도입니다. 정책 찬반은 점수로 판정하지 않습니다.</p></div>`;

function c4Draft(){const q=groupRound();return q.answers[groupSelected]||(q.answers[groupSelected]={values:{},submitted:false});}
function c4Edit(k,v){const q=groupRound(),a=c4Draft();if(q.revealed||a.submitted)return;a.values[k]=v;save();}
function c4Score(a){return c4Tasks.map(t=>a?.pass?0:t.items.filter(([k,,,v])=>a?.values?.[k]===v).length);}
function c4Total(a){return c4Score(a).reduce((a,b)=>a+b,0);}
function c4OptionLabel(k,v){if(v==='?')return '아직 모르겠음';return c4Tasks.flatMap(t=>t.items).find(x=>x[0]===k)?.[2].find(x=>x[0]===v)?.[1]||'미입력';}
function c4Select(item,a){const [k,t,opts]=item;return `<label class="flowField">${t}<select aria-label="${k}" ${a.submitted?'disabled':''} onchange="c4Edit('${k}',this.value)"><option value="">선택하세요</option>${[...opts,['?','아직 모르겠음 (0점)']].map(([v,text])=>`<option value="${v}" ${a.values?.[k]===v?'selected':''}>${v} · ${text}</option>`).join('')}</select></label>`;}
function c4Submit(pass=false){const q=groupRound(),a=c4Draft();if(q.revealed||a.submitted)return;if(!pass&&!c4Tasks.flatMap(t=>t.items).every(([k,,opts])=>a.values[k]==='?'||opts.some(([v])=>v===a.values[k]))){$('c4Error').textContent='세 미션의 모든 항목을 선택하세요. 모르는 항목에는 ?를 선택해도 됩니다.';return;}a.pass=pass;a.submitted=true;save();render();}

function c4Reward(undo=false){const q=groupRound();if(!q.revealed)return;if(undo){q.winners={};q.rewarded=false;}else{if(q.rewarded)return;const scores=classroomGroups().map((_,i)=>c4Total(q.answers[i])),max=Math.max(...scores);if(max>0)scores.forEach((v,i)=>{if(v===max)q.winners[i]=true;});q.rewarded=true;}save();render();}
function c4Answers(){const names=classroomGroups(),q=groupRound();if(!names.length)return '<button onclick="settings()">모둠 이름 등록</button>';groupSelected=Math.min(groupSelected,names.length-1);if(q.revealed)return `<h1>결정의 경로를 찾았습니다</h1><p>기관 연결 3 + 보도 검증 3 + 중단 지점·요청 4 = 10점. 정책 찬반·말솜씨는 점수가 아닙니다.</p><div class="groupCompare">${names.map((n,i)=>{const a=q.answers[i],scores=c4Score(a);return `<article class="paper"><h2>${safe(n)} · ${c4Total(a)}/10 ${q.winners[i]?'🍬':''}</h2><p>기관 ${scores[0]}/3 · 검증 ${scores[1]}/3 · 다음 요청 ${scores[2]}/4</p>${a.pass?'<p>모둠 전체 판단 보류</p>':`<details><summary>제출한 답 보기</summary>${c4Tasks.flatMap(t=>t.items).map(([k,t])=>`<p>${t}<br><b>${safe(c4OptionLabel(k,a.values[k]))}</b></p>`).join('')}</details>`}</article>`;}).join('')}</div><div class="row"><button onclick="c4Solution()">기록과 해설 비교</button><button ${q.rewarded?'disabled':''} onclick="c4Reward()">${q.rewarded?'사탕 기록 완료':'최고점 모둠 사탕 기록 · 동점 모두'}</button>${q.rewarded?'<button onclick="c4Reward(true)">이번 사건 사탕 기록 취소</button>':''}<button ${roleState().c4Explained?'':'disabled'} onclick="c4Close()">사건 종결 →</button></div><p class="small">?는 해당 문항만 0점. 전원 0점이면 보상 없음. 다른 정당·기관에 대한 선호는 채점하지 않습니다.</p>`;
 const a=c4Draft(),count=names.filter((_,i)=>q.answers[i]?.submitted).length;return `<h1>우리 모둠의 수사 보고</h1><p>모든 모둠이 종이에 먼저 답을 확정한 뒤 교사가 입력합니다. 긴 설명은 학습지에 남깁니다.</p>${flowTurn()}<div class="row">${names.map((n,i)=>`<button onclick="groupSelected=${i};render()" ${i===groupSelected?'aria-current="true"':''}>${safe(n)} ${q.answers[i]?.submitted?'✓':''}</button>`).join('')}</div><h2>${safe(names[groupSelected])} · 제출 ${count}/${names.length}</h2><div class="row">${c4Tasks.map((t,i)=>`<button onclick="c4Tab=${i};render()" ${c4Tab===i?'aria-current="true"':''}>${i+1}. ${t.name}</button>`).join('')}</div><section class="panel"><h2>${c4Tasks[c4Tab].name}</h2><p class="small">${c4Tasks[c4Tab].note}</p>${c4Tasks[c4Tab].items.map(item=>c4Select(item,a)).join('')}</section><p id="c4Error" role="status"></p><div class="row">${a.submitted?'<button onclick="c4Unsubmit()">공개 전 답안 수정</button>':'<button class="primary" onclick="c4Submit()">세 미션 한 번에 제출</button><button onclick="c4Submit(true)">이번 모둠은 판단 보류</button>'}<button ${count===names.length?'':'disabled'} onclick="c4Reveal()">전원 제출 · 결과 공개</button><button onclick="batchOpenDossier()">기록실 다시 조사</button><button onclick="batchPrint()">모둠 답안 학습지 받기</button></div>${roleClock()}`;}

function c4Solution(){if(!groupRound().revealed)return;roleState().c4Explained=true;save();showModal('공약에서 집행까지 · 해설',`<h2>1. 기관 연결: M → C → M</h2><p>시장이 예산안을 편성·제출하고, 시의회가 심의·확정하며, 시장·시청이 확정 예산과 필요한 절차에 따라 집행합니다.</p><h2>2. 보도 검증: F / F / U</h2><p>B-1은 1억 8천만원의 제출안입니다. B-2의 확정액은 조사·설계 2천만원이며 공사·집기 비용은 0원입니다. 예산이 전부 0원은 아닙니다. 다음 의결 결과는 아직 알 수 없습니다.</p><h2>3. 중단 지점·요청: A / B / M / C</h2><p>회의록 C와 업무 메모 G를 연결하면 운영비·인력 및 접근성 계획을 보완 중이고 새 예산안은 아직 제출되지 않았습니다. F의 조사·설계 계약을 공사 착수로 읽으면 안 됩니다.</p><p>금액 변화는 B-1과 B-2를 직접 비교합니다. 시청에는 보완안·일정을, 시의회에는 심의 이유·기준을 설명해 달라고 요청할 수 있습니다.</p><div class="hint">보완안 준비 → 추가경정예산안 편성·제출 검토 → 시의회 심의·의결 → 확정 범위와 필요한 절차에 따른 집행. 보완했다고 통과가 보장되지는 않습니다.</div><p>시장과 의회는 각자의 결정에 설명할 책임이 있습니다. 누구의 정책이 더 좋은지는 근거를 갖춰 별도로 토론하세요.</p><button onclick="closeModal();render()">결과로 돌아가기</button>`);}

function c4Sources(){showModal('사건 4 · 공식 법령과 자료 범위','<h2>2026년 9월 22일 확인</h2><p>지방자치법 [시행 2026.7.1., 법률 제21447호]의 제47조(의회 의결), 제114·116조(단체장의 총괄·집행), 제142·145조(예산·추가경정예산)를 참고했습니다.</p><p><a href="https://www.law.go.kr/lsInfoP.do?lsiSeq=284005" target="_blank" rel="noopener">국가법령정보센터 · 지방자치법 원문</a> (인터넷 연결 시 열림)</p><p>수첩과 사건은 오프라인으로 읽을 수 있습니다. 이번 사건은 예산 역할에 초점을 둡니다. 실제 시설 설치·재산 관리·계약 등 다른 절차와 요건을 모두 재현한 것은 아닙니다.</p><p>예산표·회의록·이미지·의견은 수업용 창작입니다. 어떤 기관의 선의·악의나 정책 찬반은 자동 채점하지 않습니다.</p>');}

const c5Law=`<h2>A · 선거 전에 공지한 세 규칙</h2><div class="lesson"><h3>1 · 유효표와 무효표</h3><p>후보 한 명의 칸에만 표시한 표는 유효하며, 아무 표시가 없거나 두 명 이상에게 표시한 표는 무효입니다.</p></div><div class="lesson"><h3>2 · 첫 투표의 당선 조건</h3><p>유효표의 절반보다 많은 표를 받은 후보가 당선됩니다. 없으면 득표 상위 두 후보로 결선투표를 합니다.</p><p class="small">과반수는 정확히 절반이 아니라 절반을 넘는 수입니다. 무효표는 유효표 수에 포함하지 않습니다.</p></div><div class="lesson"><h3>3 · 결선의 당선 조건</h3><p>결선에서는 유효표를 더 많이 받은 후보가 당선됩니다. 동수면 결선을 다시 실시합니다.</p></div><div class="lesson"><h3>이 사건에 적용할 범위</h3><p>새봄고 전교생 600명이 선출하는 학생 대표 선거입니다. 실제 학교나 공직선거 규칙이 아닌, 이 가상 사건만의 자체 규칙입니다.</p><p class="small">9/14 전원에게 공지했고 선거 종료까지 변경되지 않았습니다. 중복 투표 없이 매 회 1인 1표입니다. 견본은 실제 집계에 더하지 않습니다.</p></div>`;

// Original offline score: 64 bars at 100 BPM = 153.6 seconds per full cycle.
const audioScore={bpm:100,bars:64,chords:[[60,64,67],[55,59,62],[57,60,64],[53,57,60],[60,64,67],[64,67,71],[53,57,60],[55,59,62]],motifs:[[0,2,1,2],[2,1,0,1],[1,2,3,2],[2,0,1,0]]};

note=function(freq,t,duration,gain,type='sine'){const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(musicMaster);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.start(t);o.stop(t+duration+.03);musicNodes.add(o);o.onended=()=>{musicNodes.delete(o);o.disconnect();g.disconnect();};};
function scoreBar(bar,t){const beat=60/audioScore.bpm,c=audioScore.chords[bar%8],section=Math.floor(bar/16),motif=audioScore.motifs[Math.floor(bar/4)%4];
 // Soft bass, two light chord strokes, and a sparse changing melody; no drums.
 note(hz(c[0]-12),t,1.35,.18);note(hz(c[0]-12),t+2*beat,.8,.10);
 c.forEach(n=>{note(hz(n),t+.5*beat,.65,.065,'triangle');note(hz(n),t+2.5*beat,.65,.048,'triangle');});
 if(bar%8!==7){const tones=[c[0]+12,c[1]+12,c[2]+12,c[0]+24];[0,1.5,3].forEach((pos,j)=>{if(section===2&&j===1)return;const index=motif[(j+section)%4];note(hz(tones[index]),t+pos*beat,.48+((bar+j)%3)*.1,.095,'sine');});}

}
