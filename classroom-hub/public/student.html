<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><title>유진T 클래스룸 · 학생</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="shell"><header class="topbar"><div class="brand"><div class="brandmark">YT</div><div><h1>유진T 클래스룸</h1><p>학생 활동</p></div></div></header><section class="hero"><div class="eyebrow">STUDENT</div><h2>오늘의 활동을 선택하세요</h2><p>선생님이 공개한 학습활동만 표시됩니다. 수행평가는 선생님의 안내에 따라 시작하세요.</p></section><div id="cards" class="student-grid"></div><div class="footer">유진T 클래스룸</div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('/api/public/activities').then(r=>r.json()).then(j=>{document.querySelector('#cards').innerHTML=(j.activities||[]).map(a=>`<a class="card student-card" href="${esc(a.stable_url)}"><div class="icon">${esc(a.icon)}</div><div><h3>${esc(a.name)}</h3><p>${esc(a.subject)} · ${esc(a.kind)}</p></div></a>`).join('')||'<div class="notice">현재 공개된 학생 활동이 없습니다.</div>';});</script></body></html>
