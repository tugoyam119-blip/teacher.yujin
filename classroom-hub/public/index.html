<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><title>유진T 클래스룸</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="login-wrap"><main class="login-card"><div class="brand"><div class="brandmark">YT</div><div><h1>유진T 클래스룸</h1><p>Teacher Deploy Hub · v3</p></div></div><h2>교사용 관리센터</h2><p>수업자료와 프로그램을 올리고, 패치하고, 학생 링크를 관리하는 선생님 전용 플랫폼입니다.</p><form id="login"><input id="pin" type="password" inputmode="numeric" placeholder="교사 PIN" autocomplete="current-password"><button class="btn">교사용 화면 열기</button></form><div style="height:9px"></div><a class="btn secondary" href="/student">학생용 활동 화면 보기</a><p id="msg" style="margin-top:12px;color:#b42318"></p></main></div><script>fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(x.teacher)location.href='/teacher'});document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.querySelector('#pin').value})}),j=await r.json();if(r.ok)location.href='/teacher';else document.querySelector('#msg').textContent=j.error||'로그인 실패';};</script></body></html>
