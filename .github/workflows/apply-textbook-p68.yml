name: Apply approved textbook page 68
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-textbook-p68.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-textbook-p68
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact approved explanation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'classroom-hub/apps/통합사회2-3단원-수업용-프로그램/index.html';
          const text = fs.readFileSync(path, 'utf8');
          const blob = s => { const b=Buffer.from(s);return crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex'); };
          if (blob(text) === 'd49f562721d4c6d64530dc77c5ffca5b73d7f631') process.exit(0);
          if (blob(text) !== 'c19e046c541b30d69496ac007cb195cf3390b4b1') throw Error('Source changed; refusing to overwrite');
          const marker="{t:1,k:'3-1 · 기본 개념',title:'자본주의는 무엇으로 움직일까?',body:`";
          const start=text.indexOf(marker)+marker.length;
          const end=text.indexOf('`,c:', start);
          if(start<marker.length||end<start)throw Error('Target missing');
          let next=text.slice(0,start)+"<p>자본주의는 사유 재산 제도를 바탕으로 시장에서 자유로운 경제활동을 보장하는 경제 체제이다. 자본주의는 일반적으로 다음과 같은 특징이 있다.</p><div class=\"board-grid\"><div class=\"board-card\"><b>첫째, 사유 재산권을 법적으로 보장한다.</b><p>이에 따라 개인이나 기업은 토지, 자본 등을 자유롭게 획득하고 사용할 수 있는 권리를 지닌다.</p></div><div class=\"board-card\"><b>둘째, 경제활동의 자유 및 사적 이익 추구가 인정된다.</b><p>경제활동에 참여하는 행위 주체는 자신의 이익을 추구하기 위한 경제활동을 자유롭게 할 수 있으며, 자신의 의사 결정에 따른 책임도 스스로 진다.</p></div><div class=\"board-card\"><b>셋째, 자유로운 경쟁을 바탕으로 하는 시장경제 체제와 결합한다.</b><p>대부분 경제활동은 시장을 통해 이루어지며 시장에서 다수의 참여자가 자유롭게 경쟁하는 과정에서 시장 가격이 결정되고 상품 거래가 이루어진다.</p></div></div>"+text.slice(end);
          const oldNote="p:['네 요소가 서로 연결되어 작동함을 설명합니다.','자유에는 선택의 결과에 대한 책임이 따릅니다.']";
          const newNote="p:['교과서 68쪽의 첫째·둘째·셋째 순서대로 설명합니다.','둘째 항목은 경제활동의 자유와 사적 이익 추구를 함께 다루며, 자신의 의사 결정에 따른 책임까지 연결합니다.']";
          if(!next.includes(oldNote))throw Error('Teacher note missing');
          next=next.replace(oldNote,newNote);
          if(blob(next)!=='d49f562721d4c6d64530dc77c5ffca5b73d7f631')throw Error('Output differs from approved preview');
          fs.writeFileSync(path,next);
          console.log('Verified: approved page 68 update; all other bytes unchanged');
          NODE
      - name: Commit only the lesson file
        run: |
          git add -- 'classroom-hub/apps/통합사회2-3단원-수업용-프로그램/index.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '통합사회2: 교과서 68쪽 특징과 설명을 원문 표현에 맞춤'
          git push origin HEAD:main
