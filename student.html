const resources=[
{id:'structure',title:'① 역사 구조와 엘리베이터 설치 원리',sub:'왜 어떤 역은 1대, 어떤 역은 3대가 필요한지 확인합니다.',img:V.structure,body:`<h3>지상에서 승강장까지 계단 없이 이어져야 합니다</h3><p>엘리베이터가 “한 대라도 있는가”보다 중요한 것은 지상 출입구에서 승강장까지 이동 경로가 끊기지 않는가입니다. 지상→대합실 구간만 연결되어 있고 대합실→승강장 구간이 계단이라면 휠체어 이용자는 여전히 승강장에 접근할 수 없습니다.</p><table class="dataTable"><tr><th>역 구조</th><th>1대 추정비</th><th>설명</th></tr><tr><td>얕고 단순한 역</td><td>8~9억</td><td>굴착 깊이와 설비 이전이 적음</td></tr><tr><td>일반 지하역</td><td>10억</td><td>대합실·승강장 연결 공사 포함</td></tr><tr><td>깊은 환승·대형역</td><td>12~13억</td><td>굴착·설비 이전·공사 난이도가 큼</td></tr></table>`},
{id:'usage',title:'② 후보역별 이용객·교통약자 수·비율',sub:'전체 이용객, 교통약자 추정 인원, 교통약자 추정 비율을 함께 비교합니다.',img:V.usage,body:`<h3>절대 수치와 비율은 다른 정보를 줍니다</h3><table class="dataTable"><tr><th>역</th><th>하루 이용객</th><th>교통약자 추정</th><th>추정 비율</th></tr>${stations.map(s=>`<tr><td>${s.name}</td><td>${num(s.riders)}</td><td>${num(s.mobility)}</td><td>${mobilityRate(s)}%</td></tr>`).join('')}</table><p>새봄중앙역은 전체 이용객이 가장 많고, 대학병원역은 교통약자 추정 인원이 가장 많습니다. 반면 복지센터역은 전체 이용객은 상대적으로 적지만 교통약자 추정 비율이 약 18.2%로 가장 높습니다.</p>`},
{id:'map',title:'③ 후보역 주변 시설과 이동 목적',sub:'복지관·병원·시장·학교 같은 주변 시설을 확인합니다.',img:V.map,body:`<h3>“몇 명이 이용하는가”뿐 아니라 “왜 이동하는가”도 중요합니다</h3><table class="dataTable"><tr><th>역</th><th>주요 시설</th><th>정책상 의미</th></tr><tr><td>복지센터역</td><td>장애인종합복지관 180m</td><td>반복적인 복지서비스 이용</td></tr><tr><td>대학병원역</td><td>대학병원 220m</td><td>치료·진료 목적의 필수 이동</td></tr><tr><td>전통시장역</td><td>시장 90m·노인복지관 350m</td><td>고령층의 생활 이동</td></tr><tr><td>새봄고역</td><td>고교 140m·특수학급 통학로</td><td>교육 접근성과 통학 안전</td></tr></table>`},
{id:'voices',title:'④ 시민 의견과 민원',sub:'위의 핵심 입장에 더해 실제 불편 경험과 정책에 바라는 조건을 확인합니다.',img:V.voices,body:`<h3>가상 시민 심층 인터뷰</h3><div class="notice" style="margin-bottom:12px">위 그림이 각 시민의 <b>핵심 입장</b>을 보여 준다면, 아래 인터뷰에서는 그 입장이 생긴 <b>구체적인 경험과 정책 결정에서 고려할 조건</b>을 확인할 수 있습니다.</div><div class="summaryBox"><b>휠체어 이용 시민</b><br>“복지센터역은 집에서 가장 가깝지만 계단 때문에 이용할 수 없어 두 정거장을 더 가서 엘리베이터가 있는 역을 이용한 뒤 택시를 타고 있습니다. 이동 시간이 20분 이상 더 걸리고 비가 오는 날에는 이동 자체가 어려울 때도 있습니다. 이용객 수뿐 아니라 <b>엘리베이터가 없을 때 이용할 수 있는 다른 이동 경로가 있는지</b>도 설치 순서를 정할 때 고려했으면 합니다.”</div><br><div class="summaryBox"><b>대학병원 이용 보호자</b><br>“진료 후 환자를 부축해 계단을 오르는 것이 생각보다 훨씬 위험합니다. 특히 휠체어나 보행 보조기구를 사용하는 환자에게는 계단 몇 칸도 큰 장애물이 될 수 있습니다. 병원과 가까운 역처럼 <b>노약자·환자의 이용 가능성이 높은 곳은 일반적인 이용객 수와 별도로 필요성을 판단</b>할 필요가 있다고 생각합니다.”</div><br><div class="summaryBox"><b>전통시장 상인</b><br>“노인 손님이 많은 시장이라 엘리베이터가 생기면 시장을 찾기 편해지는 분들이 분명히 있을 것입니다. 다만 공사를 오래 하면 통행이 불편해져 주변 상인들의 매출이 줄 수도 있습니다. 설치 여부뿐 아니라 <b>공사 기간과 위치, 시장으로 이어지는 이동 경로까지 함께 고려한 계획</b>이 필요합니다.”</div><br><div class="summaryBox"><b>일반 시민</b><br>“필요한 곳이 많다고 해서 한정된 예산으로 모든 역에 한꺼번에 설치할 수는 없다고 생각합니다. 어떤 역을 먼저 선택했는지 시민들이 납득할 수 있도록 이용객 수, 교통약자 이용 정도, 병원·복지시설 접근성, 공사 비용 같은 <b>선정 기준을 공개하는 것이 중요</b>합니다.”</div>`},

  }

input=e=>{state.issueSummary=e.target.value;queueSave();let ok=updateWritingStatus(state.issueSummary,80,'issue',t);document.getElementById('next').disabled=!(ok&&state.priorityRight&&state.priorityCriterion)};for(let id of ['priorityRight','priorityCriterion'])document.getElementById(id).onchange=e=>{state[id]=e.target.value;queueSave();document.getElementById('next').disabled=!(writingOkay(state.issueSummary,80)&&state.priorityRight&&state.priorityCriterion)};document.getElementById('next').onclick=()=>{if(!(writingOkay(state.issueSummary,80)&&state.priorityRight&&state.priorityCriterion))return;state.step=3;queueSave();render()}}

function submitted(){let canEdit=server&&session&&session.is_open;root.innerHTML=wrap(`<main><section class="receipt"><div class="kicker">MISSION COMPLETE</div><h1>${esc(stu?.name||'학생')} 시장님의 정책이 서버에 접수되었습니다.</h1><p><b>최근 제출 시각:</b> ${state.receiptTime?timeOnly(state.receiptTime):'확인됨'}</p><p><b>활동시간:</b> ${(+session.extra_seconds||0)>0?'추가시간 '+fmtTime(session.extra_seconds)+(session.penalty_exempt?' · 시간감점 면제':' · 시간감점 -'+(+session.time_penalty||calcTimePenalty(session.extra_seconds))+'점'):'기본 90분 이내 제출 · 시간감점 없음'}</p><p>자료 탐색, 문제 정의, 정책 설계, 권리·자료 분석, 수혜·부담 집단 비교, 추가 정보 재판단까지 모두 완료했습니다.</p><button class="btn green" type="button" onclick="openSubmittedReview()" style="margin-top:10px">📄 내가 제출한 내용 다시 확인하기</button>${canEdit?`<div class="notice warn" style="margin-top:10px"><b>수정 가능:</b> 수업 서버가 열려 있는 동안에는 답안을 다시 수정한 뒤 재제출할 수 있습니다. 수정 시작 후에는 현재 제출 상태가 임시 해제되므로 수정 완료 뒤 반드시 다시 제출하세요.</div><button class="btn secondary" type="button" style="margin-top:10px" onclick="editAfterSubmit()">답안 다시 수정하기</button>`:''}</section><section class="card"><h3>총 작성량</h3><p>문제 정의 ${state.issueSummary.length}자 · 권리 분석 ${state.answers[0].length}자 · 자료/예산 ${state.answers[1].length}자 · 한계/보완 ${state.answers[2].length}자 · 수혜·부담 비교 ${state.impactNote.length}자 · 최종 판단 ${state.finalReason.length}자</p></section></main>`)}

function editAfterSubmit(){if(server&&session&&!session.is_open)return alert('수업 시간이 마감되어 더 이상 수정할 수 없습니다.');if(!confirm('답안을 다시 수정하시겠습니까? 수정 시작 후에는 현재 제출 상태가 임시 해제되며, 수정 완료 뒤 반드시 다시 최종 제출해야 합니다.'))return;state.submitted=false;state.submitPending=false;state.step=(state.issueSummary&&state.priorityRight&&state.priorityCriterion&&state.impactNote?6:2);saveLocal();saveNow();render()}
function closedView(){root.innerHTML=wrap(`<main><section class="card hero"><div class="kicker">수행평가 대기</div><h1>아직 수행평가가 열리지 않았습니다.</h1><p>선생님이 개방하면 같은 주소에서 새로고침하세요.</p></section></main>`)}
function monitorPage(){root.innerHTML=wrap(`<main class="teacherWide"><section class="card hero"><div class="kicker">CLASSROOM LIVE MONITOR · v9.3</div><h1>학생 실시간 진행현황</h1><p>서버는 다른 컴퓨터에서 실행 중이며, 이 화면은 <b>읽기 전용</b>입니다. 차시 개방·마감, 답안 열람, 채점, AI 설정은 할 수 없습니다.</p></section><section class="card"><div class="notice good"><b>5초 자동 갱신</b><br>학생의 접속 여부, 현재 단계, 답안별 작성 진척, 남은 기본시간, 추가시간·감점, 제출 여부와 최근 제출 시각을 확인합니다.</div><div class="teacherFilters" style="margin-top:10px"><label>필터 <select id="monitorFilter"><option value="active" selected>활동 학생만</option><option value="online">접속 중</option><option value="offline">활동 후 나감</option><option value="submitted">제출 완료</option><option value="unsubmitted">활동 중·미제출</option><option value="simulation">🧪 가상 학생만</option><option value="all">전체 명단</option></select></label><button class="btn secondary mini" id="monitorRefresh" style="width:auto">지금 새로고침</button></div><div id="monitorSession" class="notice" style="margin-top:8px">수업 상태 확인 중…</div><div id="monitorSummary" class="liveSummary"></div></section><section class="card"><h3>학생 진행 상황</h3><div class="teacherTableWrap" id="monitorTable"><p class="muted" style="padding:12px">학생 접속을 확인하고 있습니다.</p></div></section></main>`,true);if(!server)return;document.querySelector('#monitorRefresh').onclick=loadMonitorData;document.querySelector('#monitorFilter').onchange=e=>{monitorFilter=e.target.value;renderMonitorTable()};loadMonitorData();clearInterval(monitorTimer);monitorTimer=setInterval(loadMonitorData,5000)}
async function loadMonitorData(){try{let d=await api('/api/monitor/submissions?token='+encodeURIComponent(monitorToken));monitorRows=d.rows||[];let ss=document.querySelector('#monitorSession');if(ss){let open=!!d.session?.is_open,label=periodLabel(d.session?.period_type);ss.className='notice '+(open?'good':'warn');ss.innerHTML=open?`<b>🟢 ${classLabel(d.session.class_no)} · ${label} 개방 중</b><br>학생별 총 남은 활동시간은 각자의 참여 기록에 따라 계산됩니다.`:'<b>⚪ 수행평가 대기</b><br>현재 개방된 반·차시가 없습니다.'}renderMonitorSummary();renderMonitorTable()}catch(e){let box=document.querySelector('#monitorTable');if(box)box.innerHTML='<div class="notice warn"><b>모니터 연결 실패</b><br>'+esc(e.message)+'</div>'}}
function monitorFilteredRows(){return monitorRows.filter(r=>{let active=!!r.has_activity||!!r.online||!!r.submitted||!!r.last_seen;if(monitorFilter==='active')return active;if(monitorFilter==='online')return !!r.online;if(monitorFilter==='offline')return active&&!r.online;if(monitorFilter==='simulation')return String(r.student_id||'').startsWith('SIM');if(monitorFilter==='submitted')return !!r.submitted;if(monitorFilter==='unsubmitted')return active&&!r.submitted;return true})}
function renderMonitorSummary(){let box=document.querySelector('#monitorSummary');if(!box)return;let real=monitorRows.filter(r=>!String(r.student_id||'').startsWith('SIM')),simRows=monitorRows.filter(r=>String(r.student_id||'').startsWith('SIM')),on=real.filter(r=>r.online).length,participated=real.filter(r=>r.has_activity).length,done=real.filter(r=>r.submitted).length,simOn=simRows.filter(r=>r.online).length;box.innerHTML=`<span>🟢 실제 접속 <b>${on}명</b></span><span>👥 실제 참여 <b>${participated}명</b></span><span>✅ 실제 제출 <b>${done}명</b></span>${simRows.length?`<span>🧪 가상 학생 <b>${simRows.length}명</b> · 접속 ${simOn}명</span>`:''}`}
function renderMonitorTable(){let box=document.querySelector('#monitorTable');if(!box)return;let rows=monitorFilteredRows();if(!rows.length){box.innerHTML='<p class="muted" style="padding:12px">아직 이 조건에 해당하는 학생이 없습니다. 전체 명단이 필요하면 필터에서 ‘전체 명단’을 선택하세요.</p>';return}box.innerHTML=`<table class="teacherTable"><tr><th>접속</th><th>학번</th><th>이름</th><th>차시 기록</th><th>남은 시간</th><th>추가시간/감점</th><th>현재 단계</th><th>150자 답안 진행</th><th>마지막 접속</th><th>자료확인</th><th>제출</th><th>최근 제출 시각</th></tr>${rows.map(r=>{let x={submitted:!!r.submitted,presenceStep:+r.step||1,activeAnswer:r.active_answer||'',time:r.time||{}};return `<tr><td><span class="livePill ${r.online?'on':'off'}"><span class="liveDot"></span>${r.online?'접속 중':'나감'}</span></td><td>${String(r.student_id||'').startsWith('SIM')?'🧪 ':''}${esc(r.student_id)}</td><td>${esc(r.name)}</td><td>${timeHistoryHtml(r.time)}</td><td><b>${fmtTime(r.time?.remaining_seconds??5400)}</b></td><td>${timePenaltyHtml(r.time)}</td><td><span class="stageLabel">${stageText(x)}</span></td><td>${answerProgressHtml(r,null)}</td><td><span class="lastSeen">${timeOnly(r.last_seen)}</span></td><td>${+r.resource_checks||0}/5</td><td>${r.submitted?'완료':'진행'}</td><td>${submissionTimeHtml(r)}</td></tr>`}).join('')}</table>`}

function teacherUnlockPage(){root.innerHTML=wrap(`<main><section class="card hero"><div class="kicker">TEACHER CONSOLE · v9.3 CLOUD</div><h1>교사용 관리화면</h1><p>인터넷 서버형에서는 교사용 화면도 외부에서 열 수 있으므로 PIN을 한 번 확인합니다. 이 브라우저에는 이후 자동으로 기억됩니다.</p></section><section class="card"><label>교사용 PIN</label><input type="password" id="teacherPinInput" inputmode="numeric" placeholder="Railway에 설정한 PIN"><div style="height:10px"></div><button class="btn" id="teacherUnlockBtn">교사용 화면 열기</button><div id="teacherUnlockMsg"></div></section></main>`,true);let b=document.querySelector('#teacherUnlockBtn');b.onclick=async()=>{let v=(document.querySelector('#teacherPinInput').value||'').trim(),m=document.querySelector('#teacherUnlockMsg');if(!v)return alert('교사용 PIN을 입력하세요.');b.disabled=true;b.textContent='확인 중…';try{await api('/api/teacher/submissions?pin='+encodeURIComponent(v));localStorage.setItem('HR9_TEACHER_PIN',v);teacherPage()}catch(e){m.innerHTML='<div class="notice warn" style="margin-top:10px"><b>PIN을 확인해 주세요.</b><br>'+esc(e.message)+'</div>'}finally{b.disabled=false;b.textContent='교사용 화면 열기'}}}

function parsePayload(r){try{return typeof r.payload==='string'?JSON.parse(r.payload||'{}'):(r.payload||{})}catch(e){return {}}}
function rowStatus(r){let p=parsePayload(r);return {p,a:r.ai_grade?JSON.parse(r.ai_grade):null,g:r.teacher_grade?JSON.parse(r.teacher_grade):null,submitted:!!r.submitted,online:!!r.online,lastSeen:r.last_seen||'',presenceStep:+r.presence_step||+p.step||1,activeAnswer:r.active_answer||'',time:r.time||{}}}

function timePenaltyHtml(t={}){let ex=+t.extra_seconds||0,pen=+t.time_penalty||0;if(ex<=0)return '<span class="small muted">추가 없음</span>';return `<span class="small"><b>+${fmtTime(ex)}</b><br>${t.penalty_exempt?'<span class="switchOn">감점 면제</span>':`<span style="color:#b33434;font-weight:900">-${pen}점</span>`}</span>`}

function stageText(x){if(x.submitted)return '제출 완료';let a=x.activeAnswer;if(x.presenceStep===2&&a==='issue')return '문제 정의 · 80자 작성';if(x.presenceStep===4&&a){return '근거 작성 · '+({a0:'① 권리',a1:'② 자료·예산',a2:'③ 한계·보완'}[a]||'답안')}if(x.presenceStep===5&&a==='impact')return '이해관계자 비교 · 80자';if(x.presenceStep===6&&a==='final')return '최종 재판단 · ④ 최종';return ({1:'자료 탐색',2:'문제 정의·기준',3:'1차 정책 설계',4:'근거 작성',5:'이해관계자 비교',6:'최종 재판단'})[x.presenceStep]||'입장'}

function submissionTimeHtml(r){let last=r.last_submitted_at||r.submitted_at||'',count=+r.submission_count||0;if(!last)return '<span class="lastSeen">-</span>';let badge=count>1?`<br><span class="attemptBadge">재제출 ${count}회</span>`:'';return `<span class="lastSeen"><b>${timeOnly(last)}</b></span>${badge}`}
function renderLiveSummary(){let box=document.getElementById('liveSummary');if(!box)return;let real=teacherRows.filter(r=>!String(r.student_id||'').startsWith('SIM')),simRows=teacherRows.filter(r=>String(r.student_id||'').startsWith('SIM')),on=real.filter(r=>r.online).length,participated=real.filter(r=>r.has_activity).length,done=real.filter(r=>r.submitted).length,simOn=simRows.filter(r=>r.online).length;box.innerHTML=`<span>🟢 실제 접속 <b>${on}명</b></span><span>👥 실제 참여 <b>${participated}명</b></span><span>✅ 실제 제출 <b>${done}명</b></span>${simRows.length?`<span>🧪 가상 학생 <b>${simRows.length}명</b> · 접속 ${simOn}명</span>`:''}`}
function filteredRows(){return teacherRows.filter(r=>{let x=rowStatus(r),active=!!r.has_activity||!!x.online||!!x.submitted||!!x.lastSeen;if(teacherFilter==='active')return active;if(teacherFilter==='unsubmitted')return active&&!x.submitted;if(teacherFilter==='submitted')return x.submitted;if(teacherFilter==='aiPending')return x.submitted&&!x.a;if(teacherFilter==='teacherPending')return x.submitted&&!x.g;if(teacherFilter==='online')return x.online;if(teacherFilter==='offline')return active&&!x.online;if(teacherFilter==='simulation')return String(r.student_id||'').startsWith('SIM');return true})}

function renderChoiceSummary(){let box=document.querySelector('#choiceSummary');if(!box)return;let rows=teacherRows.filter(r=>r.submitted&&!String(r.student_id||'').startsWith('SIM')),initial={},final={};stations.forEach(s=>{initial[s.id]=0;final[s.id]=0});rows.forEach(r=>{let p=parsePayload(r);(p.stations||[]).forEach(id=>{if(id in initial)initial[id]++});(p.finalPlan||[]).forEach(id=>{if(id in final)final[id]++})});let table=(title,obj)=>`<div><h4>${title} · 제출 ${rows.length}명 기준</h4><table class="distTable">${stations.map(s=>`<tr><td>${s.name}</td><td><b>${obj[s.id]}명</b></td><td>${rows.length?Math.round(obj[s.id]/rows.length*100):0}%</td></tr>`).join('')}</table></div>`;box.innerHTML=table('1차 선택',initial)+table('최종 선택',final)}

>${esc(p.impactNote||'')}</p></div><div class="previousAnswer"><h4>최종 재판단 · ${(p.finalReason||'').length}자</h4><p>${esc(p.finalReason||'')}</p></div><div id="aiGradeBox" class="aiBox">${a?renderAiGrade(a):'<span class="aiTag">AI 가채점</span><p>아직 가채점하지 않았습니다.</p>'}</div><div class="row"><button class="btn secondary" onclick="runAiGrade('${esc(sid)}')">AI 가채점 요청</button>${a?`<button class="btn secondary" onclick="applyAiGrade('${esc(sid)}')">AI 점수 입력란에 적용</button>`:''}</div><h3>교사 최종 확인</h3>${gradeInputs(g)}<div id="finalScorePreview" class="notice" style="margin-top:10px"></div><label>교사 피드백</label><textarea id="teacherComment">${esc(r.teacher_comment||'')}</textarea><button class="btn" style="margin-top:10px" onclick="saveTeacherGrade('${esc(sid)}')">교사 채점 저장</button>`;document.querySelector('#modal').classList.add('show');document.querySelectorAll('#gRights,#gEvidence,#gLogic,#gLimitations,#gRevision').forEach(e=>e.addEventListener('input',()=>updateFinalScorePreview('${esc(sid)}')));updateFinalScorePreview('${esc(sid)}')}
function updateFinalScorePreview(sid){let r=teacherRows.find(x=>x.student_id===sid),ids=['gRights','gEvidence','gLogic','gLimitations','gRevision'],content=ids.reduce((s,id)=>s+(+document.getElementById(id)?.value||0),0),pen=+r?.time?.time_penalty||0,box=document.getElementById('finalScorePreview');if(box)box.innerHTML=`<b>예상 최종점수 ${Math.max(0,content-pen)}점</b> · 내용 ${content}점 ${pen?`- 시간감점 ${pen}점`:''}${r?.time?.penalty_exempt?' · 감점 면제':''}`}

async function uploadRoster(){let f=document.querySelector('#rosterFile').files[0];if(!f)return alert('CSV 파일을 선택하세요.');let text=await f.text(),lines=text.split(/\r?\n/).filter(x=>x.trim()),rows=[];if(!lines.length)return alert('빈 CSV 파일입니다.');let parse=s=>s.split(',').map(x=>x.trim().replace(/^"|"$/g,''));let header=parse(lines[0]),sidIdx=header.findIndex(x=>/학번|student.?id/i.test(x)),nameIdx=header.findIndex(x=>/성명|이름|name/i.test(x));if(sidIdx<0)sidIdx=0;if(nameIdx<0)nameIdx=1;for(let i=1;i<lines.length;i++){let a=parse(lines[i]);if(a[sidIdx]&&a[nameIdx])rows.push({student_id:a[sidIdx],name:a[nameIdx]})}if(!rows.length)return alert('CSV에서 학번과 이름(또는 성명) 열을 찾지 못했습니다.');try{await api('/api/teacher/roster/import',{method:'POST',body:JSON.stringify({pin:pin(),rows})});alert(rows.length+'명의 명단을 업로드했습니다. 현재 검증 ON/OFF 상태는 그대로 유지됩니다.');await loadTeacherData()}catch(e){alert(e.message)}}

let currentZoom=1,zoomBaseScale=1;
function applyZoomScale(){const img=document.getElementById('imgZoomTarget'),inner=document.getElementById('imgZoomInner'),scale=zoomBaseScale*currentZoom;if(!img.naturalWidth)return;img.style.transform='scale('+scale+')';inner.style.width=(img.naturalWidth*scale)+'px';inner.style.height=(img.naturalHeight*scale)+'px';inner.style.margin=(img.naturalWidth*scale<inner.parentElement.clientWidth-28)?'0 auto':'0'}

function zoomIn(){currentZoom=Math.min(5,Math.round((currentZoom+.25)*100)/100);applyZoomScale()}
